    draftTimer.current=setTimeout(()=>{
      try{
        const payload={savedAt:new Date().toISOString(),form:{description:form.description,amount:form.amount,category:form.category,date:form.date,notes:form.notes,ivaRate:form.ivaRate===""?"":(form.ivaRate??ivaRateToFormString(readIvaDefault())),departmentId:form.departmentId||"",ownerId:form.ownerId||"",
          expenseType:form.expenseType||"expense",vendor:form.vendor||"",invoiceDueDateDirect:form.invoiceDueDateDirect||"",cadenceKey:form.cadenceKey||"once",cadenceCustomMonths:form.cadenceCustomMonths||"1",cadenceCustomAmount:form.cadenceCustomAmount||"1",cadenceCustomUnit:form.cadenceCustomUnit||"months",proveedor:form.proveedor||""},splitOn,spMode,splits:(splits||[]).map(s=>({userId:s.userId,checked:!!s.checked,percent:s.percent,value:s.value}))};
        sessionStorage.setItem(DRAFT_KEY,JSON.stringify(payload));
      }catch(e){}
    },500);
    return()=>clearTimeout(draftTimer.current);
  },[form,splitOn,spMode,splits]);
  const totVal=splits.filter(s=>s.checked).reduce((a,s)=>a+(Number(s.value)||0),0);
  const checkedSplitCount=splits.filter(s=>s.checked).length;
  const amtSumBad=splitOn&&spMode==="amount"&&expAmt>0&&Math.abs(totVal-expAmt)>0.01;
  const splitSubmitBlocked=splitOn&&(users.length<2||checkedSplitCount<2||amtSumBad);
  return(
    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
        <div style={{fontWeight:700,fontSize:15,color:actionColor,transition:"color 0.2s ease"}}>{isInv ? "Nueva factura" : "Nuevo gasto"}</div>
        <button style={{border:"none",background:"none",color:"#9CAA9F",fontSize:21,cursor:"pointer",lineHeight:1,padding:"0 4px"}} onClick={()=>dismissOverlay()} aria-label="Cerrar">×</button>
      </div>
      <ExpenseFormFields
        t={t}
        form={form}
        setForm={setForm}
        ownerId={ownerId}
        ownerUser={ownerUser}
        activeCats={activeCats}
        departments={departments}
        users={pickableUsers(users)}
        ivaRates={ivaRates}
        hi={hi}
        actionColor={actionColor}
        splitOn={splitOn}
        setSplitOn={setSplitOn}
        splits={splits}
        setSplits={setSplits}
        spMode={spMode}
        setSpMode={setSpMode}
        splitSubmitBlocked={splitSubmitBlocked}
        submitAttempt={submitAttempt}
        recPrev={recPrev}
        onReceiptClear={()=>{setReceipt(null);setRecPrev(null);ivaScanB64Ref.current=null;}}
        fileRef={fileRef}
        startCam={startCam}
        apiReceiptPreview={null}
        onClearApiReceiptPreview={undefined}
      />
      {formError&&<div style={{padding:"8px 12px",borderRadius:8,background:"#FCEBEB",color:"#791F1F",fontSize:12,marginBottom:8}}>{formError}</div>}
      <div style={{position:"relative",width:"100%",marginTop:6}}>
        <button type="button" className="btn-primary" disabled={submitting} style={{width:"100%",padding:11,background:actionColor,opacity:submitting?0.6:((!expenseValid||splitSubmitBlocked)?0.5:1),cursor:submitting?"not-allowed":((!expenseValid||splitSubmitBlocked)?"not-allowed":"pointer"),transition:"color 0.2s ease, background-color 0.2s ease, opacity 0.2s ease"}}
          onMouseEnter={e=>{if(submitting||!expenseValid||splitSubmitBlocked)return;e.currentTarget.style.background=submitHoverBg;}}
          onMouseLeave={e=>{e.currentTarget.style.background=actionColor;}}
          onClick={()=>{
            if(submitting)return;
            setFormError("");
            if(splitSubmitBlocked){
              setFormError("Revisa el reparto antes de enviar.");
              return;
            }
            if(!expenseValid){
              setSubmitAttempt(true);setFormError("Completa los campos obligatorios marcados con *");return;
            }
            submitExp();
          }}>{submitting ? "Enviando..." : (isInv ? t("action.submitBill") : t("action.submit"))}</button>
        {!expenseValid&&!splitSubmitBlocked&&(
          <button type="button" aria-label="Completar campos obligatorios" style={{position:"absolute",inset:0,opacity:0.001,width:"100%",height:"100%",cursor:"pointer"}}
            onClick={()=>setSubmitAttempt(true)}/>)}
      </div>
    </div>
  );
}

/* ── DETAIL PANEL ──────────────────────────────────────────────────────────── */
function DetailPanel(){
  const{t,expenses,cats,users,detailId,setDetailId,setPanel,dismissOverlay,isAdmin,user,aNote,setANote,approve,reconsiderExpense,removeAttachment,editExp,deleteExp,fixResubmitExpense,addExpenseComment,markCommentsSeen,stopRecurrence,ivaRates,departments,defaultDeptId,resetForm,
        fileRef,startCam,receiptAltHandlerRef}=useApp();
  const [editMode,setEditMode]=useState(false);
  const [ef,setEf]=useState({});        // edit form fields
  const [efDirty,setEfDirty]=useState(false);
  const [efRecPrev,setEfRecPrev]=useState(null);
  const [editApiReceipt,setEditApiReceipt]=useState(null);
  const [efSplitOn,setEfSplitOn]=useState(false);
  const [efSplits,setEfSplits]=useState([]);
  const [efSpMode,setEfSpMode]=useState("amount");
  const [editSubmitAttempt,setEditSubmitAttempt]=useState(false);
  const [commentText,setCommentText]=useState("");
  const [serverAudit,setServerAudit]=useState([]);
  const [editSaving,setEditSaving]=useState(false);
  const e=expenses.find(x=>x.id===detailId);
  useEffect(()=>{
    if(detailId)markCommentsSeen(detailId);
  },[detailId]);
  useEffect(()=>{
    if(!editMode){receiptAltHandlerRef.current=null;return;}
    receiptAltHandlerRef.current=({b64,type,preview})=>{
      setEditApiReceipt(prev=>{
        if(prev&&prev.kind==="img"&&prev.url)try{URL.revokeObjectURL(prev.url);}catch(e2){}
        return null;
      });
      setEf(p=>({...p,receipt:b64,receiptType:type}));
      setEfRecPrev(preview);
      setEfDirty(true);
    };
    return()=>{receiptAltHandlerRef.current=null;};
  },[editMode]);
  useEffect(()=>{
    if(!editMode||!detailId){
      setEditApiReceipt(prev=>{
        if(prev&&prev.kind==="img"&&prev.url)try{URL.revokeObjectURL(prev.url);}catch(e2){}
        return null;
      });
      return;
    }
    const exp=expenses.find(x=>x.id===detailId);
    if(!exp||exp.receipt||!exp.receiptPath||!AUTH_URL){
      setEditApiReceipt(prev=>{
        if(prev&&prev.kind==="img"&&prev.url)try{URL.revokeObjectURL(prev.url);}catch(e2){}
        return null;
      });
      return;
    }
    let dead=false;
    let objUrl=null;
    (async()=>{
      try{
        const blob=await API.fetchBinary("/expenses/"+encodeURIComponent(exp.id)+"/receipt");
        if(dead)return;
        if(blob.type&&blob.type.includes("pdf")){setEditApiReceipt({kind:"pdf"});return;}
        objUrl=URL.createObjectURL(blob);
        setEditApiReceipt({kind:"img",url:objUrl});
      }catch(err){
        if(!dead)setEditApiReceipt(null);
      }
    })();
    return()=>{
      dead=true;
      if(objUrl)try{URL.revokeObjectURL(objUrl);}catch(e2){}
    };
  },[editMode,detailId,expenses]);
  useEffect(()=>{
    if(!AUTH_URL||!detailId){setServerAudit([]);return;}
    let dead=false;
    void API.get("/expenses/"+encodeURIComponent(detailId)+"/audit").then(d=>{
      if(dead)return;
      setServerAudit(Array.isArray(d.entries)?d.entries:[]);
    }).catch(()=>{if(!dead)setServerAudit([]);});
    return()=>{dead=true;};
  },[detailId,e?.updatedAt,e?.status]);
  const useServerAudit=!!AUTH_URL;
  const timelineEvents=React.useMemo(()=>{
    if(!e)return[];
    return collapseTimelineEvents(buildExpenseDetailTimelineEvents(e,serverAudit,useServerAudit,departments,t));
  },[e,serverAudit,useServerAudit,departments,t]);
  if(!e)return null;
  const getU=id=>{
    const u=users.find(x=>x.id===id);

    return u;
  };
  const approverIds=effectiveExpenseApproverIds(e,cats,users);
  const st=getItemStatus(e,cats,users);
  const approvalActs=availableApprovalActions(e,user,users,cats);
  const showApprovalUi=!editSaving&&(approvalActs.approve||approvalActs.reject||approvalActs.reconsider);
  const detailAccent = e && e.expenseType === 'invoice' ? F : G;
  const detailSublistStatusTone = (s) =>
    ST[s] || (s === 'deleted' ? { bg: '#F3F4F6', color: '#6B7280' } : ST.pending);
  const detailTopStatusTone =
    st === 'approved'
      ? { bg: detailAccent, color: '#FAF7F2' }
      : detailSublistStatusTone(st);
  const canEdit=user.id===e.submittedBy||isAdmin;
  const ivaRowLabel=(()=>{
    if(e.ivaRate===null)return formatIvaOptionLabel(IVA_RATE_SIN_IVA);
    if(e.ivaRate!==undefined&&e.ivaRate!==null){
      const m=ivaRates.find(r=>r.value===e.ivaRate);
      return m?formatIvaOptionLabel(m):`${e.ivaRate}%`;
    }
    return t("expense.ivaNotTracked");
  })();

  const startEdit=()=>{
    const defIva=e.ivaRate===null?"":(e.ivaRate!==undefined&&e.ivaRate!==null?String(e.ivaRate):ivaRateToFormString(readIvaDefault()));
    const fromRule=recurrenceRuleToCadenceForForm(e.recurrenceRule);
    const ckStored=e.cadenceKey!=null&&String(e.cadenceKey).trim()!==""?String(e.cadenceKey).trim():"";
    const cadenceKey=(ckStored&&ckStored!=="once")?ckStored:(e.recurring===1?fromRule.cadenceKey:"once");
    const cadenceCustomMonths=(ckStored&&ckStored!=="once"&&e.cadenceCustomMonths!=null)?String(e.cadenceCustomMonths):fromRule.cadenceCustomMonths;
    const cadenceCustomAmount=fromRule.cadenceCustomAmount!=null?String(fromRule.cadenceCustomAmount):(e.cadenceCustomMonths!=null?String(e.cadenceCustomMonths):"1");
    const cadenceCustomUnit=fromRule.cadenceCustomUnit||"months";
    const invTerms=e.expenseType==="invoice"?expenseInvoiceTermsFromEntity(e):{invoiceDueDateDirect:""};
    const prov=String((e.proveedor!=null&&String(e.proveedor).trim()!=="")?e.proveedor:(e.vendor||"")).trim();
    setEf({description:e.description,amount:String(e.amount),category:e.category,
      date:e.date,notes:e.notes||"",receipt:e.receipt||null,receiptType:e.receiptType||null,
      paidBy:e.paidBy,
      ownerId:e.ownerId||e.submittedBy,
      ivaRate:defIva,
      departmentId:e.departmentId||defaultDeptId,
      cadenceKey,
      cadenceCustomMonths,
      cadenceCustomAmount,
      cadenceCustomUnit,
      expenseType:e.expenseType||"expense",
      proveedor:prov,
      vendor:String(e.vendor||prov).trim(),
      invoiceDueDateDirect:invTerms.invoiceDueDateDirect,
    });
    const ownerNow=e.ownerId||e.submittedBy||user.id;
    const amtNow=parseMoney(String(e.amount))||0;
    const baseSplits=users.map(u=>{
      const hit=(e.paidBy||[]).find(p=>p.userId===u.id);
      return{
        userId:u.id,
        checked:!!hit||u.id===ownerNow,
        percent:Number(hit?.pct)||0,
        value:Number(hit?.amount)||0,
      };
    });
    const splitModeInit=e.splitMode==="amount"?"amount":"amount";
    const checkedTotal=Math.max(1,baseSplits.filter(x=>x.checked).length);
    setEfSplitOn((e.paidBy||[]).length>1);
    setEfSpMode(splitModeInit);
    setEfSplits(baseSplits.map(s=>s.checked?s:{...s,percent:0,value:0}).map(s=>s.checked&&splitModeInit==="equal"?{...s,value:parseFloat((amtNow/checkedTotal).toFixed(2))}:s));
    setEfRecPrev(e.receipt?(e.receiptType?.includes("pdf")?"PDF":`data:${e.receiptType||"image/jpeg"};base64,${e.receipt}`):null);
    setEditApiReceipt(prev=>{
      if(prev&&prev.kind==="img"&&prev.url)try{URL.revokeObjectURL(prev.url);}catch(e2){}
      return null;
    });
    receiptAltHandlerRef.current=null;
    setEditSubmitAttempt(false);
    setEditMode(true);setEfDirty(false);
  };
  const cancelEdit=()=>{
    void (async()=>{
      if(efDirty&&!(await confirmUI(t("expense.unsaved"))))return;
      receiptAltHandlerRef.current=null;
      setEditApiReceipt(prev=>{
        if(prev&&prev.kind==="img"&&prev.url)try{URL.revokeObjectURL(prev.url);}catch(e2){}
        return null;
      });
      setEditMode(false);setEfDirty(false);
    })();
  };
  const saveEdit=()=>{
    if(!ef.description||!ef.amount){return;}
    if(!ef.departmentId){dispatchSolanaToast(t("msg.deptRequired"),"error");return;}
    const editDate = new Date(ef.date);
    const now = new Date();
    const minDate = new Date(now.getFullYear() - 5, 0, 1);
    const maxDate = new Date(now.getFullYear() + 1, 11, 31);
    if(!ef.date || isNaN(editDate.getTime()) || editDate < minDate || editDate > maxDate){dispatchSolanaToast("La fecha debe estar entre los últimos 5 años y el próximo año.","error");return;}
    void (async()=>{
      if(!(await confirmUI(t("expense.confirmEdit"))))return;
    const amt=parseMoney(ef.amount)||e.amount;
    let efPaidBy=ef.paidBy;
    let efSplitMode=(ef.paidBy||[]).length>1?e.splitMode:undefined;
    if(efSplitOn&&efSplits.filter(s=>s.checked).length>1){
      efPaidBy=buildPaidByFromSplitState(efSplits,amt,efSpMode);
      efSplitMode=efPaidBy.length>1?efSpMode:undefined;
    }else{
      const ownerId=ef.ownerId||e.ownerId||e.submittedBy||user.id;
      efPaidBy=[{userId:ownerId,amount:amt,pct:100}];
      efSplitMode=undefined;
    }
    const ivaRate=parseFormIvaRateString(ef.ivaRate);
    const ivaAmount=calcIvaParts(amt,ivaRate).iva;
    const recEdit=cadenceToRecurringPayload(ef);
    setEditSaving(true);
    try{
      await editExp(e.id,{
        description:ef.description,
        amount:amt,
        category:ef.category,date:ef.date,
        notes:ef.notes,receipt:ef.receipt||null,
        receiptType:ef.receiptType||null,
        ownerId:ef.ownerId||e.ownerId||e.submittedBy,
        paidBy:efPaidBy,
        splitMode:efSplitMode,
        ivaRate,ivaAmount,
        departmentId:ef.departmentId||defaultDeptId,
        recurring:recEdit.recurring,
        recurrenceRule:recEdit.recurrenceRule,
        expenseType:ef.expenseType||"expense",
        vendor: ef.vendor || "",
        invoiceDueDateDirect: ef.invoiceDueDateDirect || "",
        dueDate: computeInvoiceDueISO(ef) || null,
        proveedor:String(ef.proveedor||"").trim(),
      },e);
      receiptAltHandlerRef.current=null;
      setEditMode(false);setEfDirty(false);
    }finally{
      setEditSaving(false);
    }
    })();
  };
  const clearEditApiReceiptPreview=()=>{
    setEditApiReceipt(prev=>{
      if(prev&&prev.kind==="img"&&prev.url)try{URL.revokeObjectURL(prev.url);}catch(e2){}
      return null;
    });
  };
  const setEfWrapped=u=>{
    setEf(p=>{
      const n=typeof u==="function"?u(p):{...p,...u};
      if(n.ownerId!==p.ownerId)setEfSplits(sp=>sp.map(s=>s.userId===n.ownerId?{...s,checked:true}:s));
      return n;
    });
    setEfDirty(true);
  };

  const activeCats=cats.filter(c=>!c.archived);
  const isEditInv=editMode&&ef.expenseType==="invoice";
  const editOwnerId=(ef.ownerId&&String(ef.ownerId).trim())?String(ef.ownerId):user.id;
  const editOwnerUser=users.find(u=>u.id===editOwnerId)||user;
  const editExpAmt=parseMoney(ef.amount)||0;
  const editAmountNum=parseMoney(ef.amount);
  const editAmountOk=editAmountNum>0;
  const editIsInv=ef.expenseType==="invoice";
  const editVendorOk=!editIsInv||String(ef.vendor||"").trim().length>0;
  const editProveedorOk=!editIsInv||String(ef.proveedor||"").trim().length>0;
  const editDuePickOk=!editIsInv||String(ef.invoiceDueDateDirect||ef.date||"").trim().length>=10;
  const editExpenseValid=editAmountOk&&String(ef.description||"").trim()&&String(ef.category||"").trim()&&String(ef.date||"").trim()&&!!String(ef.departmentId||"").trim()&&!!editOwnerId&&editVendorOk&&editProveedorOk&&editDuePickOk;
  const editTotVal=efSplits.filter(s=>s.checked).reduce((a,s)=>a+(Number(s.value)||0),0);
  const editCheckedSplit=efSplits.filter(s=>s.checked).length;
  const editAmtSumBad=efSplitOn&&efSpMode==="amount"&&editExpAmt>0&&Math.abs(editTotVal-editExpAmt)>0.01;
  const editSplitBlocked=efSplitOn&&(users.length<2||editCheckedSplit<2||editAmtSumBad);
  const editHi=editSubmitAttempt&&!editExpenseValid;
  const editActionColor=editIsInv?F:G;

    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:11}}>
        <div style={{fontWeight:700,fontSize:editMode?15:14,color:(editMode?editActionColor:G),transition:"color 0.2s ease"}}>{editMode?(isEditInv?"Editar gasto · Factura":"Editar gasto"):"Detalle de gasto"}</div>
        <div style={{display:"flex",gap:6,alignItems:"center"}}>
          {!editMode&&canEdit&&(isAdmin||st!=="approved")&&<button style={{fontSize:10,padding:"2px 8px",borderRadius:5,border:`1px solid ${detailAccent}`,background:"transparent",color:detailAccent,cursor:"pointer",fontFamily:"inherit"}} onClick={startEdit}>{t("action.editItem")}</button>}
          {!editMode&&(user.id===e.submittedBy||isAdmin)&&<button style={{fontSize:10,padding:"2px 8px",borderRadius:5,border:"1px solid #ECA3A3",background:"transparent",color:"#991B1B",cursor:"pointer",fontFamily:"inherit"}} onClick={()=>deleteExp(e.id)}>{t("action.deleteItem")}</button>}
          <button style={{border:"none",background:"none",color:"#9CAA9F",fontSize:19,cursor:"pointer",lineHeight:1,padding:"0 4px"}} aria-label="Cerrar" onClick={()=>{void (async()=>{if(editMode&&efDirty&&!(await confirmUI(t("expense.unsaved"))))return;receiptAltHandlerRef.current=null;setEditApiReceipt(prev=>{if(prev&&prev.kind==="img"&&prev.url)try{URL.revokeObjectURL(prev.url);}catch(e2){}return null;});setEditMode(false);resetForm();dismissOverlay();})();}}>×</button>
        </div>
      </div>

      {/* EDIT MODE */}
      {editMode&&(
        <div>
          {st==="approved"&&<div style={{padding:"6px 9px",background:"#FEF3C7",borderRadius:6,fontSize:10,color:"#92400E",marginBottom:9}}>{t("expense.reapprovalWarning")}</div>}
          <ExpenseFormFields
            t={t}
            form={ef}
            setForm={setEfWrapped}
            ownerId={editOwnerId}
            ownerUser={editOwnerUser}
            activeCats={activeCats}
            departments={departments}
            users={pickableUsers(users)}
            ivaRates={ivaRates}
            hi={editHi}
            actionColor={editActionColor}
            splitOn={efSplitOn}
            setSplitOn={v=>{setEfSplitOn(v);if(!v)setEfSpMode("amount");setEfDirty(true);}}
            splits={efSplits}
            setSplits={v=>{setEfSplits(v);setEfDirty(true);}}
            spMode={efSpMode}
            setSpMode={v=>{setEfSpMode("amount");setEfDirty(true);}}
            splitSubmitBlocked={editSplitBlocked}
            submitAttempt={editSubmitAttempt}
            recPrev={efRecPrev}
            onReceiptClear={()=>{
              setEf(p=>({...p,receipt:null,receiptType:null}));
              setEfRecPrev(null);
              clearEditApiReceiptPreview();
              setEfDirty(true);
            }}
            fileRef={fileRef}
            startCam={startCam}
            apiReceiptPreview={editApiReceipt}
            onClearApiReceiptPreview={clearEditApiReceiptPreview}
          />
          <div style={{display:"flex",gap:6,marginTop:8}}>
            <button className="btn-primary" style={{flex:1,fontSize:13,padding:"8px",background:editActionColor,opacity:(!editExpenseValid||editSplitBlocked||editSaving)?0.5:1,cursor:(!editExpenseValid||editSplitBlocked||editSaving)?"not-allowed":"pointer",transition:"color 0.2s ease, background-color 0.2s ease, opacity 0.2s ease"}} onMouseEnter={e=>{if(!editExpenseValid||editSplitBlocked||editSaving)return;e.currentTarget.style.background=editSubmitHoverBg;}} onMouseLeave={e=>{e.currentTarget.style.background=editActionColor;}} onClick={()=>{
              if(editSplitBlocked||editSaving)return;
              if(!editExpenseValid){setEditSubmitAttempt(true);return;}
              saveEdit();
            }} disabled={editSaving}>{editSaving?"Guardando…":(t("action.saveChanges")||"Guardar")}</button>
            <button className="btn-secondary" style={{flex:1,fontSize:13,padding:"8px"}} onClick={cancelEdit}>{t("action.cancel")}</button>
          </div>
        </div>
      )}

      {/* READ MODE */}
      {!editMode&&<div style={{minWidth:0,overflow:"visible",minHeight:"auto"}}>
      <div
        data-testid="detail-status-badge"
        data-status={st}
        className={st!=="approved"?statusToneClass(st):""}
        style={{
          display:"inline-block",
          background:detailTopStatusTone.bg,
          color:detailTopStatusTone.color,
          fontWeight:700,
          fontSize:11,
          padding:"3px 10px",
          borderRadius:20,
          letterSpacing:"0.06em",
          marginBottom:7,
          transition:"background-color 0.25s ease-in-out,color 0.25s ease-in-out",
          ...(statusToneClass(st)?{background:undefined,color:undefined}:{}),
        }}
      >{t("status."+st).toUpperCase()}</div>
      <div style={{fontSize:15,fontWeight:700,marginBottom:2}}>{e.description}</div>
      <div style={{fontSize:24,fontWeight:800,color:G,fontVariantNumeric:"tabular-nums",marginBottom:11}}>{fmtExpenseAmt(e)}</div>
      {displayTraceCode(e)&&(
        <ItemCodeBadge code={displayTraceCode(e)} copyHoverAccent={detailAccent}/>
      )}
      {[{l:t("label.date"),v:fmtDate(e.date)},{l:t("label.category"),v:e.category},{l:t("label.department"),v:(e.departmentId&&(departments.find(d=>d.id===e.departmentId)||{}).name)||t("detail.noDepartment")},{l:"Titular",v:getU(e.ownerId||e.submittedBy).name},{l:"Enviado por",v:getU(e.submittedBy).name}].map(({l,v})=>(
        <div key={l} style={{display:"flex",justifyContent:"space-between",padding:"5px 0",borderBottom:"1px solid #F5F0EA",fontSize:12}}><span style={{color:"#9CAA9F"}}>{l}</span><span style={{fontWeight:500}}>{v}</span></div>
      ))}
      {e.expenseType==="invoice"&&(<>
        <div style={{display:"flex",justifyContent:"space-between",padding:"5px 0",borderBottom:"1px solid #F5F0EA",fontSize:12,gap:8}}><span style={{color:"#9CAA9F",flexShrink:0}}>Proveedor</span><span style={{fontWeight:500,textAlign:"right"}}>{String(e.proveedor||e.vendor||"").trim()||"—"}</span></div>
        <div style={{display:"flex",justifyContent:"space-between",padding:"5px 0",borderBottom:"1px solid #F5F0EA",fontSize:12,gap:8}}><span style={{color:"#9CAA9F",flexShrink:0}}>{t("expenses.dueDate")}</span><span style={{fontWeight:500,textAlign:"right"}}>{fmtDate(e.dueDate)}</span></div>
      </>)}
      <div style={{display:"flex",justifyContent:"space-between",padding:"5px 0",borderBottom:"1px solid #F5F0EA",fontSize:12}}>
        <span style={{color:"#9CAA9F"}}>{t("expense.ivaRow")} · {ivaRowLabel}</span>
        <span style={{fontWeight:500}}>{e.ivaRate===null?t("form.ivaAmountDash"):(e.ivaRate!==undefined&&e.ivaRate!==null?(e.ivaRate===0?t("form.ivaAmountDash"):fmt(e.ivaAmount||0)):t("expense.ivaNotTracked"))}</span>
      </div>
      <ExpenseSplitBreakdown e={e} t={t} users={users}/>
      <div style={{padding:"6px 0",borderBottom:"1px solid #F5F0EA"}}>
        <div style={{fontSize:9,color:"#9CAA9F",marginBottom:4}}>{t("label.approval")}</div>
        {approverIds.map(aid=>{const a=approvalVoteFor(e.approvals,aid,users);return(
          <div key={aid} style={{display:"flex",alignItems:"center",gap:5,fontSize:11,marginBottom:2}}>
            <div style={{width:5,height:5,borderRadius:"50%",background:a==="approved"?"#16A34A":a==="rejected"?"#DC2626":"#D97706",flexShrink:0}}/>
            <span>{getU(aid).name}</span>
            <span style={{marginLeft:"auto",color:a==="approved"?"#166534":a==="rejected"?"#991B1B":"#92400E",fontWeight:500}}>{a?t("status."+a):"N/A"}</span>
          </div>
        );})}
      </div>
      {showApprovalUi&&(
        <div style={{marginTop:9,borderTop:`1px solid ${detailAccent}`,paddingTop:9}}>
          {(approvalActs.approve||approvalActs.reject)&&(
            <>
              <label className="lbl" style={{marginBottom:3,color:detailAccent}}>{t("label.decision")}</label>
              <textarea className="inp" rows={2} placeholder={t("label.note")} value={aNote[e.id]||""} onChange={ev=>setANote(p=>({...p,[e.id]:ev.target.value}))} style={{marginBottom:6,resize:"vertical",fontSize:13}}/>
              <div style={{display:"flex",gap:6}}>
                {approvalActs.approve&&(
                  <button className="btn-primary" style={{flex:1,padding:"7px",fontSize:13,background:detailAccent}} onClick={()=>approve(e.id,"approved")}>{t("action.approve")}</button>
                )}
                {approvalActs.reject&&(
                  <button className="btn-danger" title={e.approvedBy === 'auto' ? 'Revocar aprobación automática' : 'Rechazar'} style={{flex:1,padding:"7px",fontSize:13,background:"transparent",color:"#DC2626",border:"2px solid #DC2626",fontWeight:700}} onClick={()=>approve(e.id,"rejected")}>{t("action.reject")}</button>
                )}
              </div>
            </>
          )}
          {(approverIds.includes(user.id))&&approvalActs.reconsider&&!approvalActs.approve&&!approvalActs.reject&&(
            <div>
              {st==="approved"&&(
                <div style={{fontSize:11,color:"#166534",marginBottom:8,fontWeight:600}}>{t("expense.approvedSummary")}</div>
              )}
              <button type="button" className="btn-secondary" style={{width:"100%",padding:"8px",fontSize:13,fontWeight:600}}
                onClick={()=>reconsiderExpense(e.id)}>
                {st==="rejected"?t("action.reopen"):t("action.reconsider")}
              </button>
            </div>
          )}
        </div>
      )}
      {e._apiType==="expense"&&e.status==="rejected"&&e.rejectionNote&&(
        <div style={{marginTop:9,padding:"8px 10px",background:"#FEE2E2",borderRadius:8,fontSize:11,color:"#991B1B"}}><strong>Motivo:</strong> {e.rejectionNote}</div>
      )}
      {expenseIsRecurringNonOnce(e)&&(
        <div style={{marginTop:9,padding:"8px 10px",background:"#F5F0EA",borderRadius:8,fontSize:11}}>
          {isRecurrenceSeriesActive(e)?(
            <>
              <div style={{color:"#6B7B72",marginBottom:6}}>{recurrenceRuleLabel(e.recurrenceRule,t)}</div>
              {(user.id===(e.ownerId||e.submittedBy)||isAdmin)&&(
                <button type="button" className="btn-secondary" style={{width:"100%",padding:"7px",fontSize:12,fontWeight:600}}
                  onClick={()=>stopRecurrence(e.id)}>
                  {t("action.stopRecurrence")}
                </button>
              )}
            </>
          ):e.recurrenceEndDate?(
            <div style={{color:"#6B7B72"}}>{t("expense.recurrenceStopped",{date:fmtDate(e.recurrenceEndDate)})}</div>
          ):null}
        </div>
      )}
      <div style={{marginTop:9,overflow:"visible",minHeight:"auto"}}>
        <AttachmentViewer
          receipt={e.receipt}
          receiptType={e.receiptType}
          receiptPath={e.receiptPath}
          apiExpenseId={e._apiType==="expense"&&!e.receipt&&e.id?e.id:null}
          itemCode={displayTraceCode(e)}
          attachmentDescription={e.description}
          label={t("label.receipt")}
          t={t}
          onRemove={(user.id===e.submittedBy||approverIds.includes(user.id))&&st!=="approved"&&!AUTH_URL
            ? ()=>{void (async()=>{if(await confirmUI(t("msg.attachmentRemoved")+"?")){removeAttachment(e.id);}})();}
            : null}
        />
      </div>
      {e.notes&&<div style={{marginTop:7,padding:"6px 9px",background:"#F5F0EA",borderRadius:6,fontSize:11,color:"#4B5E52"}}>{e.notes}</div>}
      {st==="rejected"&&user.id===e.submittedBy&&(
        <div style={{marginTop:11}}>
          <button type="button" style={{width:"100%",background:T,color:"#fff",border:"none",borderRadius:8,padding:"10px",fontSize:14,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}} onClick={()=>fixResubmitExpense(e.id)}>{t("expense.fixResubmit")}</button>
          <button type="button" style={{width:"100%",marginTop:8,background:"transparent",color:G,border:`1.5px solid ${G}`,borderRadius:8,padding:"8px",fontSize:12,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}} onClick={startEdit}>{t("expense.editThenResubmit")}</button>
        </div>
      )}
      <div style={{marginTop:12}}>
        <label className="lbl" style={{marginBottom:6}}>{t("timeline.sectionTitle")}</label>
        <div>
          {timelineEvents.map((ev,i)=>{
            const action=ev.action;
            const isComment=action==="comment_added";
            const label=isComment?t("timeline.comment"):(TIMELINE_ACTION_LABEL[action]||action);
            const style=getTimelineEventStyle(action);
            return(
              <div key={ev.id||`ev-${i}`} style={{display:"flex",gap:8,marginBottom:10,alignItems:"stretch"}}>
                <div style={{width:3,flexShrink:0,borderRadius:2,background:style.accent,minHeight:32}} aria-hidden="true"/>
                <div style={{flex:1,minWidth:0,padding:"8px 10px",borderRadius:8,background:style.bg,border:`1px solid ${style.border}`}}>
                  <div style={{fontSize:12,fontWeight:600,color:style.text}}>
                    <span style={{color:style.accent}}>{label}</span>
                    {ev._collapseCount>1&&<span style={{fontWeight:500,fontSize:10,color:"#6B7B72",marginLeft:4}}>×{ev._collapseCount}</span>}
                    {ev.by&&<span style={{fontWeight:isComment?600:400,color:isComment?style.text:"#6B7B72"}}> · {getU(ev.by).name}</span>}
                    {ev.reapprovalTag&&<span style={{fontWeight:400,fontSize:10,color:"#9CAA9F"}}> · {t("timeline.reapprovalTag")}</span>}
                  </div>
                  {isComment&&ev.note&&<div style={{fontSize:12,color:style.text,marginTop:6,whiteSpace:"pre-wrap",lineHeight:1.5,fontWeight:500}}>{ev.note}</div>}
                  {!isComment&&ev.note&&action==="rejected"&&<div style={{fontSize:11,color:style.text,marginTop:4,whiteSpace:"pre-wrap",lineHeight:1.45}}>{ev.note}</div>}
                  {!isComment&&Array.isArray(ev.editSummaries)&&ev.editSummaries.length>0&&(
                    <div style={{fontSize:11,color:style.text,marginTop:4,lineHeight:1.45}}>
                      {ev.editSummaries.map((line,idx)=><div key={idx}>{line}</div>)}
                    </div>
                  )}
                  <div style={{fontSize:10,color:"#9CAA9F",marginTop:4}}>
                    {formatTimelineTimestamp(ev.at)}
                    {ev._collapseCount>1&&ev._collapsedAt&&<span style={{marginLeft:6}}>último: {formatTimelineTimestamp(ev._collapsedAt)}</span>}
                  </div>
                </div>
              </div>
            );
          })}
        </div>
        <div style={{display:"flex",gap:6,marginTop:8}}>
          <input className="inp" style={{flex:1,fontSize:12}}
            placeholder={t("expense.commentPlaceholder")}
            value={commentText}
            onChange={ev=>setCommentText(ev.target.value)}
            onKeyDown={ev=>{if(ev.key==="Enter"&&commentText.trim()){addExpenseComment(e.id,commentText);setCommentText("");}}}
          />
          <button type="button" className="btn-secondary" style={{fontSize:11,padding:"6px 12px",flexShrink:0,background:detailAccent,color:"#FAF7F2",border:`1px solid ${detailAccent}`}}
            onClick={()=>{if(commentText.trim()){addExpenseComment(e.id,commentText);setCommentText("");}}}>
            {t("expense.addNote")}
          </button>
        </div>
      </div>
      </div>}
    </div>
  );
}

/* ── DASHBOARD ─────────────────────────────────────────────────────────────── */
function DashboardView(){
  const{t,user,expenses,cats,users,isAdmin,myPending,
        totApproved,totFixed,go,openNew,openNewInvoice,setView,setDetailId,setPanel,goToMyRejected,departmentsWithStats,departments,setRecurringFlt,resetForm}=useApp();
  const today=new Date();
  const m0=new Date(today.getFullYear(),today.getMonth(),1).toISOString().slice(0,10);
  const ym=today.toISOString().slice(0,7);
  const mTotalAll=expenses
    .filter(e=>getItemStatus(e,cats,users)==="approved"&&effectiveDate(e).slice(0,7)===ym)
    .reduce((s,e)=>s+eurForExpense(e),0);
  const pendAll=expenses.filter(e=>getItemStatus(e,cats,users)==="pending").length;
  const mine=expenses.filter(e=>(e.ownerId||e.submittedBy)===user.id);
  const mTotalMine=mine.filter(e=>getItemStatus(e,cats,users)==="approved"&&effectiveDate(e).slice(0,7)===ym).reduce((s,e)=>s+eurForExpense(e),0);
  const pendMine=mine.filter(e=>getItemStatus(e,cats,users)==="pending").length;
  const totApprovedMine=mine.filter(e=>getItemStatus(e,cats,users)==="approved").reduce((s,e)=>s+eurForExpense(e),0);
  const mTotal=mTotalAll;
  const pend=isAdmin?pendAll:pendMine;
  const dashTotApproved=totApproved;
  const myItems=expenses.filter(e=>(e.ownerId||e.submittedBy)===user.id);
  const apprMine=myItems.filter(e=>getItemStatus(e,cats,users)==="approved");
  const apprSum=apprMine.reduce((s,e)=>s+eurForExpense(e),0);
  const apprCnt=apprMine.length;
  const pendList=myItems.filter(e=>getItemStatus(e,cats,users)==="pending");
  const pendSum=pendList.reduce((s,e)=>s+eurForExpense(e),0);
  const pendCnt=pendList.length;
  const rejList=myItems.filter(e=>getItemStatus(e,cats,users)==="rejected");
  const rejSum=rejList.reduce((s,e)=>s+eurForExpense(e),0);
  const rejCnt=rejList.length;
  const deptBudgetActive=(departmentsWithStats||[]).filter(d=>!d.archived&&Number(d.budget)>0);
  const budgetTotalActive=deptBudgetActive.reduce((s,d)=>s+Number(d.budget||0),0);
  const spentActive=deptBudgetActive.reduce((s,d)=>s+Number(d.spent||0),0);
  const budgetRemainingTotal=budgetTotalActive-spentActive;
  const budgetProgressPct=budgetTotalActive>0 ? (spentActive/budgetTotalActive)*100 : 0;
  const budgetAvailablePct=budgetTotalActive>0
    ? Math.max(0,Math.min(100,Math.round((budgetRemainingTotal/budgetTotalActive)*1000)/10))
    : 0;
  const [billsWindow,setBillsWindow]=useState("15d");
  const [dashBudgetAnim,setDashBudgetAnim]=useState(true);
  useEffect(()=>{
    const t=setTimeout(()=>setDashBudgetAnim(false),450);
    return()=>clearTimeout(t);
  },[]);
  const billsWindowCfg=UPCOMING_BILL_WINDOWS[billsWindow]||UPCOMING_BILL_WINDOWS["15d"];
  const upcomingBills=[];
  expenses.filter(e=>e.expenseType==="invoice"&&getItemStatus(e,cats,users)==="approved"&&e.dueDate).forEach(e=>{
    const diff=daysUntilISO(String(e.dueDate).slice(0,10));
    if(diff!=null&&diff>=0&&diff<=billsWindowCfg.days)upcomingBills.push({...e,name:e.vendor||e.description,daysUntil:diff});
  });
  upcomingBills.sort((a,b)=>a.daysUntil-b.daysUntil);
  const alerts=React.useMemo(()=>{
    return (departmentsWithStats||[]).filter(d => {
      if(!d.budget || Number(d.budget) <= 0 || d.archived) return false;
      const spent = Number(d.spent) || 0;
      return spent >= Number(d.budget) * 0.70;
    }).map(d => {
      const spent = Number(d.spent) || 0;
      const budget = Number(d.budget) || 0;
      const pct = budget > 0 ? Math.round((spent / budget) * 100) : (spent > 0 ? 100 : 0);
      return { ...d, spent, pct };
    }).sort((a,b) => b.pct - a.pct);
  },[departmentsWithStats]);
  return(
    <div>
      <h1 style={{fontFamily:"'Playfair Display',serif",fontSize:24,color:G,marginBottom:3}}>{t("nav.dashboard")}</h1>
      <p style={{fontSize:13,color:"#6B7B72",marginBottom:16}}>{t("dash.welcome")}, {user.name.split(" ")[0]}</p>
      {myPending.length>0&&(
        <div style={{background:NOTIF_TINT,border:"1px solid rgba(122,79,154,0.22)",borderRadius:11,padding:"10px 13px",marginBottom:10,display:"flex",alignItems:"center",justifyContent:"space-between",gap:9,flexWrap:"wrap"}}>
          <div>
            <div style={{fontSize:13,fontWeight:600,color:NOTIF_BADGE}}>{myPending.length} pendiente(s) de tu aprobación</div>
          </div>
          <button className="btn-sm" style={{fontSize:12,background:T,color:"#fff"}} onClick={()=>go("approvals")}>{t("dash.review")}</button>
        </div>
      )}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:9,marginBottom:16}}>
        {[{bg:G,label:t("dash.addExpense"),sub:t("dash.logCost"),fn:openNew},{bg:F,label:t("dash.newInvoice"),sub:t("dash.newInvoiceSub"),fn:openNewInvoice}].map((a,i)=>(
          <div key={i} style={{background:a.bg,borderRadius:11,padding:"12px 13px",cursor:"pointer"}} onClick={a.fn}
            onMouseEnter={e=>e.currentTarget.style.opacity="0.88"} onMouseLeave={e=>e.currentTarget.style.opacity="1"}>
            <div style={{fontSize:16,color:"rgba(250,247,242,0.4)",lineHeight:1,marginBottom:3}}>+</div>
            <div style={{fontWeight:700,fontSize:13,color:"#FAF7F2"}}>{a.label}</div>
            <div style={{fontSize:11,color:"rgba(250,247,242,0.4)",marginTop:1}}>{a.sub}</div>
          </div>
        ))}
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:14}}>
        {(() => {
          const monthLong=today.toLocaleString("es-ES",{month:"long"});
          const monthLabel="Gasto en "+monthLong.charAt(0).toUpperCase()+monthLong.slice(1);

          const totalKpiLabel="Total gastado";
          const budgetKpiLabel="Presupuesto disponible";
          const fixedKpiLabel="Coste fijo mensual";

          const budgetHealth=budgetUsageHealth(budgetProgressPct,spentActive===0);
          const totalKpiBg=budgetHealth.kpiBg;
          const totalKpiText=budgetHealth.kpiText;
          const budgetKpiBg=budgetHealth.kpiBg;
          const budgetKpiText=budgetHealth.kpiText;
          const monthKpiBg="#F5F0EA";
          const monthKpiText=G;
          const fixedKpiBg="#F5F0EA";
          const fixedKpiText="#6B7B72";

          const renderKpiCard=(key,label,val,bg,text,progressFill,showProgress=false,valueFontSize=22,labelColor="#9CAA9F",progressTrack="#EDE8E0",progressLabel="",progressLabelColor="#6B7B72",progressPct=null,progressFromRight=false)=> {
            const kpi=fmtKpi(val);
            const barPct=progressPct!=null?progressPct:budgetProgressPct;
            const scale=Math.max(0,Math.min(100,barPct))/100;
            return(
              <div key={key} className="card" style={{background:bg,border:"1px solid rgba(0,0,0,0.02)"}}>
                <div style={{fontSize:10,color:labelColor,fontWeight:600,textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:3}}>{label}</div>
                <div style={{fontSize:valueFontSize,fontWeight:700,color:text,fontVariantNumeric:"tabular-nums"}}>
                  <span>{kpi.whole}</span><span style={{fontSize:14,verticalAlign:"baseline"}}>{kpi.cents}</span>
                </div>
                {showProgress&&(
                  <>
                  <div style={{height:8,background:progressTrack,borderRadius:4,marginTop:10,overflow:"hidden",display:progressFromRight?"flex":"block",justifyContent:progressFromRight?"flex-end":"stretch"}}>
                    <div
                      className={`kpi-progress-fill${progressFromRight?" kpi-progress-fill--from-right":""}${dashBudgetAnim?" kpi-progress-fill--load":""}`}
                      style={{
                        background:progressFill,
                        "--budget-scale":scale,
                        ...(dashBudgetAnim?{}:{transform:`scaleX(${scale})`,transformOrigin:progressFromRight?"right center":"left center"}),
                      }}
                    />
                  </div>
                  <div style={{fontSize:11,color:progressLabelColor,marginTop:5}}>{progressLabel}</div>
                  </>
                )}
              </div>
            );
          };

          return(
            <>
              {renderKpiCard("k-total",totalKpiLabel,dashTotApproved,totalKpiBg,totalKpiText,budgetHealth.kpiProgress,true,28,budgetHealth.kpiLabelColor,budgetHealth.kpiProgressTrack,`${budgetProgressPct.toFixed(1)}% usado`,budgetHealth.kpiLabelColor)}
              {renderKpiCard("k-budget",budgetKpiLabel,budgetRemainingTotal,budgetKpiBg,budgetKpiText,budgetHealth.kpiProgress,true,28,budgetHealth.kpiLabelColor,budgetHealth.kpiProgressTrack,`${budgetAvailablePct.toFixed(1)}% disponible`,budgetHealth.kpiLabelColor,budgetAvailablePct,true)}
              {renderKpiCard("k-month",monthLabel,mTotal,monthKpiBg,monthKpiText,null,false,22,"#9CAA9F")}
              <div style={{cursor:"pointer"}} onClick={() => { go("expenses"); setRecurringFlt(["recurring"]); }}>
                {renderKpiCard("k-fixed",fixedKpiLabel,totFixed,fixedKpiBg,fixedKpiText,null,false)}
              </div>
            </>
          );
        })()}
      </div>
      {alerts.length>0&&(
        <div className="card" style={{marginBottom:14}}>
          <div style={{fontWeight:600,fontSize:13,marginBottom:10}}>Alertas de presupuesto</div>
          <div style={{display:"grid",gap:8}}>
            {alerts.map(a=>{
              const tone=a.pct>=100
                ? {bg:"#FEE2E2",border:"#DC2626"}
                : a.pct>=90
                  ? {bg:"#FFF7ED",border:"#F97316"}
                  : {bg:"#FFFBEB",border:"#F59E0B"};
              return(
                <div key={a.id} style={{background:tone.bg,borderLeft:`3px solid ${tone.border}`,borderRadius:8,padding:"8px 10px"}}>
                  <div style={{fontWeight:700,fontSize:12,marginBottom:2}}>{a.name||"—"}</div>
                  <div style={{fontSize:11,color:"#6B7B72"}}>
                    {a.pct}% del presupuesto · {fmt(a.spent)} de {fmt(Number(a.budget)||0)}
                  </div>
                  <div style={{height:4,background:"rgba(0,0,0,0.08)",borderRadius:2,marginTop:6}}>
                    <div style={{height:"100%",width:`${Math.min(100,Math.max(0,a.pct))}%`,background:tone.border,borderRadius:2}}/>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      )}
      <div className="card" style={{marginBottom:14}}>
        <div style={{fontWeight:600,fontSize:13,marginBottom:10}}>{t("dash.activityTitle")}</div>
        <div style={{display:"flex",justifyContent:"space-between",gap:8,textAlign:"center"}}>
          {[{lbl:t("dash.approvedShort"),cnt:apprCnt,sum:apprSum,st:"approved"},{lbl:t("dash.pendingShort"),cnt:pendCnt,sum:pendSum,st:"pending"},{lbl:t("dash.rejectedShort"),cnt:rejCnt,sum:rejSum,st:"rejected"}].map(col=>(
            <div key={col.st} style={{flex:1}}>
              <div className={`badge ${statusToneClass(col.st)}`.trim()} style={{marginBottom:6}}>{col.lbl}</div>
              <div style={{fontWeight:800,fontSize:16,color:ACTIVITY_COLORS[col.st].color}}>{col.cnt}</div>
              <div style={{fontSize:11,color:"#9CAA9F"}}>{col.cnt===0?fmt(0):fmt(col.sum)}</div>
            </div>
          ))}
        </div>
        {rejCnt>0&&<button type="button" style={{width:"100%",marginTop:10,background:"none",border:"none",color:T,fontSize:12,fontWeight:600,cursor:"pointer",fontFamily:"inherit",textAlign:"left"}} onClick={goToMyRejected}>{t("dash.fixRejectedLink").replace("{n}",String(rejCnt))}</button>}
      </div>
      <DepartmentBudgetBars t={t} rows={departmentsWithStats} title={t("dash.deptBudgetsTitle")} animateLoad={dashBudgetAnim}/>
      {/* Upcoming invoices · 15 days */}
      <div className="card" style={{marginBottom:11}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:8,marginBottom:9,flexWrap:"wrap"}}>
          <div style={{fontWeight:600,fontSize:13}}>{billsWindowCfg.title}</div>
          <select className="inp" style={{width:"auto",fontSize:11,padding:"4px 8px"}} value={billsWindow} onChange={e=>setBillsWindow(e.target.value)}>
            <option value="15d">15 días</option>
            <option value="1m">1 mes</option>
            <option value="3m">3 meses</option>
            <option value="6m">6 meses</option>
            <option value="1y">1 año</option>
          </select>
        </div>
        {upcomingBills.length===0
          ?<div style={{fontSize:11,color:"#9CAA9F",padding:"4px 0"}}>{t("dash.noBillsSoon")}</div>
          :upcomingBills.map((b,i)=>{
            const dueTxt=b.daysUntil===0?t("dash.dueToday"):b.daysUntil===1?t("dash.dueTomorrow"):t("dash.dueIn").replace("{n}",String(b.daysUntil));
            const dueS=String(b.dueDate||"").slice(0,10);
            const dayBox=dueS.length>=10?parseInt(dueS.slice(8,10),10):"—";
            return(
              <div key={b.id+"-"+i} style={{display:"flex",alignItems:"center",padding:"6px 0",borderBottom:i<upcomingBills.length-1?"1px solid #F5F0EA":"none",gap:9}}>
                <div style={{width:32,height:32,borderRadius:6,background:G,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                  <div style={{fontSize:13,fontWeight:800,color:"#FAF7F2",lineHeight:1}}>{dayBox}</div>
                </div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:11,fontWeight:600,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{b.name}</div>
                <div style={{fontSize:11,color:b.daysUntil<=3?F:"#9CAA9F",marginTop:1,fontWeight:b.daysUntil<=3?600:400}}>{dueTxt}</div>
                </div>

/* ── MULTI-SELECT FILTER MENU ─────────────────────────────────────────────── */
function MultiFilterMenu({prefix,options,selected,onChange,allLabel,minWidth}){
  const [open,setOpen]=useState(false);
  const ref=useRef(null);
  useEffect(()=>{
    if(!open)return;
    const onDoc=e=>{if(ref.current&&!ref.current.contains(e.target))setOpen(false);};
    document.addEventListener("mousedown",onDoc);
    return()=>document.removeEventListener("mousedown",onDoc);
  },[open]);
  const optionValues=options.map(o=>o.value);
  const sel=asMultiFilter(selected);
  const allActive=isMultiFilterAll(selected,options.length);
  const summary=multiFilterSummary(prefix,selected,options,allLabel);
  return(
    <div ref={ref} style={{position:"relative",flexShrink:0}}>
      <button type="button" className="inp filter-pill-btn" style={{padding:"5px 8px",fontSize:11,width:"auto",minWidth:minWidth||120,cursor:"pointer",textAlign:"left",background:allActive?"#FAFAF9":"#FFF8F3",borderColor:allActive?"#DDD6CC":G,fontFamily:"inherit"}}
        onClick={()=>setOpen(o=>!o)} aria-expanded={open}>
        {summary}
        <span style={{float:"right",color:"#9CAA9F",marginLeft:6,fontSize:9}}>{open?"▲":"▼"}</span>
      </button>
      {open&&(
        <div className="filter-pill-menu" style={{position:"absolute",top:"100%",left:0,marginTop:4,zIndex:30,background:"#fff",border:"1.5px solid #DDD6CC",borderRadius:7,boxShadow:"0 4px 14px rgba(0,0,0,0.08)",minWidth:Math.max(minWidth||140,160),padding:"4px 0"}}>
          <label style={{display:"flex",alignItems:"center",gap:7,padding:"5px 10px",fontSize:11,cursor:"pointer",color:"#4B5E52"}}>
            <input type="checkbox" checked={allActive} onChange={()=>onChange([])}/>
            <span>{allLabel}</span>
          </label>
          {options.map(opt=>(
            <label key={opt.value} style={{display:"flex",alignItems:"center",gap:7,padding:"5px 10px",fontSize:11,cursor:"pointer",color:"#4B5E52"}}>
              <input type="checkbox" checked={!allActive&&sel.includes(opt.value)} onChange={()=>onChange(toggleMultiFilterValue(selected,opt.value,optionValues))}/>
              <span>{opt.label}</span>
            </label>
          ))}
        </div>
      )}
    </div>
  );
}

/* ── RECEIPT THUMB (admin queue) ─────────────────────────────────────────── */
function ReceiptThumb({expenseId}){
  const [url,setUrl]=useState(null);
  useEffect(()=>{
    const path="/expenses/"+encodeURIComponent(expenseId)+"/receipt";
    if(!expenseId||!AUTH_URL)return;
    let dead=false;
    (async()=>{
      try{
        const blob=await API.fetchBinary(path);
        if(dead)return;
        if(blob.type&&blob.type.includes("pdf")){
          setUrl("__pdf__");
          return;
        }
        setUrl(URL.createObjectURL(blob));
      }catch(e){}
    })();
    return()=>{
      dead=true;
      setUrl(u=>{if(u)URL.revokeObjectURL(u);return null;});
    };
  },[expenseId]);
  if(url==="__pdf__") return(
    <div style={{width:52,height:52,borderRadius:8,background:"#fdf0e6",flexShrink:0,
      display:"flex",alignItems:"center",justifyContent:"center",
      fontSize:9,fontWeight:700,color:"#8a3a00"}}>PDF</div>
  );
  if(!url)return<div style={{width:52,height:52,borderRadius:8,background:"#EDE8E0",flexShrink:0}} title="Recibo"/>;
  return<img src={url} alt="" style={{width:52,height:52,objectFit:"cover",borderRadius:8,flexShrink:0}}/>;
}

  const openApprovalDetail=(id)=>{
    resetForm();

  };
  const [typeFilter,setTypeFilter]=useState("all");
  const getU=id=>users.find(u=>u.id===id)||{name:UNKNOWN_USER_NAME,color:"#999"};
  const priorityForItem=(item)=>{
    const ids=effectiveExpenseApproverIds(item,cats,users);
    const myVote=approvalVoteFor(item.approvals||{},user.id,users);
    const st=getItemStatus(item,cats,users);
    if(st==="approved")return 3;
    if(myVote==="approved")return 2;
    const others=ids.filter(id=>id!==user.id);
    const othersApproved=others.length>0&&others.every(id=>approvalVoteFor(item.approvals||{},id,users)==="approved");
    if(othersApproved)return 0;
    return 1;
  };
  const sortByPriority=(list)=>[...list].sort((a,b)=>{
    const pa=priorityForItem(a),pb=priorityForItem(b);
    if(pa!==pb)return pa-pb;
    const da=String(a.date||a.dueDate||"");
    const db=String(b.date||b.dueDate||"");
    return db.localeCompare(da);
  });
  const baseList = expenses.filter(e => {
    const st = getItemStatus(e, cats, users);
    if (st === "deleted") return false;
    return true;
  });
  const kindFiltered=baseList.filter(e=>{
    if(typeFilter==="all")return true;
    if(typeFilter==="expense")return e.expenseType!=="invoice";
    return e.expenseType==="invoice";

    if(!showActionSections)return"C";
    const st=getItemStatus(item,cats,users);
    const ids=effectiveExpenseApproverIds(item,cats,users);
    const myVote=approvalVoteFor(item.approvals||{},user.id,users);
    if(ids.includes(user.id)&&st==="pending"&&myVote!=="approved"&&myVote!=="rejected")return"A";
    if(ids.includes(user.id)&&st==="pending"&&myVote==="approved")return"B";
    return"C";

/* ── PAYMENT CALENDAR ──────────────────────────────────────────────────────── */
function calendarMonthKey(date){
  return `${date.getFullYear()}-${date.getMonth()}`;
}
function buildCalendarMonth(date,srcExpenses,cats,users){
  const year=date.getFullYear(),mon=date.getMonth();
  const firstDay=(new Date(year,mon,1).getDay()+6)%7;
  const daysInMonth=new Date(year,mon+1,0).getDate();
  const events={};
  srcExpenses.forEach(e=>{
    if(getItemStatus(e,cats,users)==="deleted")return;
    const isInv=e.expenseType==="invoice";
    const dateRaw=isInv?(e.dueDate||e.date):e.date;
    if(!dateRaw)return;
    const parts=parseCalendarDayParts(dateRaw);
    if(parts&&parts.y===year&&parts.m===mon){
      const day=parts.d;
      if(!events[day])events[day]=[];
      events[day].push({
        type:isInv?"invoice":"expense",
        id:e.id,
        label:isInv?(e.vendor||e.proveedor||e.description):e.description,
        amount:eurForExpense(e),
        virtual:false,
      });
    }
  });
  const virtualEvents=projectVirtualRecurrenceEvents(srcExpenses,year,mon,cats,users);
  virtualEvents.forEach(ev=>{
    const day=ev.day;
    if(!events[day])events[day]=[];
    events[day].push(ev);
  });
  const monthTotal=Object.values(events).reduce((s,dayEvents)=>s+dayEvents.filter(ev=>!ev.virtual).reduce((ds,ev)=>ds+ev.amount,0),0);
  const monthProjected=Object.values(events).reduce((s,dayEvents)=>s+dayEvents.filter(ev=>ev.virtual).reduce((ds,ev)=>ds+ev.amount,0),0);
  const cells=[];
  for(let i=0;i<firstDay;i++)cells.push(null);
  for(let d=1;d<=daysInMonth;d++)cells.push(d);
  const monthName=(()=>{const mn=date.toLocaleString("es-ES",{month:"long"});const yr=date.getFullYear();return mn.charAt(0).toUpperCase()+mn.slice(1)+" "+yr;})();
  return{year,mon,events,cells,monthTotal,monthProjected,monthName};
}

/* ── ADMIN README ─────────────────────────────────────────────────────────
   Operational reference for admins/superadmins: roles, item codes,
   attachment storage, exports, troubleshooting.
─────────────────────────────────────────────────────────────────────────── */
function AdminReadme(){
  const[open,setOpen]=useState(false);
  const S={heading:{fontWeight:700,fontSize:11,color:G,marginBottom:4,marginTop:10},
           body:{fontSize:10,color:"#4B5E52",lineHeight:1.7},
           code:{fontFamily:"monospace",fontSize:9,background:"#F5F0EA",padding:"2px 5px",borderRadius:4,color:G}};
  return(
    <div className="card" style={{marginBottom:12}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",cursor:"pointer"}}
        onClick={()=>setOpen(v=>!v)}>
        <div style={{fontWeight:600,fontSize:13}}>Guía operacional de administración</div>
        <span style={{fontSize:11,color:"#9CAA9F"}}>{open?"▲":"▼"}</span>
      </div>
      {open&&(
        <div style={{marginTop:12}}>

          <div style={S.heading}>ROLES</div>
          <div style={S.body}>
            <b>user</b> puede enviar gastos y facturas, subir recibos, exportar y aprobar/rechazar si está designado como aprobador.<br/>
            <b>admin</b> todo lo anterior + gestionar usuarios, categorías, presupuestos, ajustes, ver el App Log y aprobar cuentas nuevas.
          </div>

          <div style={S.heading}>CÓDIGOS DE ÍTEM</div>
          <div style={S.body}>
            Formato: <span style={S.code}>EXP-YYYYMMDD-XXXX</span> (gasto) / <span style={S.code}>FAC-YYYYMMDD-XXXX</span> (factura).<br/>
            Son <b>inmutables</b>, se generan en el momento del envío y no cambian aunque el ítem se edite.<br/>
            Úsalos como ancla de trazabilidad en auditorías, conciliaciones y exports.<br/>
            El código aparece en la fila de lista, en el panel de detalle y en el CSV exportado.
          </div>

          <div style={S.heading}>ADJUNTOS (RECIBOS)</div>
          <div style={S.body}>
            Los recibos se almacenan como <b>Base64 inline</b> en <span style={S.code}>localStorage</span> (clave <span style={S.code}>sol-exp</span>).<br/>
            Se admite cualquier tipo de archivo. Tamaño máximo: 20 MB.<br/>
            El campo <span style={S.code}>receiptType</span> indica el MIME type; <span style={S.code}>receipt</span> contiene el Base64.<br/>
            Los adjuntos eliminados registran un evento <span style={S.code}>attachment_removed</span> en el auditTrail del ítem.
          </div>

          <div style={S.heading}>EXPORTACIONES</div>
          <div style={S.body}>
            CSV: incluye código, fecha, descripción, categoría, importe, estado, enviado por, pagado por, notas, aprobadores.<br/>
            JSON: snapshot completo de gastos + facturas con toda la estructura interna.<br/>
            Cada exportación CSV registra un evento <span style={S.code}>exported</span> en el auditTrail de cada ítem exportado.
          </div>

          <div style={S.heading}>LOCALSTORE: CLAVES</div>
          <div style={S.body}>
            <span style={S.code}>sol-users</span> usuarios · <span style={S.code}>sol-exp</span> gastos y facturas (campo <span style={S.code}>expenseType</span>) · <span style={S.code}>sol-cats</span> categorías<br/>
            <span style={S.code}>sol-pwd</span> contraseñas (plaintext, solo modo local)<br/>
            <span style={S.code}>sol-app-log</span> log de la app (máx {LOG_MAX} entradas) · <span style={S.code}>sol-lang</span> reservado (es)
          </div>

          <div style={S.heading}>RESOLUCIÓN DE PROBLEMAS COMUNES</div>
          <div style={S.body}>
            <b>"Storage full"</b> → Ve a Zona peligrosa → Exporta JSON y elimina recibos grandes.<br/>
            <b>Usuario no puede aprobar</b> → Comprueba que su ID esté asignado como aprobador del departamento del gasto (<span style={S.code}>department_approvers</span>).<br/>
            <b>Ítem sin código</b> → Ítems migrados de v1/v2 pueden carecer de código; se asigna al primer guardado (normalizeItem).<br/>
            <b>Login con servidor de auth</b> → Verifica que <span style={S.code}>AUTH_URL</span> apunte al servidor activo y que CORS_ORIGIN esté configurado.<br/>
            <b>Email de verificación no llega</b> → Comprueba <span style={S.code}>RESEND_API_KEY</span> y que FROM_EMAIL esté verificado en Resend.<br/>
            <b>Sesión cerrada automáticamente</b> → El timeout de inactividad es 30 min. Ajusta <span style={S.code}>IDLE_TIMEOUT_MS</span> en el código.
          </div>

        </div>
      )}
    </div>
  );
}

/* ── APP LOG (Settings accordion body) ─────────────────────────────────────
   Structured in-browser log: timestamp, level, event, metadata.
─────────────────────────────────────────────────────────────────────────── */
function AppLogPanelBody(){
  const [entries,setEntries]=useState([]);
  const loadLog=()=>{
    try{setEntries(JSON.parse(localStorage.getItem(APP_LOG_KEY)||"[]").reverse());}
    catch{setEntries([]);}
  };
  const clearLog=()=>{
    void (async()=>{
      if(!(await confirmUI("Borrar el log de la aplicación?")))return;
      localStorage.removeItem(APP_LOG_KEY);setEntries([]);
      dispatchSolanaToast("Log borrado.","info");
    })();
  };
  const LEVEL_COLOR={error:"#DC2626",warn:"#D97706",info:"#9CAA9F"};
  const EVENT_COLOR={
    "auth:login":G,"auth:init":"#9CA3AF","auth:boot":"#9CA3AF",
    "session_idle_expired":"#D97706","password_changed":"#D97706",
    "expense_submitted":"#065F46","bill_submitted":"#065F46",
    "item_approved":"#065F46","item_rejected":"#DC2626",
    "csv_exported":"#2563EB","attachment_uploaded":"#b85c1a",
    "attachment_removed":"#991B1B","upload_rejected":"#DC2626",
  };
  useEffect(()=>{loadLog();},[]);
  return(
    <div>
      <div style={{display:"flex",justifyContent:"flex-end",gap:8,marginBottom:8}}>
        <button type="button" className="btn-sm" style={{fontSize:9,padding:"2px 7px",background:"transparent",
          color:"#991B1B",border:"1px solid #ECA3A3"}} onClick={clearLog}>Borrar</button>
        <button type="button" className="btn-sm" style={{fontSize:10}} onClick={loadLog}>Actualizar</button>
      </div>
      <div style={{fontSize:10,color:"#9CAA9F",marginBottom:7}}>
        Últimas {entries.length} entradas · autenticación, uploads, aprobaciones, exportaciones.
      </div>
      <div style={{maxHeight:300,overflowY:"auto",fontFamily:"monospace",fontSize:10}}>
        {entries.length===0&&<div style={{color:"#9CAA9F",padding:"8px 0"}}>Sin entradas.</div>}
        {entries.map((e,i)=>(
          <div key={i} style={{padding:"4px 0",borderBottom:"1px solid #F5F0EA",display:"flex",gap:7,alignItems:"baseline"}}>
            <span style={{color:"#9CAA9F",flexShrink:0,width:68}}>{(e.ts||"").slice(11,19)}</span>
            <span style={{fontWeight:700,color:LEVEL_COLOR[e.level]||"#9CAA9F",flexShrink:0,width:36}}>{(e.level||"info").toUpperCase()}</span>
            <span style={{color:EVENT_COLOR[e.event]||G,fontWeight:600,flexShrink:0,minWidth:140}}>{e.event}</span>
            <span style={{color:"#6B7B72",wordBreak:"break-all"}}>
              {Object.entries(e).filter(([k])=>!["ts","level","event"].includes(k))
                .map(([k,v])=>`${k}=${typeof v==="object"?JSON.stringify(v):v}`).join(" · ")}
            </span>
          </div>
        ))}
      </div>
    </div>
  );
}

function formatSettingKeyLabel(key){
  return String(key||"").split("_").filter(Boolean).map(w=>w.charAt(0).toUpperCase()+w.slice(1).toLowerCase()).join(" ");
}
function inferServerSettingWidget(key,value){
  const numKey=key==="iva_default"||["_threshold","_days","_mb","_above"].some(s=>key.endsWith(s));
  if(numKey)return"number";
  if(Array.isArray(value))return value.length===0||value.every(x=>typeof x==="string")?"chips":"json";
  if(typeof value==="boolean")return"boolean";
  if(value!==null&&typeof value==="object")return"json";
  return"text";
}
function draftFromSchemaRow(row){
  const v=row.value;
  const w=inferServerSettingWidget(row.key,v);
  if(w==="number")return v===null||v===undefined?"":String(v);
  if(w==="chips")return Array.isArray(v)?v.filter(x=>typeof x==="string").slice():[];
  if(w==="boolean")return!!v;
  if(w==="json")return typeof v==="string"?v:JSON.stringify(v,null,2);
  if(v===null||v===undefined)return"";
  if(typeof v==="object")return JSON.stringify(v);
  return String(v);
}
function buildPayloadForSetting(key,schemaValue,draft,w){
  if(w==="number"){
    const n=parseFloat(String(draft).replace(",","."));
    if(!Number.isFinite(n)||n<0)throw new Error("NUM");
    return n;
  }
  if(w==="chips"){
    if(!Array.isArray(draft))throw new Error("ARR");
    return draft.slice();
  }
  if(w==="boolean")return!!draft;
  if(w==="json")return JSON.parse(String(draft));
  return draft;
}

  const{t}=useApp();
  const [rows,setRows]=useState([]);
  const [drafts,setDrafts]=useState({});
  const [chipBuf,setChipBuf]=useState({});
  const [loading,setLoading]=useState(true);
  const [loadErr,setLoadErr]=useState("");
  const [rowErr,setRowErr]=useState({});
  const [saving,setSaving]=useState({});

  const authTok=useCallback(()=>{
    try{API.ensureSessionToken();}catch(e){}
    return API.token||(typeof sessionStorage!=="undefined"?sessionStorage.getItem("sol-session-token"):"")||"";
  },[]);

  const loadSchema=useCallback(async()=>{
    if(!AUTH_URL){setLoading(false);setRows([]);setLoadErr("");return;}
    setLoadErr("");setLoading(true);
    try{
      const r=await fetch(AUTH_URL+"/settings/schema",{headers:{Authorization:"Bearer "+authTok()}});
      const d=await r.json().catch(()=>({}));
      if(!r.ok){setLoadErr(d.error||t("settings.serverLoadError"));setRows([]);setDrafts({});return;}
      const sch=(Array.isArray(d.schema)?[...d.schema]:[]).sort((a,b)=>String(a.key).localeCompare(String(b.key)));
      setRows(sch);
      const dr={};
      sch.forEach(row=>{dr[row.key]=draftFromSchemaRow(row);});
      setDrafts(dr);
      setRowErr({});
      setChipBuf({});
    }catch(e){setLoadErr(e.message||t("settings.serverLoadError"));setRows([]);}
    finally{setLoading(false);}
  },[authTok,t]);

  useEffect(()=>{void loadSchema();},[loadSchema]);

    const w=inferServerSettingWidget(key,row.value);
    setRowErr(e=>({...e,[key]:""}));

      payloadVal=buildPayloadForSetting(key,row.value,drafts[key],w);

function padDept2(n){return n<10?"0"+n:String(n);}
function calendarMonthRangeJs(d){
  const y=d.getFullYear(),m=d.getMonth();
  const from=`${y}-${padDept2(m+1)}-01`;
  const last=new Date(y,m+1,0).getDate();
  const to=`${y}-${padDept2(m+1)}-${padDept2(last)}`;
  return{from,to};
}
function fiscalYearRangeFromMmDd(mmdd,now){
  const s=String(mmdd||"01-01").trim();
  const m=s.match(/^(\d{2})-(\d{2})$/);
  const mm=m?parseInt(m[1],10):1;
  const dd=m?parseInt(m[2],10):1;
  const y=now.getFullYear();
  const cur=new Date(y,now.getMonth(),now.getDate());
  let start=new Date(y,mm-1,dd);
  if(cur<start)start=new Date(y-1,mm-1,dd);
  const end=new Date(start);
  end.setFullYear(end.getFullYear()+1);
  end.setDate(end.getDate()-1);
  const ymd=x=>`${x.getFullYear()}-${padDept2(x.getMonth()+1)}-${padDept2(x.getDate())}`;
  return{from:ymd(start),to:ymd(end)};
}
function localApprovedExpenseDeptSpend(expenses,cats,users,fromStr,toStr){
  const out={};
  for(const e of expenses||[]){
    if(!e||e.expenseType==="invoice")continue;
    if(getItemStatus(e,cats,users)!=="approved")continue;
    const ds=e.date||"";
    if(ds<fromStr||ds>toStr)continue;
    const id=e.departmentId;
    if(!id)continue;
    out[id]=(out[id]||0)+eurForExpense(e);
  }
  return out;
}
function barColorForPctUsed(pct){
  if(pct<=75)return"#22c55e";
  if(pct<=90)return"#f59e0b";
  return"#ef4444";
}

        const sy=Number(byY[d.id])||0;
        const pctRaw=budget>0?(sy/budget)*100:(sy>0?100:0);
        const fill=Math.min(100,pctRaw);
        const pctDisp=budget>0?Math.round(pctRaw*10)/10:0;
        const rem=budget-sy;
        const over=rem<0;
        const fillCol=barColorForPctUsed(pctRaw);
        return(
          <div key={d.id} style={{marginBottom:14}}>
            <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap",marginBottom:6}}>
              <span style={{fontSize:13,fontWeight:600}}>{d.name}</span>
              {over&&<span style={{fontSize:9,fontWeight:700,color:"#fff",background:"#ef4444",padding:"2px 8px",borderRadius:999}}>{t("settings.overBudgetBadge")}</span>}
            </div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(140px,1fr))",gap:8,fontSize:11,marginBottom:8}}>
              <div>
                <div style={{color:"#9CAA9F",fontSize:9,textTransform:"uppercase",letterSpacing:"0.05em",marginBottom:2}}>{t("settings.deptTrackerBudget")}</div>
                {budEdit===d.id?(
                  <input className="inp" style={{fontSize:13,padding:"4px 8px"}} autoFocus value={budDraft} onChange={e=>setBudDraft(e.target.value)}
                    onKeyDown={e=>{
                      if(e.key==="Enter"){e.preventDefault();skipBlurSaveRef.current=true;void saveBudget(d);}
                      if(e.key==="Escape"){e.preventDefault();setBudEdit(null);}
                    }}
                    onBlur={()=>{
                      if(skipBlurSaveRef.current){skipBlurSaveRef.current=false;return;}
                      if(budEdit===d.id)void saveBudget(d);
                    }}/>
                ):isAdmin?(
                  <button type="button" onClick={()=>{setBudEdit(d.id);setBudDraft(String(budget));}} style={{
                    border:"none",background:"transparent",padding:0,cursor:"pointer",fontSize:13,fontWeight:700,color:G,
                    textAlign:"left",fontVariantNumeric:"tabular-nums",
                  }}>{fmt(budget)}</button>
                ):(
                  <span style={{fontSize:13,fontWeight:700,color:G,fontVariantNumeric:"tabular-nums"}}>{fmt(budget)}</span>
                )}
              </div>
              <div>
                <div style={{color:"#9CAA9F",fontSize:9,textTransform:"uppercase",letterSpacing:"0.05em",marginBottom:2}}>{t("settings.deptTrackerMonth")}</div>
                <div style={{fontWeight:600,fontVariantNumeric:"tabular-nums"}}>{fmt(sm)}</div>
              </div>
              <div>
                <div style={{color:"#9CAA9F",fontSize:9,textTransform:"uppercase",letterSpacing:"0.05em",marginBottom:2}}>{t("settings.deptTrackerYear")}</div>
                <div style={{fontWeight:600,fontVariantNumeric:"tabular-nums"}}>{fmt(sy)}</div>
              </div>
              <div>
                <div style={{color:"#9CAA9F",fontSize:9,textTransform:"uppercase",letterSpacing:"0.05em",marginBottom:2}}>{t("settings.deptTrackerRemaining")}</div>
                <div style={{fontWeight:600,fontVariantNumeric:"tabular-nums",color:over?"#DC2626":"#1a1008"}}>{fmt(rem)}</div>
              </div>
            </div>
            <div style={{marginBottom:4}}>
              <div style={{display:"flex",justifyContent:"space-between",fontSize:10,color:"#6B7B72"}}>
                <span>{t("settings.deptTrackerUsed")}</span>
                <span>{budget>0?`${pctDisp}%`:"—"}</span>
              </div>
              <div style={{height:6,borderRadius:999,background:"#EDE8E0",overflow:"hidden"}}>
                <div style={{height:"100%",width:`${budget>0?fill:0}%`,maxWidth:"100%",borderRadius:999,background:budget>0?fillCol:"#E5E7EB",transition:"width 0.2s"}}/>
              </div>
            </div>
          </div>
        );
      })}
    </div>
  );
}

/* ── DEPARTMENT BUDGET BARS (dashboard + presupuestos view) ───────────────── */
function DepartmentBudgetBars({t,rows,title,animateLoad=false}){
  if(!rows||rows.length===0)return null;
  const visible=rows.filter(d=>!d.archived&&(Number(d.budget)||0)>0);
  if(visible.length===0)return null;
  return(
    <div className="card" style={{marginBottom:14}}>
      {title&&<div style={{fontWeight:600,fontSize:13,marginBottom:10}}>{title}</div>}
      {visible.map((d,i)=>(
        <BudgetVsActualRow key={d.id} t={t} name={d.name} spent={d.spent} budget={d.budget} remaining={d.remaining} noBottomMargin={i===visible.length-1} animateLoad={animateLoad}/>
      ))}
    </div>
  );
}

/* ── DEPARTMENTS CRUD (superadmin, settings) ───────────────────────────────── */
function DepartmentsSettingsBlock({t}){
  const{departments,refreshDepartments,isAdmin}=useApp();
  const [name,setName]=useState("");
  const [bud,setBud]=useState("");
  const [editId,setEditId]=useState(null);
  const [ef,setEf]=useState({name:"",budget:""});
  const [msg,setMsg]=useState("");
  const [err,setErr]=useState("");
  const [delId,setDelId]=useState(null);
  const [showArchived,setShowArchived]=useState(false);
  const [addSaving,setAddSaving]=useState(false);
  const [editSaving,setEditSaving]=useState(false);
  if(!isAdmin)return null;
  const sessionTok=(()=>{try{return sessionStorage.getItem("sol-session-token")||"";}catch(e){return "";}})();
  const saveLocal=(next)=>{
    lsSet(DEPTS_LS_KEY,next.map(x=>({id:x.id,name:x.name,budget:Number(x.budget)||0,archived:!!x.archived,createdAt:x.createdAt||Date.now()})));
    void refreshDepartments();
  };
  const addDept=async()=>{
    if(addSaving)return;
    setErr("");setMsg("");
    const n=name.trim();
    if(!n){setErr("Nombre requerido.");return;}
    const b=parseFloat(String(bud).replace(",","."))||0;
    setAddSaving(true);
    try{
      if(AUTH_URL){
        if(!sessionTok){setErr(t("msg.sessionExpired"));toastSaveFailed(t("msg.sessionExpired"));return;}
        try{
          const r=await fetch(AUTH_URL+"/departments",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+sessionTok},body:JSON.stringify({name:n,budget:b})});
          const d=await r.json().catch(()=>({}));
          if(!r.ok){const errMsg=d.error||t("msg.genericShort");setErr(errMsg);toastSaveFailed(errMsg);return;}
          setName("");setBud("");setMsg(t("settings.deptSaved"));toastSaved("Departamento");void refreshDepartments();
        }catch(e){const errMsg=e.message||t("msg.genericShort");setErr(errMsg);toastSaveFailed(errMsg);}
      }else{
        const id="dept_"+Date.now();
        saveLocal([...departments,{id,name:n,budget:b,archived:false,createdAt:Date.now()}]);
        setName("");setBud("");setMsg(t("settings.deptSaved"));toastSaved("Departamento");
      }
    }finally{setAddSaving(false);}
  };
  const saveEdit=async row=>{
    if(editSaving)return;
    setErr("");setMsg("");
    const n=(ef.name||"").trim();
    if(!n){setErr("Nombre requerido.");return;}
    const b=parseFloat(String(ef.budget).replace(",","."))||0;
    setEditSaving(true);
    try{
      if(AUTH_URL){
        if(!sessionTok){setErr(t("msg.sessionExpired"));toastSaveFailed(t("msg.sessionExpired"));return;}
        try{
          const r=await fetch(AUTH_URL+"/departments/"+encodeURIComponent(row.id),{method:"PUT",headers:{"Content-Type":"application/json","Authorization":"Bearer "+sessionTok},body:JSON.stringify({name:n,budget:b})});
          const d=await r.json().catch(()=>({}));
          if(!r.ok){const errMsg=d.error||t("msg.genericShort");setErr(errMsg);toastSaveFailed(errMsg);return;}
          setEditId(null);setMsg(t("settings.deptSaved"));toastSaved("Departamento");void refreshDepartments();
        }catch(e){const errMsg=e.message||t("msg.genericShort");setErr(errMsg);toastSaveFailed(errMsg);}
      }else{
        saveLocal(departments.map(x=>x.id===row.id?{...x,name:n,budget:b}:x));
        setEditId(null);setMsg(t("settings.deptSaved"));toastSaved("Departamento");
      }
    }finally{setEditSaving(false);}
  };
  const doDelete=async row=>{
    setErr("");setMsg("");
    if(!(await confirmUI("¿Eliminar permanentemente? Los gastos vinculados quedarán como \"Sin departamento\".")))return;
    if(AUTH_URL){
      if(!sessionTok){setErr(t("msg.sessionExpired"));return;}
      try{
        const r=await fetch(AUTH_URL+"/departments/"+encodeURIComponent(row.id),{method:"DELETE",headers:{Authorization:"Bearer "+sessionTok}});
        const d=await r.json().catch(()=>({}));
        if(!r.ok){setErr(d.error||t("msg.genericShort"));return;}
        setDelId(null);setMsg(t("settings.deptSaved"));void refreshDepartments();
      }catch(e){setErr(e.message||t("msg.genericShort"));}
    }else{
      if(!row.archived){setErr("Solo se pueden eliminar departamentos archivados.");return;}
      saveLocal(departments.filter(x=>x.id!==row.id));
      setDelId(null);setMsg(t("settings.deptSaved"));
    }
  };
  const setArchived=async(row,val)=>{
    setErr("");setMsg("");
    if(AUTH_URL){
      if(!sessionTok){setErr(t("msg.sessionExpired"));return;}
      try{
        const r=await fetch(AUTH_URL+"/departments/"+encodeURIComponent(row.id),{method:"PUT",headers:{"Content-Type":"application/json","Authorization":"Bearer "+sessionTok},body:JSON.stringify({archived:!!val})});
        const d=await r.json().catch(()=>({}));
        if(!r.ok){setErr(d.error||t("msg.genericShort"));return;}
        setMsg(t("settings.deptSaved"));void refreshDepartments();
      }catch(e){setErr(e.message||t("msg.genericShort"));}
    }else{
      saveLocal(departments.map(x=>x.id===row.id?{...x,archived:!!val}:x));
      setMsg(t("settings.deptSaved"));
    }
  };
  const active=departments.filter(d=>!d.archived);
  const archived=departments.filter(d=>!!d.archived);
  return(
    <AccordionSection title={t("settings.accordion.budgets")}>
      <p style={{fontSize:11,color:"#6B7B72",marginBottom:10,lineHeight:1.45}}>{t("settings.deptIntro")}</p>
      {msg&&<div style={{fontSize:11,padding:"6px 9px",borderRadius:6,background:"#D1FAE5",color:"#065F46",marginBottom:8}}>{msg}</div>}
      {err&&<div style={{fontSize:11,padding:"6px 9px",borderRadius:6,background:"#FEE2E2",color:"#991B1B",marginBottom:8}}>{err}</div>}
      <DepartmentBudgetTrackerSection t={t}/>
      <div style={{background:"#F5F0EA",borderRadius:9,padding:12,marginBottom:12}}>
        <div style={{fontWeight:600,fontSize:12,marginBottom:8}}>{t("settings.deptAdd")}</div>
        <label className="lbl">{t("settings.deptName")}</label>
        <input className="inp" style={{fontSize:14,marginBottom:8}} value={name} onChange={e=>setName(e.target.value)}/>
        <label className="lbl">{t("settings.deptBudget")}</label>
        <input className="inp" style={{fontSize:14,marginBottom:8}} type="text" inputMode="decimal" value={bud} onChange={e=>setBud(e.target.value)}/>
        <button type="button" className="btn-primary" style={{fontSize:12,padding:"6px 12px"}} disabled={addSaving} onClick={()=>void addDept()}>{addSaving?"Guardando…":t("action.add")}</button>
      </div>
      <div style={{fontSize:9,fontWeight:700,color:"#9CAA9F",textTransform:"uppercase",letterSpacing:"0.07em",marginBottom:8}}>Departamentos activos</div>
      {active.map(d=>(
        <div key={d.id} style={{borderBottom:"1px solid #F5F0EA",padding:"8px 0"}}>
          {editId===d.id?(
            <div style={{background:"#F5F0EA",borderRadius:8,padding:10}}>
              <label className="lbl">{t("settings.deptName")}</label>
              <input className="inp" style={{fontSize:14,marginBottom:6}} value={ef.name} onChange={e=>setEf(p=>({...p,name:e.target.value}))}/>
              <label className="lbl">{t("settings.deptBudget")}</label>
              <input className="inp" style={{fontSize:14,marginBottom:8}} value={ef.budget} onChange={e=>setEf(p=>({...p,budget:e.target.value}))}/>
              <div style={{display:"flex",gap:6}}>
                <button type="button" className="btn-primary" style={{flex:1,fontSize:11,padding:"5px 8px"}} disabled={editSaving} onClick={()=>void saveEdit(d)}>{editSaving?"Guardando…":t("action.save")}</button>
                <button type="button" className="btn-secondary" style={{flex:1,fontSize:11,padding:"5px 8px"}} onClick={()=>setEditId(null)}>{t("action.cancel")}</button>
              </div>
            </div>
          ):(
            <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
              <div style={{flex:1,minWidth:120}}>
                <div style={{fontSize:12,fontWeight:600}}>{d.name}</div>
                <div style={{fontSize:10,color:"#9CAA9F"}}>{fmt(Number(d.budget)||0)}</div>
              </div>
              <div style={{display:"flex",gap:4}}>
                <button type="button" style={{fontSize:9,padding:"2px 6px",borderRadius:4,border:"1px solid #DDD6CC",background:"transparent",color:"#4B5E52",cursor:"pointer"}} onClick={()=>{setEditId(d.id);setEf({name:d.name,budget:String(d.budget!=null?d.budget:"")});setDelId(null);}}>{t("action.edit")}</button>
                {isAdmin&&<button type="button" style={{fontSize:9,padding:"2px 6px",borderRadius:4,border:"1px solid #ECA3A3",background:"transparent",color:"#991B1B",cursor:"pointer"}} onClick={()=>{void (async()=>{if(await confirmUI("¿Archivar este departamento? No aparecerá en el panel ni en nuevos gastos, pero los gastos existentes se mantienen."))void setArchived(d,true);})();}}>Archivar</button>}
              </div>
            </div>
          )}
        </div>
      ))}
      <div style={{marginTop:12,borderTop:"1px solid #EDE8E0",paddingTop:10}}>
        <button type="button" style={{width:"100%",textAlign:"left",background:"transparent",border:"1px solid #DDD6CC",borderRadius:6,padding:"6px 8px",fontSize:11,color:"#4B5E52",cursor:"pointer"}} onClick={()=>setShowArchived(v=>!v)}>
          Archivados {showArchived?"▲":"▼"}
        </button>
        {showArchived&&(
          <div style={{marginTop:8}}>
            {archived.length===0&&<div style={{fontSize:11,color:"#9CAA9F"}}>Sin archivados</div>}
            {archived.map(d=>(
              <div key={d.id} style={{borderBottom:"1px solid #F5F0EA",padding:"8px 0"}}>
                <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
                  <div style={{flex:1,minWidth:120}}>
                    <div style={{fontSize:12,fontWeight:600}}>{d.name}</div>
                    <div style={{fontSize:10,color:"#9CAA9F"}}>{fmt(Number(d.budget)||0)}</div>
                  </div>
                  <div style={{display:"flex",gap:4}}>
                    {isAdmin&&<button type="button" style={{fontSize:9,padding:"2px 6px",borderRadius:4,border:"1px solid #DDD6CC",background:"transparent",color:"#4B5E52",cursor:"pointer"}} onClick={()=>void setArchived(d,false)}>Restaurar</button>}
                    {isAdmin&&<button type="button" style={{fontSize:9,padding:"2px 6px",borderRadius:4,border:"1px solid #ECA3A3",background:"transparent",color:"#991B1B",cursor:"pointer"}} onClick={()=>setDelId(d.id)}>{t("action.delete")}</button>}
                  </div>
                </div>
                {delId===d.id&&(
                  <div style={{background:"#FEE2E2",borderRadius:7,padding:"8px 10px",marginTop:6}}>
                    <div style={{fontSize:11,color:"#7F1D1D",marginBottom:6}}>¿Eliminar permanentemente? Los gastos vinculados quedarán como "Sin departamento".</div>
                    <div style={{display:"flex",gap:6}}>
                      <button type="button" className="btn-danger" style={{flex:1,fontSize:11,padding:"4px 8px"}} onClick={()=>void doDelete(d)}>{t("action.confirm")}</button>
                      <button type="button" className="btn-secondary" style={{flex:1,fontSize:11,padding:"4px 8px"}} onClick={()=>setDelId(null)}>{t("action.cancel")}</button>
                    </div>
                  </div>
                )}
              </div>
            ))}
          </div>
        )}
      </div>
    </AccordionSection>
  );
}

    if(!isAdmin||!AUTH_URL)return;

    try{
      API.ensureSessionToken();
      if(!API.token){setBackupsError(t("msg.sessionExpired"));setBackupsLoading(false);return;}

      setBackups(Array.isArray(d.backups)?d.backups:[]);
