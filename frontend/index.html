  <style>
    :root {

      --color-brand-hover: #a83f00;

    /* Auth button focus ring */
    .auth-btn:focus-visible{outline:2px solid var(--color-brand);outline-offset:2px;}
    /* Smooth transitions for auth elements */
    .auth-inp{transition:border-color var(--motion-duration-micro),box-shadow var(--motion-duration-micro)!important;}

      opacity:1;
    }
    /* Motion system — shared easing + duration scale */
    @keyframes slideIn{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:translateX(0)}}
    @keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
    @keyframes expandDown{from{opacity:0;transform:scaleY(0)}to{opacity:1;transform:scaleY(1)}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes toastIn{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:translateY(0)}}
    @keyframes toastOut{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-8px)}}
    @keyframes modalIn{from{opacity:0;transform:scale(0.96) translateY(6px)}to{opacity:1;transform:scale(1) translateY(0)}}
    @keyframes modalOut{from{opacity:1;transform:scale(1) translateY(0)}to{opacity:0;transform:scale(0.96) translateY(4px)}}
    @keyframes modalOverlayIn{from{opacity:0}to{opacity:1}}
    @keyframes modalOverlayOut{from{opacity:1}to{opacity:0}}
    @keyframes budgetBarFill{from{transform:scaleX(0)}to{transform:scaleX(var(--budget-scale,1))}}
    @keyframes fieldShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
    .slide-in{animation:slideIn var(--motion-duration-standard) var(--motion-ease-standard) forwards}
    .fade-in{animation:fadeIn var(--motion-duration-standard) var(--motion-ease-standard) forwards}
    .panel-slide{animation:slideIn var(--motion-duration-standard) var(--motion-ease-standard) forwards}
    .expand-down{animation:expandDown var(--motion-duration-standard) var(--motion-ease-standard) forwards;transform-origin:top center}
    .toast-slot{position:fixed;top:16px;right:16px;left:auto;transform:none;z-index:7600;max-width:min(92vw,380px);pointer-events:none}
    .toast{pointer-events:auto;padding:10px 14px;border-radius:11px;font-size:12px;font-weight:500;font-family:'DM Sans',system-ui,sans-serif;box-shadow:0 1px 4px rgba(0,0,0,0.06);background:#fff;color:#1a1008;border:1px solid rgba(0,0,0,0.06)}

    .toast--error{background:#FEE2E2;color:#991B1B;border:1px solid rgba(153,27,27,0.12)}
    .toast--conflict{background:#FEF3C7;color:#92400E}
    .toast--sync{background:#D1FAE5;color:#065F46;border:1px solid rgba(6,95,70,0.12)}
    .toast--offline{background:#E0F2FE;color:#1a1008;border:1px solid #7DD3FC}
    .toast-slot--enter .toast{animation:toastIn var(--motion-duration-standard) var(--motion-ease-standard) forwards}
    .toast-slot--exit .toast{animation:toastOut var(--motion-duration-standard) var(--motion-ease-standard) forwards}
    .modal-overlay{position:fixed;inset:0;z-index:7700;background:rgba(0,0,0,0.35);display:flex;align-items:center;justify-content:center;padding:16px;opacity:0}
    .modal-overlay--open{animation:modalOverlayIn var(--motion-duration-standard) var(--motion-ease-standard) forwards}
    .modal-overlay--closing{animation:modalOverlayOut var(--motion-duration-standard) var(--motion-ease-standard) forwards}
    .modal-panel{width:min(92vw,420px);background:#fff;border-radius:12px;padding:16px 16px 14px;box-shadow:0 10px 30px rgba(0,0,0,0.25);opacity:0;transform:scale(0.96) translateY(6px)}
    .modal-overlay--open .modal-panel{animation:modalIn var(--motion-duration-standard) var(--motion-ease-standard) forwards}
    .modal-overlay--closing .modal-panel{animation:modalOut var(--motion-duration-standard) var(--motion-ease-standard) forwards}
    .overlay-loading{position:fixed;inset:0;z-index:8000;display:flex;align-items:center;justify-content:center;opacity:0}
    .overlay-loading--open{animation:modalOverlayIn var(--motion-duration-standard) var(--motion-ease-standard) forwards}

    .filter-date-inp{

      background:transparent;

    .filter-date-inp::-webkit-calendar-picker-indicator{cursor:pointer;opacity:0.55;margin-left:2px}
    .calendar-month-viewport{position:relative;overflow:hidden}
    .calendar-month-panel{width:100%;transition:transform 250ms cubic-bezier(0.4,0,0.2,1),opacity 250ms cubic-bezier(0.4,0,0.2,1);will-change:transform,opacity}
    .calendar-month-panel--enter{position:relative;z-index:2}
    .calendar-month-panel--leave{position:absolute;top:0;left:0;right:0;z-index:1}
    .calendar-month-panel--dir-next.calendar-month-panel--enter{transform:translateX(100%);opacity:1}
    .calendar-month-panel--dir-next.calendar-month-panel--enter.calendar-month-panel--active{transform:translateX(0);opacity:1}
    .calendar-month-panel--dir-next.calendar-month-panel--leave{transform:translateX(0);opacity:1}
    .calendar-month-panel--dir-next.calendar-month-panel--leave.calendar-month-panel--active{transform:translateX(-100%);opacity:0.6}
    .calendar-month-panel--dir-prev.calendar-month-panel--enter{transform:translateX(-100%);opacity:1}
    .calendar-month-panel--dir-prev.calendar-month-panel--enter.calendar-month-panel--active{transform:translateX(0);opacity:1}
    .calendar-month-panel--dir-prev.calendar-month-panel--leave{transform:translateX(0);opacity:1}
    .calendar-month-panel--dir-prev.calendar-month-panel--leave.calendar-month-panel--active{transform:translateX(100%);opacity:0.6}

      .slide-in,.fade-in,.panel-slide,.expand-down{animation:none;opacity:1;transform:none}
      .toast-slot--enter .toast,.toast-slot--exit .toast{animation:none;opacity:1;transform:none}
      .toast-slot--exit .toast{opacity:0;transition:opacity 40ms ease}
      .modal-overlay--open,.modal-overlay--closing,.overlay-loading--open{animation:none;opacity:1;transition:opacity 40ms ease}

      .modal-overlay--closing .modal-panel{opacity:0;transition:opacity 40ms ease}
      .budget-bar-fill--load,.kpi-progress-fill--load{animation:none;transform:scaleX(var(--budget-scale,1));transition:opacity 40ms ease}
      .kpi-progress-fill--from-right.kpi-progress-fill--load,.kpi-progress-fill--from-right:not(.kpi-progress-fill--load){transform-origin:right center}
      .inp--shake{animation:none}
      .btn-primary:active,.btn-secondary:active,.btn-danger:active,.btn-sm:active{transform:none}
      .status-approved,.status-pending,.status-rejected,.badge.status-approved,.badge.status-pending,.badge.status-rejected{transition:opacity 40ms ease}
      .chart-tooltip{animation:none;opacity:1;transform:none}
      .sidebar-user-row__chevron,.sidebar-user-row__chevron--open{transition:none}
      .sidebar-user-row__chevron--open{transform:rotate(180deg)}
      .calendar-month-panel{transition:opacity 100ms ease}
      .calendar-month-panel--dir-next.calendar-month-panel--enter,.calendar-month-panel--dir-prev.calendar-month-panel--enter,.calendar-month-panel--dir-next.calendar-month-panel--leave,.calendar-month-panel--dir-prev.calendar-month-panel--leave{transform:none!important}
      .calendar-month-panel--dir-next.calendar-month-panel--enter,.calendar-month-panel--dir-prev.calendar-month-panel--enter{opacity:0}
      .calendar-month-panel--dir-next.calendar-month-panel--enter.calendar-month-panel--active,.calendar-month-panel--dir-prev.calendar-month-panel--enter.calendar-month-panel--active{opacity:1}
      .calendar-month-panel--leave.calendar-month-panel--active{opacity:0.6}
    }

/* ─────────────────────────────────────────────────────────────────────────────
   SOLANA EXPENSE TRACKER v4
   All view components defined OUTSIDE SolanaExpenses → fixes focus loss bug
   State shared via React.createContext
───────────────────────────────────────────────────────────────────────────── */
const{useState,useEffect,useLayoutEffect,useRef,useCallback,useMemo,createContext,useContext}=React;

function useCoarseMobile(){
  const [coarse,setCoarse]=useState(()=>typeof window!=="undefined"&&window.matchMedia("(max-width:767px),(pointer:coarse)").matches);
  useEffect(()=>{
    const mq=window.matchMedia("(max-width:767px),(pointer:coarse)");
    const onChange=()=>setCoarse(mq.matches);
    onChange();
    mq.addEventListener("change",onChange);
    return()=>mq.removeEventListener("change",onChange);
  },[]);
  return coarse;
}

/** Persist state in sessionStorage (tab session only). Removes key when value equals default. */
function useSessionState(key,defaultVal){
  const [val,setVal]=useState(()=>{
    try{
      const s=sessionStorage.getItem(key);
      if(s==null)return defaultVal;
      return JSON.parse(s);
    }catch(e){return defaultVal;}
  });
  const setter=useCallback((v)=>{
    setVal(prev=>{
      const next=typeof v==="function"?v(prev):v;
      try{
        if(JSON.stringify(next)===JSON.stringify(defaultVal))sessionStorage.removeItem(key);
        else sessionStorage.setItem(key,JSON.stringify(next));
      }catch(e){/* quota / private mode */}
      return next;
    });
  },[key,defaultVal]);
  return[val,setter];
}
/** Multi-select filter helpers ([] = all). Migrates legacy "all" or single string from session. */
function asMultiFilter(val){
  if(val==null||val==="all")return[];
  if(Array.isArray(val))return val.filter(v=>v!=null&&v!=="");
  if(typeof val==="string"&&val)return[val];
  return[];
}
function isMultiFilterAll(selected,optionCount){
  const s=asMultiFilter(selected);
  if(s.length===0)return true;
  if(optionCount<=1)return false;
  return s.length>=optionCount;
}
function toggleMultiFilterValue(selected,value,optionValues){
  const all=optionValues.length;
  const cur=asMultiFilter(selected);
  const wasAll=cur.length===0||(all>1&&cur.length>=all);
  if(wasAll)return[value];
  const set=new Set(cur);
  if(set.has(value))set.delete(value);
  else set.add(value);
  if(set.size===0||(all>1&&set.size>=all))return[];
  return[...set];
}
function multiFilterSummary(prefix,selected,options,allLabel){
  const s=asMultiFilter(selected);
  if(s.length===0||(options.length>1&&s.length>=options.length))return`${prefix}: ${allLabel}`;
  if(s.length===1){
    const opt=options.find(o=>o.value===s[0]);
    return`${prefix}: ${opt?opt.label:s[0]}`;
  }
  return`${prefix}: ${s.length}`;
}
function isMultiFilterActive(selected,optionCount){
  return!isMultiFilterAll(selected,optionCount);
}

/** Backend auth server URL. Set to empty string to use local-only mode (no signup/server login). */
const AUTH_URL = (typeof window !== "undefined" && window.__SOLANA_AUTH_URL__) || "";
function keepServerWarm() {
  if (!AUTH_URL) return;
  const ping = () => {
    fetch(AUTH_URL + "/health", { method: "GET" }).catch(() => {});
  };
  ping();
  setInterval(ping, 10 * 60 * 1000);
}
keepServerWarm();
/** HTTP API (same origin as AUTH_URL). Bearer token + refresh on 401. Offline write queue. */
const OFFLINE_QUEUE_KEY = "solana_offline_queue";

function readOfflineQueue() {
  try {
    const r = localStorage.getItem(OFFLINE_QUEUE_KEY);
    if (!r) return [];
    const a = JSON.parse(r);
    return Array.isArray(a) ? a : [];
  } catch (e) {
    return [];
  }
}
function writeOfflineQueue(q) {
  try {
    localStorage.setItem(OFFLINE_QUEUE_KEY, JSON.stringify(q));
  } catch (e) {}
}

function dispatchSolanaToast(message, kind, durationMs) {
  const k = kind || "info";
  const defaultMs = { success: 3500, error: 7000, info: 4000, sync: 3500, offline: 5000, conflict: 7000 };
  const ms = Number.isFinite(Number(durationMs)) ? Number(durationMs) : (defaultMs[k] ?? 4000);
  window.dispatchEvent(new CustomEvent("solana-toast", { detail: { message, kind: k, durationMs: ms } }));
}
function toastSaved(label) {
  const msg = label ? `${label} guardado correctamente` : "Guardado correctamente";
  dispatchSolanaToast(msg, "success");
}
function toastSaveFailed(message) {
  dispatchSolanaToast(message || "No se pudo guardar.", "error");
}

function isNetworkError(e) {
  if (!e) return false;
  if (e.name === "TypeError") return true;
  const m = String(e.message || "");
  if (/Failed to fetch|NetworkError|Load failed|network/i.test(m)) return true;
  return false;
}

function isPermanentOfflineSyncError(err) {
  const st = err && err.status;
  return st === 400 || st === 403 || st === 404 || st === 422;
}

function shouldPauseOfflineSync(err) {
  if (!err) return true;
  if (isPermanentOfflineSyncError(err)) return false;
  if (err.status === 409) return true;
  if (isNetworkError(err)) return true;
  if (String(err.message || "").indexOf("Sesión expirada") >= 0) return true;
  const st = err.status;
  if (typeof st === "number" && st >= 500) return true;
  return true;
}

function shouldQueueWrite(method, path) {
  const m = String(method || "").toUpperCase();
  if (m !== "POST" && m !== "PUT" && m !== "DELETE") return false;
  const p = path || "";
  if (p.indexOf("/expenses") !== 0) return false;
  // Never queue receipt uploads — b64 payloads are too large for localStorage
  if (p.indexOf("/receipt") !== -1) return false;
  // Never queue approve/reject/reconsider/comment — always attempt fetch when online
  if (/\/(approve|reject|reconsider|comment)/.test(p)) return false;
  return true;
}

function makeOfflineQueuedError() {
  const e = new Error("OFFLINE_QUEUED");
  e.code = "OFFLINE_QUEUED";
  return e;
}

function isOfflineQueuedError(e) {
  return e && (e.code === "OFFLINE_QUEUED" || e.message === "OFFLINE_QUEUED");
}

/** Comment POST failed due to gateway, timeout, missing route, or network — safe to merge locally */
function isCommentPostUnavailable(e) {
  if (isNetworkError(e)) return true;
  const m = String(e && e.message ? e.message : "");
  if (/HTTP 502|HTTP 503|HTTP 504|HTTP 404|Bad Gateway|Gateway Timeout/i.test(m)) return true;
  return false;
}

function enqueueOfflineOp(method, path, body, meta) {
  const q = readOfflineQueue();
  q.push({
    id: "q_" + Date.now() + "_" + Math.random().toString(36).slice(2, 11),
    method: String(method).toUpperCase(),
    path,
    body: body === undefined ? null : body,
    meta: meta && typeof meta === "object" ? meta : {},
    enqueuedAt: Date.now(),
  });
  writeOfflineQueue(q);
  dispatchSolanaToast("Guardado localmente, se sincronizará al reconectar", "offline");
  throw makeOfflineQueuedError();
}

const API = {
  get base() {
    const runtime=(typeof window!=="undefined"&&window.__SOLANA_AUTH_URL__)||"";
    return AUTH_URL||runtime||"";
  },
  token: null,
  _userId: null,
  _flushBusy: false,

  /** Bearer for requests: memory token, or sync from sessionStorage (login / refresh). */
  ensureSessionToken() {
    if (this.token) return;
    try {
      const s = sessionStorage.getItem("sol-session-token");
      if (s) this.token = s;
    } catch (e) {
      this.token = null;
    }
  },

  mergeMeta(meta) {
    if (!meta || typeof meta !== "object") return {};
    const o = { ...meta };
    delete o.skipOfflineQueue;
    return o;
  },

  async _rawFetch(method, path, body) {
    this.ensureSessionToken();
    const opts = { method, headers: {} };
    if (this.token) opts.headers.Authorization = "Bearer " + this.token;
    if (body != null && method !== "GET" && method !== "HEAD" && method !== "DELETE") {
      opts.headers["Content-Type"] = "application/json";
      opts.body = JSON.stringify(body);
    }
    return fetch(this.base + path, opts);
  },

  async requestNoQueue(method, path, body) {
    if (!this.base) throw new Error("API no configurada.");
    let res = await this._rawFetch(method, path, body);
    if (res.status === 401) {
      const ok = await this.refresh();
      if (ok) {
        res = await this._rawFetch(method, path, body);
      } else {
        window.dispatchEvent(new Event("solana-session-expired"));
        throw new Error("Sesión expirada");
      }
    }
    const ct = (res.headers.get("content-type") || "").toLowerCase();
    const data = ct.includes("application/json") ? await res.json().catch(() => ({})) : {};
    if (res.status === 409) {
      dispatchSolanaToast("Conflicto al sincronizar, revisa los datos", "conflict");
      throw Object.assign(new Error(data.error || "Conflicto"), { status: 409 });
    }
    if (!res.ok) throw Object.assign(new Error(data.error || "HTTP " + res.status), { status: res.status });
    return data;
  },

  async request(method, path, body, meta) {
    if (!this.base) throw new Error("API no configurada.");
    const skipOfflineQueue = !!(meta && meta.skipOfflineQueue);
    const storedMeta = this.mergeMeta(meta);
    const queueWrite = shouldQueueWrite(method, path) && !skipOfflineQueue;

    if (queueWrite && typeof navigator !== "undefined" && !navigator.onLine) {
      enqueueOfflineOp(method, path, body, storedMeta);
    }

    try {
      let res = await this._rawFetch(method, path, body);
      if (res.status === 401) {
        const ok = await this.refresh();
        if (ok) {
          res = await this._rawFetch(method, path, body);
        } else {
          window.dispatchEvent(new Event("solana-session-expired"));
          throw new Error("Sesión expirada");
        }
      }
      const ct = (res.headers.get("content-type") || "").toLowerCase();
      const data = ct.includes("application/json") ? await res.json().catch(() => ({})) : {};
      if (res.status === 409) {
        dispatchSolanaToast("Conflicto al sincronizar, revisa los datos", "conflict");
        throw Object.assign(new Error(data.error || "Conflicto"), { status: 409 });
      }
      if (!res.ok) throw new Error(data.error || "HTTP " + res.status);
      return data;
    } catch (e) {
      if (queueWrite && isNetworkError(e)) {
        enqueueOfflineOp(method, path, body, storedMeta);
      }
      throw e;
    }
  },

  async refresh() {
    if (!AUTH_URL) return false;
    this.ensureSessionToken();
    try {
      const res = await fetch(AUTH_URL + "/auth/refresh", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          Authorization: "Bearer " + this.token,
        },
      });
      if (res.ok) {
        const data = await res.json();
        if (data.sessionToken) {
          this.token = data.sessionToken;
          this._userId = data.userId || (data.user && data.user.id) || null;
          try {
            sessionStorage.setItem("sol-session-token", data.sessionToken);
          } catch (e) {}
          return true;
        }
      }
    } catch (e) {}
    return false;
  },

  async logout() {
    if (!this.base || !this.token) return;
    try {
      await fetch(this.base + "/auth/logout", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          Authorization: "Bearer " + this.token,
        },
      });
    } catch (e) {}
    try {
      sessionStorage.removeItem("sol-session-token");
    } catch (e) {}
    this.token = null;
  },

  async flushOfflineQueue() {
    if (this._flushBusy) return;
    if (!this.base) return;
    this.ensureSessionToken();
    if (!this.token) return;
    if (typeof navigator !== "undefined" && !navigator.onLine) return;
    if (readOfflineQueue().length === 0) return;
    this._flushBusy = true;
    try {
      while (readOfflineQueue().length > 0) {
        const q = readOfflineQueue();
        const op = q[0];
        let data;
        try {
          data = await this.requestNoQueue(op.method, op.path, op.body);
        } catch (err) {
          if (shouldPauseOfflineSync(err)) break;
          writeOfflineQueue(q.slice(1));
          dispatchSolanaToast(
            err.message || "No se pudo sincronizar un cambio guardado localmente.",
            "error"
          );
          continue;
        }

        if (op.method === "POST" && op.path === "/expenses" && op.meta && op.meta.pendingReceipt && data.expense && data.expense.id) {
          try {
            await this.requestNoQueue("POST", "/expenses/" + encodeURIComponent(data.expense.id) + "/receipt", {
              b64: op.meta.pendingReceipt.b64,
              mediaType: op.meta.pendingReceipt.mediaType || op.meta.pendingReceipt.type || "image/jpeg",
            });
          } catch (recErr) {
            if (shouldPauseOfflineSync(recErr)) break;
            writeOfflineQueue(q.slice(1));
            dispatchSolanaToast(
              recErr.message || "No se pudo sincronizar un cambio guardado localmente.",
              "error"
            );
            continue;
          }
        }

        writeOfflineQueue(q.slice(1));
        dispatchSolanaToast("Sincronizado", "sync");
        window.dispatchEvent(new CustomEvent("solana-offline-sync", { detail: { op, response: data } }));
      }
    } finally {
      this._flushBusy = false;
    }
  },

  async fetchBinary(path) {
    this.ensureSessionToken();
    const res = await fetch(this.base + path, {
      method: "GET",
      headers: {
        Authorization: "Bearer " + (this.token || ""),
      },
    });
    if (!res.ok) {
      let msg = "Error " + res.status;
      try {
        const ct = res.headers.get("content-type") || "";
        if (ct.includes("application/json")) {
          const j = await res.json();
          if (j && j.error) msg = j.error;
        }
      } catch (_) {}
      throw new Error(msg);
    }
    return res.blob();
  },

  get: (path) => API.request("GET", path, null, undefined),
  post: (path, body, meta) => API.request("POST", path, body, meta),
  put: (path, body, meta) => API.request("PUT", path, body, meta),
  delete: (path, meta) => API.request("DELETE", path, null, meta),
};

async function debugApiRequest(method, path, body) {
  if (!API.base) throw new Error("API no configurada.");
  let response = await API._rawFetch(String(method || "GET").toUpperCase(), path, body);
  if (response.status === 401) {
    const ok = await API.refresh();
    if (ok) response = await API._rawFetch(String(method || "GET").toUpperCase(), path, body);
  }
  const rawText = await response.text().catch(() => "");
  let responseBody = {};
  try { responseBody = rawText ? JSON.parse(rawText) : {}; } catch (e) {}
  return { response, responseBody, rawText };
}

function formatTimelineTimestamp(at){
  try{
    const d=new Date(at);
    if(Number.isNaN(d.getTime()))return String(at||"");
    return d.toLocaleString("es-ES",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"});
  }catch(err){
    return String(at||"");
  }
}
function parseTimelineNumber(val){
  if(val==null||val==="")return null;
  if(typeof val==="number"&&Number.isFinite(val))return val;
  const n=parseMoney(String(val));
  return Number.isFinite(n)?n:null;
}
function formatTimelineFieldValue(field,val,ctx){
  if(val==null||val==="")return"—";
  if(field==="amount"||field==="ivaAmount"){
    const n=parseTimelineNumber(val);
    return n!=null?fmt(n):String(val);
  }
  if(field==="paidBy")return null;
  if(field==="splitMode"){
    const modes={equal:"Partes iguales",percentage:"Por porcentaje",amount:"Por importe"};
    return modes[String(val)]||String(val);
  }
  if(field==="departmentId"&&ctx?.departments){
    const hit=(ctx.departments||[]).find(d=>d.id===val);
    return hit?.name||String(val);
  }
  if(field==="ivaRate"){
    const n=Number(val);
    if(!Number.isFinite(n))return String(val);
    if(n===0)return"Sin IVA";
    return`${n}%`;
  }
  if(field==="date"||field==="dueDate"){
    try{return fmtDate(String(val).slice(0,10));}catch(e){return String(val);}
  }
  return String(val);
}
function summarizeEditChanges(changes,ctx,t){
  const summaries=[];
  const seen=new Set();
  for(const ch of changes||[]){
    if(!ch||!ch.field)continue;
    const field=ch.field;
    if(TIMELINE_SKIP_EDIT_FIELDS.has(field)||!TIMELINE_REVIEWER_EDIT_FIELDS.has(field))continue;
    if(timelineFieldValuesEqual(field,ch.from,ch.to))continue;
    if(field==="paidBy"||field==="splitMode"){
      if(!seen.has("split")){seen.add("split");summaries.push(t?t("timeline.splitUpdated"):"Reparto actualizado");}
      continue;
    }
    if(field==="receipt"||field==="receiptType"){
      if(!seen.has("attachment")){seen.add("attachment");summaries.push(t?t("timeline.attachmentUpdated"):"Adjunto actualizado");}
      continue;
    }
    if(field==="notes"&&timelineFieldValueEmpty(ch.from)&&timelineFieldValueEmpty(ch.to))continue;
    const label=EDIT_FIELD_LABELS[field]||field;
    const from=formatTimelineFieldValue(field,ch.from,ctx);
    const to=formatTimelineFieldValue(field,ch.to,ctx);
    summaries.push(`${label}: ${from} → ${to}`);
  }
  return{summaries};
}
function buildEditSummaryFromMeta(meta,t){
  const raw=meta&&Array.isArray(meta.fields)?meta.fields:[];
  const fields=raw.filter(f=>TIMELINE_REVIEWER_EDIT_FIELDS.has(f)&&!TIMELINE_SKIP_EDIT_FIELDS.has(f));
  if(!fields.length)return{summaries:[]};
  const labels=[];
  const seen=new Set();
  for(const f of fields){
    if(f==="paidBy"||f==="splitMode"){
      if(!seen.has("split")){seen.add("split");labels.push(t("timeline.splitUpdated"));}
    }else if(f==="receipt"||f==="receiptType"){
      if(!seen.has("attachment")){seen.add("attachment");labels.push(t("timeline.attachmentUpdated"));}
    }else{
      const keyMap={
        amount:"label.amount",description:"label.description",category:"label.category",date:"label.date",
        departmentId:"label.department",notes:"label.notes",
      };
      labels.push(keyMap[f]?t(keyMap[f]):(EDIT_FIELD_LABELS[f]||f));
    }
  }
  if(!labels.length)return{summaries:[]};
  return{summaries:[t("timeline.editedFields",{fields:labels.join(", ")})]};
}
function buildExpenseDetailTimelineEvents(e,serverAudit,useServerAudit,departments,t){

        }else if(Array.isArray(tr.meta.fields)&&tr.meta.fields.length>0){

      id:c.id||`cmt-${c.at}`,
      at:c.at||c.createdAt,
      action:"comment_added",
      by:c.by||c.userId,
      note:String(c.text||"").trim(),
    });
  });
  const hasSubmitted=events.some(ev=>ev.action==="submitted"||ev.action==="created");
  if(e.createdAt&&!hasSubmitted){
    events.push({
      id:"syn-created",
      at:new Date(e.createdAt).toISOString(),
      action:"submitted",
      by:e.submittedBy||e.userId,
    });
  }
  if(e.approvedAt&&!events.some(ev=>ev.action==="approved"||ev.action==="auto_approved")){
    events.push({
      id:"syn-approved",
      at:new Date(e.approvedAt).toISOString(),
      action:"approved",
      by:e.approvedBy,

  }
  if(!useServerAudit&&e.rejectedAt&&!events.some(ev=>ev.action==="rejected")){
    events.push({
      id:"syn-rejected",
      at:new Date(e.rejectedAt).toISOString(),
      action:"rejected",
      by:e.rejectedBy,
      note:e.rejectionNote||null,
    });
  }
  return foldReapprovalIntoEdits(events)
    .filter(ev=>!TIMELINE_HIDDEN_ACTIONS.has(ev.action)&&ev.action!=="reapproval_required")
    .sort((a,b)=>new Date(a.at).getTime()-new Date(b.at).getTime());
}
function collapseTimelineEvents(events){

      last._collapseCount=(last._collapseCount||1)+1;
      last._collapsedRaw=[...(last._collapsedRaw||[{id:last.id,at:last.at,by:last.by,note:last.note,meta:last.meta}]),{id:ev.id,at:ev.at,by:ev.by,note:ev.note,meta:ev.meta}];

const availableApprovalActions=(e,user,users,cats)=>{

  if(e._pendingSync)return actions;
  const approverIds=effectiveExpenseApproverIds(e,cats,users);
  const isApprover=approverIds.includes(user.id);
  if(!isApprover)return actions;
  if(AUTH_URL&&e._apiType==="expense"){
    const rawStatus=String(e.status||"");
    if(rawStatus==="deleted")return actions;

      const myVote=approvalVoteFor(e.approvals||{},user.id,users);
      if(myVote!=="approved")actions.approve=true;

const getItemStatus=(item,cats,users)=>{
  if (item && item._apiType === 'expense' && item.status) {
    const s = String(item.status);
    if (s === 'deleted') return 'deleted';
    if (s === 'rejected') return 'rejected';
    if (s === 'approved') return 'approved';
    if (s === 'submitted' || s === 'draft') return 'pending';
  }
  if (item && item._apiType === 'expense' && item.status === 'rejected') return 'rejected';
  if (item && item._apiType === 'expense' && item.status === 'approved') return 'approved';
  if (item && item._apiType === 'expense' && item.status === 'deleted') return 'deleted';
  if(item&&item._apiType==="expense"&&item.status){
    const s=item.status;
    if(s==="deleted")return"deleted";
    if(s==="rejected")return"rejected";
    if(s==="approved")return"approved";
    if(s==="submitted"||s==="draft"){
      const reqIdsRaw=Array.isArray(item.approvalRequired)&&item.approvalRequired.length>0?item.approvalRequired:null;
      let reqIds;

        if(reqIds.every(id=>v(id)==="approved"))return"approved";

      }
      return"pending";
    }
  }
  const approverIds=effectiveExpenseApproverIds(item,cats,users);
  const a=item.approvals||{};
  const v=id=>approvalVoteFor(a,id,users);
  if(approverIds.some(id=>v(id)==="rejected"))return"rejected";

/** Build paidBy with amount + pct from NewPanel split state; fixes cent drift on last row. */
const buildPaidByFromSplitState=(splits,totalAmt,spMode)=>{
  const sel=(splits||[]).filter(s=>s.checked);
  if(sel.length===0)return[];
  const rows=sel.map(s=>{
    let am,P;
    if(spMode==="amount"){
      am=parseFloat(Number(s.value||0).toFixed(2));
      P=totalAmt>0?(am/totalAmt)*100:0;
    }else{
      P=Number(s.percent)||0;
      am=parseFloat((totalAmt*P/100).toFixed(2));
    }
    return{userId:s.userId,amount:am,pct:Math.round(P*100)/100};
  });
  const sum=rows.reduce((a,r)=>a+r.amount,0);
  if(rows.length&&totalAmt>0&&Math.abs(sum-totalAmt)>0.01){
    const last={...rows[rows.length-1]};
    last.amount=parseFloat((last.amount+(totalAmt-sum)).toFixed(2));
    last.pct=Math.round((last.amount/totalAmt)*10000)/100;
    rows[rows.length-1]=last;
  }
  return rows;
};

    return;
  }
  try{API.ensureSessionToken();}catch(e){}

  if(!tok){dispatchSolanaToast(t("msg.sessionExpired"),"error");return;}

  const url=URL.createObjectURL(blob);
  const a=Object.assign(document.createElement("a"),{href:url,download:downloadName});
  document.body.appendChild(a);

  URL.revokeObjectURL(url);

function guessMimeFromReceiptPath(p){
  if(!p) return 'application/octet-stream';
  let stem = String(p);
  try {
    if(/^https?:\/\//i.test(stem)) stem = new URL(stem).pathname;
  } catch (e0) {}
  const extRaw = stem.includes('.') ? stem.split('.').pop() : '';
  const ext = String(extRaw || '').toLowerCase().replace(/[#?].*$/, '');
  if(ext === 'pdf')  return 'application/pdf';
  if(ext === 'png')  return 'image/png';
  if(ext === 'webp') return 'image/webp';
  if(ext === 'gif')  return 'image/gif';
  if(ext === 'tiff' || ext === 'tif') return 'image/tiff';
  if(ext === 'heic' || ext === 'heif') return 'image/heic';
  if(ext === 'jpg' || ext === 'jpeg' || ext === 'jpe') return 'image/jpeg';
  if(ext === 'xlsx') return 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
  if(ext === 'xls')  return 'application/vnd.ms-excel';
  if(ext === 'docx') return 'application/vnd.openxmlformats-officedocument.wordprocessingml.document';
  if(ext === 'doc')  return 'application/msword';
  if(ext === 'csv')  return 'text/csv';
  if(ext === 'zip')  return 'application/zip';
  return 'application/octet-stream';
}

function nextRecurrenceDueDate(isoDate,rule){
  if(!isoDate||!rule)return null;
  const r=String(rule).trim();
  const parts=String(isoDate).slice(0,10).split("-").map(Number);
  if(parts.length!==3||parts.some(n=>!Number.isFinite(n)))return null;
  let y=parts[0],m=parts[1]-1,d=parts[2];
  if(r==="weekly"){const dt=new Date(Date.UTC(y,m,d));dt.setUTCDate(dt.getUTCDate()+7);return dt.toISOString().slice(0,10);}
  if(r==="biweekly"){const dt=new Date(Date.UTC(y,m,d));dt.setUTCDate(dt.getUTCDate()+14);return dt.toISOString().slice(0,10);}
  if(r==="daily"){const dt=new Date(Date.UTC(y,m,d));dt.setUTCDate(dt.getUTCDate()+1);return dt.toISOString().slice(0,10);}
  if(r.startsWith("custom:")){
    const tail=r.slice(7);
    const match=tail.match(/^(\d+)(days|weeks|months|years)$/);
    if(match){
      const n=parseInt(match[1],10);
      const unit=match[2];
      const dt=new Date(Date.UTC(y,m,d));
      if(unit==="days"){dt.setUTCDate(dt.getUTCDate()+n);return dt.toISOString().slice(0,10);}
      if(unit==="weeks"){dt.setUTCDate(dt.getUTCDate()+n*7);return dt.toISOString().slice(0,10);}
      if(unit==="months"){dt.setUTCMonth(dt.getUTCMonth()+n);return dt.toISOString().slice(0,10);}
      if(unit==="years"){dt.setUTCFullYear(dt.getUTCFullYear()+n);return dt.toISOString().slice(0,10);}
    }
    const legacy=parseInt(tail,10);
    const n=Number.isFinite(legacy)&&legacy>=1?legacy:1;
    const dt2=new Date(Date.UTC(y,m,d));
    dt2.setUTCMonth(dt2.getUTCMonth()+n);
    return dt2.toISOString().slice(0,10);
  }
  if(r==="monthly")m+=1;
  else if(r==="quarterly")m+=3;
  else if(r==="yearly")y+=1;
  else return null;
  const dt=new Date(Date.UTC(y,m,d));
  return dt.toISOString().slice(0,10);
}

function enumerateRecurrenceDatesInRange(anchorDate,rule,rangeStart,rangeEnd,endDate){

  let cur=anchorDate;

  while(dates.length<400){
    if(!cur||seen.has(cur))break;
    seen.add(cur);
    if(endDate&&cur>endDate)break;
    if(rangeEnd&&cur>rangeEnd)break;
    if(cur>=rangeStart)dates.push(cur);
    const next=nextRecurrenceDueDate(cur,rule);
    if(!next||next===cur)break;
    cur=next;
  }

}

  if(cadenceKey==="quarterly")return addMonthsToISODate(baseDate,3);

  if(r==="biweekly")return ev*2.17;
  if(r==="monthly")return ev;
  if(r==="yearly")return ev/12;
  if(r==="quarterly")return ev/3;
  if(r==="daily")return ev*(365/12);
  if(String(r).startsWith("custom:")){
    const tail=String(r).slice(7);
    const match=tail.match(/^(\d+)(days|weeks|months|years)$/);
    if(match){
      const n=Math.max(1,parseInt(match[1],10)||1);
      const unit=match[2];
      if(unit==="days")return ev*(30/n);
      if(unit==="weeks")return ev*(4.33/n);
      if(unit==="months")return ev/n;

    }

  }

}

const commentTsMs=(c)=>{
  if(!c)return 0;
  if(c.at)return new Date(c.at).getTime()||0;
  if(c.createdAt!=null)return Number(c.createdAt)||0;
  return 0;
};
const commentsSeenTsMs=(e,userId)=>{
  if(e&&e.commentsSeenAt!=null){
    const v=e.commentsSeenAt;
    if(typeof v==="number")return v;
    const t=new Date(v).getTime();
    return isNaN(t)?0:t;
  }
  if(!userId)return 0;
  try{
    const map=JSON.parse(localStorage.getItem("sol-comments-seen-"+userId)||"{}");
    if(map&&map[e.id]!=null)return Number(map[e.id])||0;
  }catch(err){}
  return 0;
};
const expenseIsOwnerOrSubmitter=(e,userId)=>{
  if(!e||!userId)return false;
  return e.submittedBy===userId||e.ownerId===userId||e.userId===userId;
};
const expenseHasUnreadComments=(e,userId)=>{
  if(!expenseIsOwnerOrSubmitter(e,userId))return false;
  const seenAt=commentsSeenTsMs(e,userId);
  return (e.comments||[]).some(c=>{
    const by=c&&(c.by||c.userId);
    if(!by||by===userId)return false;
    if(!String(c.text||"").trim())return false;
    return commentTsMs(c)>seenAt;
  });
};

const calcIvaParts=(amount,ratePercent)=>{
  const a=Number(amount)||0;
  if(ratePercent==null||ratePercent===0)return{base:a,iva:0};
  const r=Number(ratePercent)/100;
  const iva=Math.round((a/(1+r))*r*100)/100;
  const base=Math.round((a-iva)*100)/100;
  return{base,iva};
};

function expenseIvaRatesEqual(a,b){
  const norm=v=>{
    if(v===null||v==="none")return"sin";
    if(v===undefined||v==="")return"unset";
    const n=Number(v);
    return Number.isNaN(n)?String(v):n;
  };
  const na=norm(a),nb=norm(b);
  if(na==="sin"&&nb==="sin")return true;
  if(na==="unset"&&nb==="unset")return true;
  if(na==="sin"&&nb==="unset")return true;
  if(na==="unset"&&nb==="sin")return true;
  return na===nb;
}

async function fetchAndApplyServerSettings(authUrl, token) {
  if (!authUrl || !token) return;
  try {
    const r = await fetch(authUrl + '/settings', {
      headers: { Authorization: 'Bearer ' + token }
    });
    if (!r.ok) return;
    const { settings } = await r.json();
    if (!settings) return;

    if (Array.isArray(settings.categories) && settings.categories.length > 0) {
      try { localStorage.setItem('sol-cats', JSON.stringify(settings.categories)); } catch(e) {}
    }
    if (settings.department_approvers && typeof settings.department_approvers === 'object' && !Array.isArray(settings.department_approvers)) {
      try { localStorage.setItem(DEPT_APPROVERS_LS_KEY, JSON.stringify(settings.department_approvers)); } catch(e) {}
      setDeptApproversMap(settings.department_approvers);
    }
    if (Array.isArray(settings.iva_rates) && settings.iva_rates.length > 0) {
      try { localStorage.setItem(IVA_RATES_KEY, JSON.stringify(settings.iva_rates)); } catch(e) {}
    }
    if (settings.iva_default != null) {
      try { localStorage.setItem(IVA_DEFAULT_KEY, JSON.stringify(Number(settings.iva_default))); } catch(e) {}
    }
    applyServerSettings({
      ...(settings.locale != null ? { locale: settings.locale } : {}),
    });
  } catch(e) {
    // non-blocking — local defaults remain in effect
  }
}

 *  Does not mutate. Idempotent — safe to call even if approvals already exist. */
const autoApprove=(submitterId,approverIds,existingApprovals,auditTrail)=>{
  if(!approverIds.includes(submitterId))return{approvals:existingApprovals||{},auditTrail:auditTrail||[]};
  if((existingApprovals||{})[submitterId]==="approved")return{approvals:existingApprovals,auditTrail};
  const approvals={...existingApprovals,[submitterId]:"approved"};
  const trail=[...auditTrail,{action:"auto_approved",by:submitterId,at:new Date().toISOString(),meta:{reason:"submitter_is_approver"}}];
  return{approvals,auditTrail:trail};
};

/* ── TOAST (single slot, replace with fade) ─────────────────────────────────── */
function ToastContainer(){
  const [slot,setSlot]=useState({toast:null,phase:"hidden"});
  const slotRef=useRef(slot);
  slotRef.current=slot;
  const timersRef=useRef([]);
  const clearTimers=useCallback(()=>{
    timersRef.current.forEach(id=>clearTimeout(id));
    timersRef.current=[];
  },[]);
  const schedule=useCallback((fn,ms)=>{
    const id=setTimeout(fn,ms);
    timersRef.current.push(id);
  },[]);
  const present=useCallback((payload,dismissMs)=>{
    setSlot({toast:payload,phase:"enter"});
    schedule(()=>setSlot(s=>({...s,phase:"visible"})),20);
    schedule(()=>{
      setSlot(s=>({...s,phase:"exit"}));
      schedule(()=>setSlot({toast:null,phase:"hidden"}),200);
    },dismissMs);
  },[schedule]);
  const enqueue=useCallback((message,kind,durationMs)=>{
    clearTimers();
    const payload={id:"t_"+Date.now(),message,kind:kind||"info"};
    const defaultMs={success:3500,error:7000,info:4000,sync:3500,offline:5000,conflict:7000};
    const dismissMs=Number.isFinite(Number(durationMs))?Math.max(500,Number(durationMs)):(defaultMs[payload.kind]??4000);
    const cur=slotRef.current;
    if(cur.toast&&(cur.phase==="visible"||cur.phase==="enter"||cur.phase==="exit")){
      setSlot(s=>({...s,phase:"exit"}));
      schedule(()=>present(payload,dismissMs),200);
    }else{
      present(payload,dismissMs);
    }
  },[clearTimers,present,schedule]);
  useEffect(()=>{
    const h=(ev)=>{
      const{message,kind,durationMs}=ev.detail||{};
      if(message)enqueue(message,kind,durationMs);
    };
    window.addEventListener("solana-toast",h);
    return()=>{
      window.removeEventListener("solana-toast",h);
      clearTimers();
    };
  },[enqueue,clearTimers]);
  if(!slot.toast&&slot.phase==="hidden")return null;
  const phaseClass=slot.phase==="enter"?" toast-slot--enter":slot.phase==="exit"?" toast-slot--exit":"";
  return(
    <div className={`toast-slot${phaseClass}`}>
      <div className={`toast toast--${slot.toast.kind}`}>{slot.toast.message}</div>
    </div>
  );
}

function slugForReceiptDownload(description,maxLen){
  const s=String(description||"").trim();
  if(!s)return"";
  return s.slice(0,maxLen||40).replace(/[/\\?"*:|<>\x00-\x1f]/g,"").replace(/\s+/g,"_").replace(/_+/g,"_").replace(/^_|_$/g,"");
}

function cloudinaryDeliveryUrlOriginal(url){
  if(!url||typeof url!=="string")return url;
  const trimmed=url.trim();
  try{
    const u=new URL(trimmed);
    if(!/cloudinary\.com/i.test(u.hostname))return trimmed;
    const pathname=u.pathname;
    const lower=pathname.toLowerCase();
    const imageUpload="/image/upload/";
    const rawUpload="/raw/upload/";
    let idx=lower.indexOf(imageUpload);
    let len=imageUpload.length;
    if(idx===-1){idx=lower.indexOf(rawUpload);len=rawUpload.length;}
    if(idx===-1)return trimmed;
    const after=pathname.slice(idx+len);
    const parts=after.split("/");
    const vIdx=parts.findIndex(seg=>/^v\d+$/i.test(seg));
    if(vIdx<=0)return trimmed;
    u.pathname=pathname.slice(0,idx+len)+parts.slice(vIdx).join("/");
    return u.toString();
  }catch(e0){
    return trimmed;
  }
}

/** Infer application/pdf from base64 when client sent wrong MIME (e.g. image/jpeg). */
function receiptUploadMediaType(b64, declaredType) {
  const t = String(declaredType || '').trim().toLowerCase();
  if (t && t !== 'application/octet-stream') return t;
  const b = String(b64 || '').replace(/\s/g, '');
  if (b.startsWith('JVBERi')) return 'application/pdf';
  return t || 'image/jpeg';
}

function AttachmentViewer({receipt, receiptType, receiptPath, apiExpenseId, itemCode, attachmentDescription, label, onRemove, t}){
  const [blobUrl,setBlobUrl]=useState(null);
  const [blobMime,setBlobMime]=useState(null);
  const [blobLoad,setBlobLoad]=useState(false);
  const [blobErr,setBlobErr]=useState(null);
  const [reloadNonce,setReloadNonce]=useState(0);
  const [imgZoom,setImgZoom]=useState(false);

  const normalizedRemoteUrl=React.useMemo(()=>{
    if(!receiptPath||typeof receiptPath!=="string")return null;
    const t=receiptPath.trim();
    if(!/^https?:\/\//i.test(t))return null;
    return cloudinaryDeliveryUrlOriginal(t);
  },[receiptPath]);

  useEffect(() => {
    // Case 1: already have inline base64 receipt
    if (receipt) {
      setBlobUrl(null);
      setBlobMime(null);
      return;
    }
    // Case 2: receiptPath is a remote URL (Cloudinary) — use directly
    if (normalizedRemoteUrl) {
      setBlobUrl(normalizedRemoteUrl);
      setBlobMime(
        receiptPath.toLowerCase().includes('.pdf')
          ? 'application/pdf'
          : 'image/jpeg'
      );
      setBlobLoad(false);
      setBlobErr(null);
      return;
    }
    // Case 3: need to fetch from API
    const apiEntityPath = apiExpenseId
      ? '/expenses/' + encodeURIComponent(apiExpenseId) + '/receipt'
      : null;
    if (!apiEntityPath || !AUTH_URL) {
      setBlobUrl(null);
      setBlobMime(null);
      return;
    }
    let cancelled = false;
    let objUrl = null;
    setBlobLoad(true);
    setBlobErr(null);
    (async () => {
      try {
        const blob = await API.fetchBinary(apiEntityPath);
        if (cancelled) return;
        objUrl = URL.createObjectURL(blob);
        setBlobUrl(objUrl);
        const guessed = receiptPath ? guessMimeFromReceiptPath(receiptPath) : null;
        setBlobMime(
          blob.type && blob.type !== 'application/octet-stream'
            ? blob.type
            : (guessed || 'image/jpeg')
        );
      } catch(e) {
        if (!cancelled) setBlobErr(e.message || 'Sin recibo');
      } finally {
        if (!cancelled) setBlobLoad(false);
      }
    })();
    return () => {
      cancelled = true;
      if (objUrl) URL.revokeObjectURL(objUrl);
    };
  }, [apiExpenseId, receipt, receiptPath, normalizedRemoteUrl, reloadNonce]);

  useEffect(()=>{
    if(!imgZoom)return;
    const onKey=e=>{if(e.key==="Escape")setImgZoom(false);};
    window.addEventListener("keydown",onKey);
    return()=>window.removeEventListener("keydown",onKey);
  },[imgZoom]);

  const srcUrl = receipt
    ? "data:" + (receiptType || "image/jpeg") + ";base64," + receipt
    : (normalizedRemoteUrl || blobUrl);
  const mime = receipt
    ? (receiptType || "image/jpeg")
    : blobMime || (receiptPath && /\.pdf$/i.test(receiptPath)
        ? "application/pdf"
        : receiptPath && /\.(jpe?g|png|webp|gif|heic|heif|tiff?)$/i.test(receiptPath)
          ? "image/jpeg"
          : null);
  const isPdf=(mime||"").includes("pdf")||(receiptPath||"").toLowerCase().endsWith(".pdf");
  const isImage=(mime||"").startsWith("image/")||/\.(jpe?g|png|webp|gif|heic|heif|tiff?)$/i.test(receiptPath||"");
  const pathLower=(receiptPath?String(receiptPath).toLowerCase():"").split("?")[0];

  const isGenericBinary=!!srcUrl&&!isPdf&&!isImage;

  if(!srcUrl && !blobLoad){
    const canRetry=!receipt&&!!blobErr&&!!apiExpenseId&&!!AUTH_URL&&!!receiptPath&&!/^https?:\/\//i.test(String(receiptPath));
    return(
      <div style={{padding:"8px 10px",background:"#FAFAF8",borderRadius:7,border:"1px dashed #DDD6CC",
        fontSize:11,color:"#B5C0B8",display:"flex",flexWrap:"wrap",alignItems:"center",gap:8}}>
        <span style={{flex:"1 1 100%"}}>
          {blobErr?<>
            <span style={{display:"block",color:"#991B1B",fontWeight:600,marginBottom:4}}>No se pudo cargar el archivo.</span>
            <span>{blobErr}</span>
          </>:(t?t("expenses.noAttachment"):"Sin adjunto")}
        </span>
        {canRetry&&(
          <button type="button" onClick={()=>{setBlobErr(null);setReloadNonce(n=>n+1);}}
            style={{fontSize:10,padding:"4px 10px",borderRadius:6,border:"1px solid #DDD6CC",background:"#fff",color:"#4B5E52",cursor:"pointer",fontFamily:"inherit",fontWeight:600}}>
            Reintentar
          </button>
        )}
      </div>
    );
  }

  const openDataUrl = () => {
    if(srcUrl) window.open(srcUrl, "_blank", "noopener,noreferrer");
  };
  const downloadFile = () => {
    const url = srcUrl;
    if (!url) return;
    let urlFilename = '';
    if (/^https?:\/\//i.test(url)) {
      try {
        urlFilename = decodeURIComponent(url.split('/').pop().split('?')[0] || '');
      } catch {
        urlFilename = url.split('/').pop().split('?')[0] || '';
      }
    }
    if (urlFilename) {
      const a = Object.assign(document.createElement("a"), {
        href: url,
        download: urlFilename,
      });
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      return;
    }
    const ext = (() => {
      if (/\.[a-z0-9]{1,8}(?:[\?#]|$)/i.test(pathLower)){
        const m=pathLower.match(/\.([a-z0-9]{1,8})(?:[\?#]|$)/i);
        if(m) return "."+m[1].toLowerCase();
      }
      if ((mime||"").includes("pdf")) return ".pdf";
      if ((mime||"").includes("png")) return ".png";
      if ((mime||"").includes("webp")) return ".webp";
      if ((mime||"").includes("gif")) return ".gif";
      if ((mime||"").includes("tiff")) return ".tif";
      if ((mime||"").includes("spreadsheet")||(mime||"").includes("officedocument.spreadsheet")) return ".xlsx";
      if ((mime||"").includes("ms-excel")) return ".xls";
      if ((mime||"").includes("wordprocessingml")||(mime||"").includes("openxmlformats-officedocument.wordprocessing")) return ".docx";
      if ((mime||"").includes("msword")&&!(mime||"").includes("openxml")) return ".doc";
      if ((mime||"").includes("csv")) return ".csv";
      if ((mime||"").includes("zip")) return ".zip";
      return ".bin";
    })();
    const code = itemCode || apiExpenseId || "doc";
    const dateStr = new Date().toISOString().slice(0, 10);
    const descSlug=slugForReceiptDownload(attachmentDescription,40);
    const filename=`${code}_${dateStr}${descSlug?"_"+descSlug:""}${ext}`;
    const a = Object.assign(document.createElement("a"), {
      href: url,
      download: filename,
    });
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  };

  return(
    <div>
      {label&&<label className="lbl" style={{marginBottom:5}}>{label}</label>}
      {blobLoad&&(
        <div style={{width:"100%",height:200,background:"#F5F0EA",borderRadius:8,display:"flex",alignItems:"center",justifyContent:"center",color:"#9CAA9F",fontSize:12}}>
          Cargando archivo...
        </div>
      )}
      {!blobLoad&&!blobErr&&srcUrl&&isImage&&(
        <div style={{position:"relative"}}>
          <div style={{display:"block",background:"#F5F0EA",borderRadius:7,overflow:"visible",border:"1px solid #EDE8E0",minHeight:60,width:"100%"}}>
            <img src={srcUrl} alt={label||"Recibo"}
              style={{width:"100%",height:"auto",display:"block",objectFit:"contain",borderRadius:8,cursor:"zoom-in"}}
              onError={()=>setBlobErr("No se pudo cargar la imagen.")}
              onClick={()=>setImgZoom(true)}/>
          </div>
          <div style={{fontSize:10,color:"#9CAA9F",marginTop:4,textAlign:"center"}}>{t?t("receipt.tapEnlarge"):"Toca para ver a tamaño completo"}</div>
          {imgZoom&&ReactDOM.createPortal(
            <div role="dialog" aria-modal="true" aria-label={t?t("label.receipt"):"Recibo"}
              className="modal-overlay modal-overlay--open"
              style={{zIndex:99999,background:"rgba(0,0,0,0.9)",padding:12}}
              onClick={()=>setImgZoom(false)}>
              <button type="button" onClick={()=>setImgZoom(false)}
                style={{position:"absolute",top:10,right:10,zIndex:1,fontSize:12,padding:"6px 12px",borderRadius:6,border:"1px solid rgba(255,255,255,0.35)",background:"rgba(0,0,0,0.45)",color:"#fff",cursor:"pointer",fontFamily:"inherit"}}>
                {t?t("receipt.closeZoom"):"Cerrar"}
              </button>
              <img src={srcUrl} alt="" className="modal-panel" style={{maxWidth:"100%",maxHeight:"100%",objectFit:"contain",pointerEvents:"none",background:"transparent",boxShadow:"none",padding:0}} onClick={e=>e.stopPropagation()}/>
            </div>,
            document.body
          )}
          <div style={{marginTop:5,display:"flex",gap:5}}>
            <button type="button" onClick={openDataUrl} style={{fontSize:9,padding:"2px 8px",borderRadius:4,border:"1px solid #DDD6CC",background:"#FAFAF8",color:"#4B5E52",cursor:"pointer",fontFamily:"inherit"}}>
              {t?t("action.openFile"):"Abrir"}
            </button>
            <button type="button" onClick={downloadFile} style={{fontSize:9,padding:"2px 8px",borderRadius:4,border:"1px solid #DDD6CC",background:"#FAFAF8",color:"#4B5E52",cursor:"pointer",fontFamily:"inherit"}}>
              {t?t("action.downloadFile"):"Descargar"}
            </button>
            {onRemove&&<button type="button" onClick={onRemove} style={{fontSize:9,padding:"2px 8px",borderRadius:4,border:"1px solid #ECA3A3",background:"transparent",color:"#991B1B",cursor:"pointer",fontFamily:"inherit",marginLeft:"auto"}}>
              ✕ {t?t("action.remove"):"Eliminar"}
            </button>}
          </div>
        </div>
      )}
      {isPdf&&srcUrl&&(
        <div style={{padding:"12px 0",display:"flex",gap:8,flexWrap:"wrap",alignItems:"center"}}>
          <button
            type="button"
            onClick={()=>window.open(cloudinaryPdfUrl(srcUrl),"_blank")}
            style={{padding:"8px 16px",background:G,color:"white",
              border:"none",borderRadius:6,cursor:"pointer",fontSize:13,fontFamily:"inherit"}}>
            Ver PDF
          </button>
          <button
            type="button"
            onClick={async ()=>{
              try{
                const resp=await fetch(cloudinaryPdfUrl(srcUrl));
                if(!resp.ok)throw new Error("fetch failed");
                const blob=await resp.blob();
                const a=document.createElement("a");
                a.href=URL.createObjectURL(blob);
                const urlFilename=srcUrl.split("/").pop().split("?")[0]||"recibo.pdf";
                a.download=urlFilename;
                a.click();
                setTimeout(()=>URL.revokeObjectURL(a.href),10000);
              }catch(e){
                window.open(cloudinaryPdfUrl(srcUrl),"_blank");
              }
            }}
            style={{padding:"8px 16px",background:"#F5F0EA",color:G,
              border:`1px solid ${G}`,borderRadius:6,cursor:"pointer",
              fontSize:13,fontFamily:"inherit"}}>
            {t?t("action.downloadPdf"):"Descargar PDF"}
          </button>
          {onRemove&&<button type="button" onClick={onRemove} style={{fontSize:9,padding:"2px 8px",borderRadius:4,border:"1px solid #ECA3A3",background:"transparent",color:"#991B1B",cursor:"pointer",fontFamily:"inherit"}}>
            ✕ {t?t("action.remove"):"Eliminar"}
          </button>}
        </div>
      )}
      {isGenericBinary&&(
        <div style={{background:"#F5F0EA",borderRadius:7,border:"1px solid #EDE8E0",padding:"10px 12px"}}>
          <div style={{fontSize:11,color:"#4B5E52",marginBottom:6}}>Adjunto (sin vista previa) · {(mime||"application/octet-stream")}</div>
          <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
            <button type="button" onClick={openDataUrl} style={{fontSize:9,padding:"2px 8px",borderRadius:4,border:"1px solid #DDD6CC",background:"#FAFAF8",color:"#4B5E52",cursor:"pointer",fontFamily:"inherit"}}>
              {t?t("action.openFile"):"Abrir"}
            </button>
            <button type="button" onClick={downloadFile} style={{fontSize:9,padding:"2px 8px",borderRadius:4,border:"1px solid #DDD6CC",background:"#FAFAF8",color:"#4B5E52",cursor:"pointer",fontFamily:"inherit"}}>
              {t?t("action.downloadFile"):"Descargar"}
            </button>
            {onRemove&&<button type="button" onClick={onRemove} style={{fontSize:9,padding:"2px 8px",borderRadius:4,border:"1px solid #ECA3A3",background:"transparent",color:"#991B1B",cursor:"pointer",fontFamily:"inherit",marginLeft:"auto"}}>
              ✕ {t?t("action.remove"):"Eliminar"}
            </button>}
          </div>
        </div>
      )}
    </div>
  );
}

/* ── ITEM CODE BADGE ───────────────────────────────────────────────────────
   Displays the immutable item code with a one-click copy-to-clipboard button.
   inline=true renders a smaller inline version for list rows / bill detail.
─────────────────────────────────────────────────────────────────────────── */
function ItemCodeBadge({code, inline=false, copyHoverAccent}){
  const[copied,setCopied]=useState(false);
  const copyBtnBaseColor="#9CAA9F";
  const copy=()=>{
    navigator.clipboard?.writeText(code)
      .then(()=>{setCopied(true);setTimeout(()=>setCopied(false),1500);})
      .catch(()=>{});
  };
  if(inline)return(
    <span title={code} onClick={copy}
      style={{fontSize:9,fontWeight:700,color:"#9CAA9F",background:"#F5F0EA",
        padding:"2px 7px",borderRadius:5,fontFamily:"monospace",letterSpacing:"0.04em",
        cursor:"pointer",userSelect:"none",transition:"background 0.15s"}}
      onMouseEnter={e=>e.currentTarget.style.background=GL}
      onMouseLeave={e=>e.currentTarget.style.background="#F5F0EA"}>
      {copied?"":code}
    </span>
  );
  return(
    <div style={{display:"flex",alignItems:"center",gap:5,marginBottom:7}}>
      <div style={{display:"inline-block",padding:"2px 8px",borderRadius:6,fontSize:9,fontWeight:700,
        background:"#F5F0EA",color:"#9CAA9F",letterSpacing:"0.05em",fontFamily:"monospace"}}>
        {code}
      </div>
      <button onClick={copy}
        style={{padding:"2px 7px",borderRadius:5,border:"1px solid #DDD6CC",background:"transparent",
          color:copyBtnBaseColor,fontSize:9,cursor:"pointer",fontFamily:"inherit",fontWeight:600,
          transition:"background 0.15s,color 0.15s"}}
        onMouseEnter={e=>{if(copyHoverAccent)e.currentTarget.style.color=copyHoverAccent;}}
        onMouseLeave={e=>{e.currentTarget.style.color=copyBtnBaseColor;}}
        title="Copy item code">
        {copied?"Copiado":"⌘ Copiar"}
      </button>
    </div>
  );
}

/* ── SIGNUP SCREEN ─────────────────────────────────────────────────────────── */
function SignupScreen({onBack}){
  const tl=React.useMemo(()=>mkT(),[]);
  const [name,setName]=useState("");
  const [email,setEmail]=useState("");
  const [pw,setPw]=useState("");
  const [pw2,setPw2]=useState("");
  const [showPw,setShowPw]=useState(false);
  const [loading,setLoading]=useState(false);
  const [msg,setMsg]=useState("");
  const [success,setSuccess]=useState(false);
  const nameF=useInpFocus(), emailF=useInpFocus();
  const pwF=useInpFocus(), pw2F=useInpFocus();

  /* ── doSignup — LOGIC UNCHANGED ── */
  const doSignup=async()=>{
    if(!email.trim()||!pw){setMsg(tl("login.invalidCreds"));return;}
    if(pw!==pw2){setMsg(tl("signup.pwMismatch"));return;}
    if(!AUTH_URL){setMsg(tl("signup.serverDown"));return;}
    setLoading(true);setMsg("");
    try{
      const r=await fetch(AUTH_URL+"/auth/signup",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({email:email.trim().toLowerCase(),password:pw,name:name.trim()||undefined})});
      const d=await r.json();
      if(!r.ok){setMsg(d.error||tl("msg.genericShort"));setLoading(false);return;}
      setSuccess(true);
    }catch{setMsg(tl("signup.serverDown"));}
    setLoading(false);
  };

  /* ── Success state ── */
  if(success)return(
    <div style={AUTH.page}>
      <div style={{...AUTH.card,maxWidth:420,textAlign:"center"}}>
        <div style={{...AUTH.logoWrap,marginBottom:20}}>
          <SolanaLogo theme="dark" size="md" variant="auth"/>
        </div>
        <div style={{fontSize:40,marginBottom:16,lineHeight:1,color:"#16A34A",fontWeight:700}}></div>
        <h1 style={{...AUTH.title,marginTop:0,marginBottom:8,fontSize:20}}>
          {tl("signup.success")}
        </h1>
        <p style={{fontSize:13,color:"#6B7280",lineHeight:1.7,marginBottom:24,padding:"0 8px"}}>
          {tl("signup.helperNote")}
        </p>
        <div style={{background:"#fdf0e6",border:"1px solid #f0c4a8",borderRadius:9,
          padding:"10px 14px",marginBottom:24,fontSize:11,color:"#8a3a00",fontWeight:600}}>
          {tl("status.pendingVerification.title")}
        </div>

/* ── FORCE PASSWORD CHANGE ──────────────────────────────────────────────────
   Shown immediately after login when user.mustChangePassword === true.
   Blocks all app access until a new password is set.
─────────────────────────────────────────────────────────────────────────── */
function ForcePasswordChange({user, passwords, savePasswords, saveUsers, users, onDone, onSignOut}){
  const t=React.useMemo(()=>mkT(),[]);
  const [nw,setNw]=useState("");
  const [cn,setCn]=useState("");
  const [msg,setMsg]=useState("");
  const [ok,setOk]=useState(false);
  const [saving,setSaving]=useState(false);
  const [showNw,setShowNw]=useState(false);
  const [showCn,setShowCn]=useState(false);

  const doChange=async()=>{
    if(saving||ok)return;
    setMsg("");
    if(nw.length<8){setMsg(t("forceChange.tooShort"));return;}
    if(COMMON_PASSWORDS.has(nw.toLowerCase())){setMsg(t("forceChange.common"));return;}
    if(nw!==cn){setMsg(t("forceChange.mismatch"));return;}

    setSaving(true);
    try{
      if(AUTH_URL){
        const sessionToken=(()=>{try{return sessionStorage.getItem("sol-session-token")||"";}catch(e){return "";}})()||(API.token?String(API.token):"");
        if(!sessionToken){
          setMsg(t("msg.sessionExpired"));
          return;
        }
        const r=await fetch(AUTH_URL+"/auth/change-password",{
          method:"POST",
          headers:{"Content-Type":"application/json","Authorization":"Bearer "+sessionToken},
          body:JSON.stringify({userId:user.id,newPassword:nw}),
        });
        const d=await r.json().catch(()=>({}));
        if(!r.ok||!d.ok){
          setMsg(d.error||t("msg.genericShort"));
          return;
        }
      }else{
        const existing=passwords?.[user.id];
        if(existing&&nw===existing){
          setMsg("La nueva contraseña no puede ser igual a la anterior.");
          return;
        }
      }

      savePasswords({...passwords,[user.id]:nw});
      const updated=users.map(u=>u.id===user.id?{...u,mustChangePassword:false}:u);
      saveUsers(updated);
      appLog("info","forced_password_changed",{userId:user.id});
      setOk(true);
      dispatchSolanaToast("Contraseña actualizada correctamente.", "success", 5000);
      setTimeout(()=>onDone({...user,mustChangePassword:false}),600);
    }catch{
      setMsg(t("signup.serverDown"));
    }finally{
      setSaving(false);
    }
  };

  return(
    <div style={AUTH.page}>
      <div style={{width:"100%",maxWidth:400}}>
        <div style={AUTH.logoWrap}>
          <SolanaLogo theme="dark" size="md" variant="auth"/>
          <h1 style={AUTH.title}>{t("forceChange.title")}</h1>
          <p style={AUTH.subtitle}>{t("forceChange.subtitle")}</p>
        </div>
        <div style={AUTH.card}>
          <div style={{marginBottom:12}}>
            <label style={AUTH.lbl}>{t("forceChange.newPw")}</label>
            <div style={{position:"relative"}}>
              <input className="auth-inp" style={{...AUTH.inp,paddingRight:52}} type={showNw?"text":"password"} value={nw}
                onChange={e=>{setNw(e.target.value);setMsg("");}}
                onKeyDown={e=>e.key==="Enter"&&!saving&&doChange()} autoFocus disabled={saving||ok}/>
              <button type="button" className="touch-icon-btn" style={PW_TOGGLE_STYLE} onClick={()=>setShowNw(v=>!v)}>{showNw?t("login.hidePw")||"Ocultar":t("login.showPw")||"Ver"}</button>
            </div>
          </div>
          <div style={{marginBottom:16}}>
            <label style={AUTH.lbl}>{t("forceChange.confirmPw")}</label>
            <div style={{position:"relative"}}>
              <input className="auth-inp" style={{...AUTH.inp,paddingRight:52}} type={showCn?"text":"password"} value={cn}
                onChange={e=>{setCn(e.target.value);setMsg("");}}
                onKeyDown={e=>e.key==="Enter"&&!saving&&doChange()} disabled={saving||ok}/>
              <button type="button" className="touch-icon-btn" style={PW_TOGGLE_STYLE} onClick={()=>setShowCn(v=>!v)}>{showCn?t("login.hidePw")||"Ocultar":t("login.showPw")||"Ver"}</button>
            </div>
          </div>
          {msg&&<div style={AUTH.errorBanner}>{msg}</div>}
          {ok&&<div style={{...AUTH.infoBanner,marginBottom:10,fontSize:11}}>{t("msg.passwordChanged")}</div>}
          <button style={AUTH.btnPrimary} onClick={()=>void doChange()} disabled={ok||saving}>
            {saving?"…":t("forceChange.submit")}
          </button>
          {onSignOut&&(
            <div style={{marginTop:16,textAlign:"center"}}>
              <button type="button" style={AUTH.link} onClick={()=>onSignOut()}>{t("nav.signOut")}</button>
            </div>
          )}
        </div>
        <div style={AUTH.muted}>Solana · Vilanova i la Geltrú · est. 2026</div>
      </div>
    </div>
  );
}

/* ── LOGIN ─────────────────────────────────────────────────────────────────── */
function LoginScreen({ users, onLogin, passwords, sessionRestoreAttempted }) {
  const tl = React.useMemo(() => mkT(), []);
  const [screen, setScreen] = useState("login"); // "login" | "signup" | "status"
  const [statusType, setStatusType] = useState(null); // "pending_verification"|"pending_approval"|"denied"
  const [forgotOpen, setForgotOpen] = useState(false);
  const [forgotMsg, setForgotMsg] = useState("");
  const [email, setEmail] = useState("");
  const [pw, setPw] = useState("");
  const [showPw, setShowPw] = useState(false);
  const [loading, setLoading] = useState(false);
  const [err, setErr] = useState("");
  const [slowServerHint, setSlowServerHint] = useState(false);
  const emailF = useInpFocus(), pwF = useInpFocus();

  // Helper to clear stray messages when the user interacts
  const clearMessages = () => {
    setErr("");
    setForgotMsg("");
  };

  /* ── Route to sub-screens ── */
  // signup screen intentionally unreachable — accounts are created by superadmin
  if (screen === "status" && statusType) return (
    <AuthStatusCard
      statusType={statusType}
      tl={tl}
      onBack={() => { setScreen("login"); setStatusType(null); clearMessages(); }}
    />
  );

  /* ── Login ── */
  const doLogin = async () => {
    const cleanEmail = email.trim().toLowerCase();
    let slowHintTimer;

    if (!cleanEmail || !pw) {
      setErr(tl("login.invalidCreds"));
      return;
    }

    setLoading(true);
    setSlowServerHint(false);
    slowHintTimer = setTimeout(() => setSlowServerHint(true), 3000);
    clearMessages();

    // 1. Try Remote Auth (Render backend)
    if (typeof AUTH_URL !== "undefined" && AUTH_URL) {
      let timeoutId;
      try {
        const controller = new AbortController();
        timeoutId = setTimeout(() => controller.abort(), 10000);
        console.log("[LOGIN] AUTH_URL:", AUTH_URL, "email:", cleanEmail);
        const r = await fetch(AUTH_URL + "/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          signal: controller.signal,
          body: JSON.stringify({
            email: cleanEmail,
            password: pw
          })
        });
        clearTimeout(timeoutId);

        const d = await r.json();
        console.log("[LOGIN] server response:", r.status, d);

        if (!r.ok) {
          setLoading(false);
          clearTimeout(slowHintTimer);
          setSlowServerHint(false);
          if (d.code === "PENDING_APPROVAL") {
            setStatusType("pending_approval");
            setScreen("status");
            return;
          }
          if (d.code === "ACCESS_DENIED") {
            setStatusType("denied");
            setScreen("status");
            return;
          }
          setErr(d.error || tl("login.invalidCreds"));
          return;
        }

        const rawTok = d.sessionToken != null && d.sessionToken !== ""
          ? d.sessionToken
          : (d.token != null && d.token !== "" ? d.token : null);
        const tok = rawTok != null ? String(rawTok).trim() : "";
        if (!tok) {
          setLoading(false);
          clearTimeout(slowHintTimer);
          setSlowServerHint(false);
          setErr(tl("login.invalidCreds"));
          return;
        }
        try {
          sessionStorage.setItem("sol-session-token", tok);
        } catch (e) {
          setLoading(false);
          clearTimeout(slowHintTimer);
          setSlowServerHint(false);
          setErr(tl("login.invalidCreds"));
          return;
        }
        API.token = tok;
        sessionRestoreAttempted.current = true;
        try {
          const verifyRes = await fetch(AUTH_URL + "/auth/refresh", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: "Bearer " + tok,
            },
          });
          if (!verifyRes.ok) {
            setLoading(false);
            clearTimeout(slowHintTimer);
            setSlowServerHint(false);
            try { sessionStorage.removeItem("sol-session-token"); } catch (_) {}
            API.token = null;
            setErr("No se pudo validar la sesión. Inténtalo de nuevo.");
            return;
          }
          const verifyData = await verifyRes.json().catch(() => ({}));
          if (verifyData && verifyData.sessionToken) {
            API.token = verifyData.sessionToken;
            try { sessionStorage.setItem("sol-session-token", verifyData.sessionToken); } catch (_) {}
          }
        } catch (_) {
          setLoading(false);
          clearTimeout(slowHintTimer);
          setSlowServerHint(false);
          try { sessionStorage.removeItem("sol-session-token"); } catch (_) {}
          API.token = null;
          setErr("No se pudo validar la sesión. Inténtalo de nuevo.");
          return;
        }
        void fetchAndApplyServerSettings(AUTH_URL, API.token);

        setLoading(false);
        clearTimeout(slowHintTimer);
        setSlowServerHint(false);
        const srv = d.user;
        API._userId = srv?.id || null;
        const loc = users.find(u => (u.email || "").toLowerCase() === (srv.email || "").toLowerCase());
        const mergedUser = loc ? { ...loc, ...srv, id: srv.id != null ? srv.id : loc.id } : srv;
        if (typeof ReactDOM !== "undefined" && ReactDOM.flushSync) {
          ReactDOM.flushSync(() => {
            onLogin(mergedUser);
          });
        } else {
          onLogin(mergedUser);
        }
        if(sessionRestoreAttempted)sessionRestoreAttempted.current=true;
        console.log("[LOGIN] onLogin called with user:", mergedUser?.id, mergedUser?.role);
        return;
      } catch (e) {
        try { clearTimeout(timeoutId); } catch (_) {}
        console.error("[LOGIN] fetch threw:", e);
        appLog("warn", "auth_server_unreachable", { error: e?.message });
        setLoading(false);
        clearTimeout(slowHintTimer);
        setSlowServerHint(false);
        if (e && e.name === "AbortError") {
          setErr("El servidor tardó demasiado. Inténtalo de nuevo.");
        } else {
          setErr("No se puede conectar con el servidor.");
        }
        return;
      }
    }

    setLoading(false);
    clearTimeout(slowHintTimer);
    setSlowServerHint(false);
    setErr(tl("login.invalidCreds"));
    return;
  };

  /* ── Forgot password ── */
  const doForgotPassword = async () => {
    const cleanEmail = email.trim().toLowerCase();
    if (!cleanEmail) {
      setForgotMsg(tl("login.enterEmailFirst"));
      return;
    }

    setLoading(true);
    clearMessages();

    try {
      if (typeof AUTH_URL === "undefined" || !AUTH_URL) {
        setForgotMsg(tl("login.forgotUnavailable"));
        setLoading(false);
        return;
      }

      const r = await fetch(AUTH_URL + "/auth/forgot-password", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: cleanEmail })
      });

      if (!r.ok) {
        const d = await r.json();
        // Try to show specific server error, otherwise generic error
        setForgotMsg(d.error || tl("login.forgotError"));
        setLoading(false);
        return;
      }

      setForgotMsg(tl("login.forgotSuccess"));
    } catch {
      setForgotMsg(tl("login.forgotError"));
    }

    setLoading(false);
  };

  /* ── Login form ── */
  return (
    <div style={AUTH.page}>
      <div style={{ width: "100%", maxWidth: 400 }}>
        {/* Logo + heading */}
        <div style={AUTH.logoWrap}>
          <SolanaLogo theme="dark" size="md" variant="auth" />
          <h1 style={AUTH.title}>{tl("login.title")}</h1>
          <p style={AUTH.subtitle}>{tl("login.loginSubtitle")}</p>
        </div>

        <div style={AUTH.card}>
          {/* Email */}
          <div style={{ marginBottom: 14 }}>
            <label style={AUTH.lbl}>{tl("login.email")}</label>
            <input
              {...emailF}
              type="email"
              placeholder={tl("login.enterEmail")}
              value={email}
              onChange={e => {
                setEmail(e.target.value);
                clearMessages(); // Clear errors when typing
              }}
              onKeyDown={e => e.key === "Enter" && doLogin()}
              autoFocus
              autoComplete="email"
            />
          </div>

          {/* Password */}
          <div style={{ marginBottom: 6 }}>
            <label style={AUTH.lbl}>{tl("login.password")}</label>
            <div style={{ position: "relative" }}>
              <input
                {...pwF}
                style={{ ...pwF.style, paddingRight: 58 }}
                type={showPw ? "text" : "password"}
                placeholder={tl("login.enterPassword")}
                value={pw}
                onChange={e => {
                  setPw(e.target.value);
                  setErr(""); 
                }}
                onKeyDown={e => e.key === "Enter" && doLogin()}
                autoComplete="current-password"
              />
              <button
                type="button"
                className="touch-icon-btn"
                style={PW_TOGGLE_STYLE}
                onClick={() => setShowPw(v => !v)}
              >
                {showPw ? tl("login.hidePw") : tl("login.showPw")}
              </button>
            </div>
          </div>

          {/* Forgot password Toggle */}
          <div style={{ textAlign: "right", marginBottom: 18 }}>
            <button
              type="button"
              className="touch-clear-link"
              onClick={() => { setForgotOpen(v => !v); clearMessages(); }}
              style={{ ...AUTH.link, fontSize: 11, color: "#9a7860" }}
            >
              {tl("login.forgotPassword")}
            </button>
          </div>

          {/* Forgot Password Section */}
          {forgotOpen && (
            <div style={{ ...AUTH.infoBanner, marginBottom: 14, fontSize: 11 }}>
              <div style={{ marginBottom: 8 }}>
                {tl("login.forgotHelp")}
              </div>
              <button
                type="button"
                style={
                  loading
                    ? { ...AUTH.btnPrimary, ...AUTH.btnPrimaryLoading, padding: "9px 12px", fontSize: 12 }
                    : { ...AUTH.btnPrimary, padding: "9px 12px", fontSize: 12 }
                }
                onClick={doForgotPassword}
                disabled={!email.trim() || loading}
              >
                {tl("login.requestPasswordHelp")}
              </button>

              {forgotMsg && (
                <div style={{ marginTop: 8, fontSize: 11, color: "#8a3a00" }}>
                  {forgotMsg}
                </div>
              )}
            </div>
          )}

          {/* Banner de error */}
          {err && <div style={AUTH.errorBanner}>{err}</div>}

          {/* Enviar */}
          <button
            type="button"
            className="auth-btn"
            style={loading ? { ...AUTH.btnPrimary, ...AUTH.btnPrimaryLoading } : AUTH.btnPrimary}
            onMouseEnter={e => {
              if (!loading) Object.assign(e.currentTarget.style, AUTH.btnPrimaryHover);
            }}
            onMouseLeave={e => {
              if (!loading) e.currentTarget.style.background = G;
            }}
            onClick={doLogin}
            disabled={loading}
          >
            {loading ? "Entrando..." : tl("login.signIn")}
          </button>
          {loading && slowServerHint && (
            <div style={{marginTop:6,fontSize:11,color:"#9a7860",textAlign:"center"}}>
              Esto puede tardar unos segundos si el servidor esta iniciando...
            </div>
          )}

          {/* Divider */}
          <div style={AUTH.divider} />

          {/* Admin-managed accounts notice */}
          <div style={{textAlign:"center",padding:"10px 12px",borderRadius:9,background:"#F5F0EA",fontSize:11,color:"#6B7B72",lineHeight:1.5}}>
            {tl("login.adminManaged")}
          </div>
        </div>

        <div style={AUTH.muted}>Solana · Vilanova i la Geltrú · est. 2026</div>
      </div>
    </div>
  );
}
  
  
function SplitAllocationEditor({t,user,users,totalAmount,splitOn,setSplitOn,splits,setSplits,spMode,setSpMode,showSplitError=false,actionColor=G}){
  const expAmt=Number(totalAmount)||0;
  const [manualEditedIds,setManualEditedIds]=useState(()=>new Set());
  const [equalSplitActive,setEqualSplitActive]=useState(false);
  const resetSplitMeta=()=>{setManualEditedIds(new Set());setEqualSplitActive(false);};
  useEffect(()=>{if(spMode==="percentage")setSpMode("amount");},[spMode,setSpMode]);
  const calcEq=(arr,amt)=>{
    const on=arr.filter(s=>s.checked);
    const n=on.length;
    if(!n)return arr.map(s=>({...s,percent:0,value:0}));
    const rows=on.map(s=>{
      const eqAmt=parseFloat(((amt||0)/n).toFixed(2));
      const eqPct=parseFloat((100/n).toFixed(2));
      return{...s,percent:eqPct,value:eqAmt};
    });
    const sum=rows.reduce((a,r)=>a+r.value,0);
    if(rows.length&&amt>0&&Math.abs(sum-amt)>0.01){
      const last={...rows[rows.length-1]};
      last.value=parseFloat((last.value+(amt-sum)).toFixed(2));
      last.percent=Math.round((last.value/amt)*10000)/100;
      rows[rows.length-1]=last;
    }
    const byId=Object.fromEntries(rows.map(r=>[r.userId,r]));
    return arr.map(s=>byId[s.userId]||{...s,percent:0,value:0});
  };
  useEffect(()=>{
    if(!splitOn||splits.length===0)return;
    if(splits.filter(s=>s.checked).length<2)return;
    if(manualEditedIds.size>0)return;
    setSplits(prev=>calcEq(prev,expAmt));
    setEqualSplitActive(true);
  },[expAmt,splitOn]);
  const checkedCount=splits.filter(s=>s.checked).length;
  const checkedSplits=splits.filter(s=>s.checked);
  const totAmt=checkedSplits.reduce((a,s)=>a+(Number(s.value)||0),0);
  const remainder=parseFloat((expAmt-totAmt).toFixed(2));
  const isBalanced=expAmt>0&&Math.abs(remainder)<=0.01;
  const amtMismatch=splitOn&&spMode==="amount"&&expAmt>0&&!isBalanced;
  const autoTargets=checkedSplits.filter(s=>!manualEditedIds.has(s.userId));
  const canAutoFill=!equalSplitActive&&remainder>0.01&&autoTargets.length>0;
  const showAutoFillHint=!equalSplitActive&&amtMismatch&&!canAutoFill;
  const distributeRemainder=()=>{
    if(!canAutoFill)return;
    const targets=checkedSplits.filter(s=>!manualEditedIds.has(s.userId));
    let assigned=0;
    const per=parseFloat((remainder/targets.length).toFixed(2));
    setSplits(splits.map(s=>{
      if(!s.checked||manualEditedIds.has(s.userId))return s;
      const idx=targets.findIndex(tg=>tg.userId===s.userId);
      if(idx===-1)return s;
      const add=idx===targets.length-1?parseFloat((remainder-assigned).toFixed(2)):per;
      assigned+=add;
      return{...s,value:parseFloat(((Number(s.value)||0)+add).toFixed(2))};
    }));
  };
  const toggleSplit=()=>{
    if(users.length<2)return;
    if(splitOn){setSplitOn(false);setSplits([]);setSpMode("amount");resetSplitMeta();return;}
    setSpMode("amount");
    setSplits(users.map(u=>({userId:u.id,checked:false,percent:0,value:0})));
    setSplitOn(true);
    resetSplitMeta();
  };
  const toggleUser=uid=>{
    const next=splits.map(s=>s.userId===uid?{...s,checked:!s.checked}:s);
    const nOn=next.filter(s=>s.checked).length;
    if(nOn>=2){
      if(manualEditedIds.size>0)setSplits(next);
      else{setSplits(calcEq(next,expAmt));setEqualSplitActive(true);}
    }else{
      setSplits(next.map(s=>({...s,percent:0,value:0})));
      resetSplitMeta();
    }
  };
  return(
    <div style={{background:"#F5F0EA",borderRadius:9,padding:12,marginTop:4,marginBottom:14,opacity:users.length<2?0.92:1}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:splitOn?10:0}}>

function recurrenceRuleToCadenceForForm(rule){
  const r=String(rule||"").toLowerCase();
  if(r==="monthly")return{cadenceKey:"monthly",cadenceCustomMonths:"1",cadenceCustomAmount:"1",cadenceCustomUnit:"months"};
  if(r==="quarterly")return{cadenceKey:"custom",cadenceCustomMonths:"3",cadenceCustomAmount:"3",cadenceCustomUnit:"months"};
  if(r==="yearly")return{cadenceKey:"yearly",cadenceCustomMonths:"12",cadenceCustomAmount:"1",cadenceCustomUnit:"months"};
  if(r.startsWith("custom:")){
    const tail=r.slice(7);
    const match=tail.match(/^(\d+)(days|weeks|months|years)$/);
    if(match)return{cadenceKey:"custom",cadenceCustomMonths:match[1],cadenceCustomAmount:match[1],cadenceCustomUnit:match[2]};
    return{cadenceKey:"custom",cadenceCustomMonths:String(normalizeCadenceCustomMonths(tail)),cadenceCustomAmount:String(normalizeCadenceCustomMonths(tail)),cadenceCustomUnit:"months"};
  }
  if(r==="weekly")return{cadenceKey:"weekly",cadenceCustomMonths:"1",cadenceCustomAmount:"1",cadenceCustomUnit:"weeks"};
  if(r==="biweekly")return{cadenceKey:"custom",cadenceCustomMonths:"1",cadenceCustomAmount:"2",cadenceCustomUnit:"weeks"};
  if(r==="daily")return{cadenceKey:"custom",cadenceCustomMonths:"1",cadenceCustomAmount:"1",cadenceCustomUnit:"days"};
  return{cadenceKey:"once",cadenceCustomMonths:"1",cadenceCustomAmount:"1",cadenceCustomUnit:"months"};
}

}
