  },[isAdmin,t]);
  useEffect(()=>{if(isAdmin&&AUTH_URL)void loadBackups();},[isAdmin,AUTH_URL,loadBackups]);
  const runBackupNow=async()=>{
    setBackupsError("");setBackupsMsg("");
    try{
      API.ensureSessionToken();
      if(!API.token){setBackupsError(t("msg.sessionExpired"));return;}
      const d=await API.post("/admin/backups/run",{});

      await loadBackups();
    }catch(e){setBackupsError(e.message||t("signup.serverDown"));}
  };
  const openBackupDownload=async filename=>{
    if(!filename)return;
    setBackupsError("");
    try{
      API.ensureSessionToken();
      const blob=await API.fetchBinary("/admin/backups/download/"+encodeURIComponent(filename));
      const a=Object.assign(document.createElement("a"),{
        href:URL.createObjectURL(blob),
        download:filename,
      });
      a.click();
      setTimeout(()=>URL.revokeObjectURL(a.href),5000);
    }catch(e){setBackupsError(e.message||t("signup.serverDown"));}
  };
  const saveAppIvaSettings=async(nextRates,nextDefault)=>{
    setAppSetErr("");setAppSetMsg("");
    setAppSaving("iva");
    const normalized=normalizeIvaRatesPayload(nextRates);
    let defVal;
    if(nextDefault===null)defVal=null;
    else{
      const n=Number(nextDefault);
      defVal=normalized.some(r=>Number(r.value)===n)?n:Number(normalized[0]?.value||21);
    }
    try{
      if(AUTH_URL){
        const tok=appSettingsToken()||(API.token?String(API.token):"");

          const r1=await fetch(AUTH_URL+"/settings/iva_rates",{method:"PUT",headers:{"Content-Type":"application/json","Authorization":"Bearer "+tok},body:JSON.stringify({value:normalized})});

          if(!r1.ok){const errMsg=d1.error||t("msg.genericShort");setAppSetErr(errMsg);toastSaveFailed(errMsg);return;}
          const r2=await fetch(AUTH_URL+"/settings/iva_default",{method:"PUT",headers:{"Content-Type":"application/json","Authorization":"Bearer "+tok},body:JSON.stringify({value:defVal})});
          const d2=await r2.json().catch(()=>({}));
          if(!r2.ok){const errMsg=d2.error||t("msg.genericShort");setAppSetErr(errMsg);toastSaveFailed(errMsg);return;}
        }catch(e){setAppSetErr(t("signup.serverDown"));toastSaveFailed(t("signup.serverDown"));return;}
      }
      saveIvaRates(normalized);
      try{localStorage.setItem(IVA_DEFAULT_KEY,JSON.stringify(defVal));}catch(e){}
      setAppIvaDefaultDraft(defVal);
      setAppSetMsg("Ajustes de IVA guardados.");
      toastSaved("Ajustes de IVA");
    }finally{setAppSaving(null);}
  };
  const saveAppCategories=async()=>{
    setAppSetErr("");setAppSetMsg("");
    setAppSaving("cats");
    try{
      if(AUTH_URL){
        const tok=appSettingsToken()||(API.token?String(API.token):"");
        if(!tok){setAppSetErr(t("msg.sessionExpired"));toastSaveFailed(t("msg.sessionExpired"));return;}
        try{
          const r=await fetch(AUTH_URL+"/settings/categories",{method:"PUT",headers:{"Content-Type":"application/json","Authorization":"Bearer "+tok},body:JSON.stringify({value:appCatsDraft})});
          const d=await r.json().catch(()=>({}));
          if(!r.ok){const errMsg=d.error||t("msg.genericShort");setAppSetErr(errMsg);toastSaveFailed(errMsg);return;}
        }catch(e){setAppSetErr(t("signup.serverDown"));toastSaveFailed(t("signup.serverDown"));return;}
      }
      saveCats(appCatsDraft);
      setAppSetMsg("Categorías guardadas.");
      toastSaved("Categorías");
    }finally{setAppSaving(null);}
  };
  const updateCategory = (catId, changes) => {
    setAppCatsDraft(prev =>
      prev.map(c => (c.id === catId ? { ...c, ...changes } : c))
    );
  };
  const [catDragId,setCatDragId]=useState(null);
  const [catDropIdx,setCatDropIdx]=useState(null);
  const catMotionOk=typeof window!=="undefined"&&!window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const reorderCatsDraft=(fromIdx,toIdx)=>{
    if(fromIdx===toIdx||fromIdx<0||toIdx<0)return;
    setAppCatsDraft(prev=>{
      const next=[...prev];
      const [item]=next.splice(fromIdx,1);
      next.splice(toIdx,0,item);
      return next;
    });
  };
  const moveCategoryById=(catId,delta)=>{
    setAppCatsDraft(prev=>{
      const idx=prev.findIndex(c=>c.id===catId);
      if(idx<0)return prev;
      const to=idx+delta;
      if(to<0||to>=prev.length)return prev;
      const next=[...prev];
      const [item]=next.splice(idx,1);
      next.splice(to,0,item);
      return next;
    });
  };
  const toggleDeptApprover = (deptId, userId) => {
    setAppDeptApproversDraft(prev => {
      const current = Array.isArray(prev[deptId]) ? prev[deptId] : [];
      if (current.includes(userId) && current.length <= 1) {
        return prev;
      }
      const next = current.includes(userId)
        ? current.filter(id => id !== userId)
        : [...current, userId];
      return { ...prev, [deptId]: next };
    });
  };
  const saveAppDeptApprovers = async () => {
    setAppSetErr(""); setAppSetMsg("");
    setAppSaving("approvers");
    try {
      const activeDepts = (departments || []).filter(d => !d.archived);
      for (const d of activeDepts) {
        const ids = appDeptApproversDraft[d.id] || [];
        if (ids.length === 0) {
          setAppSetErr(`«${d.name}» debe tener al menos un aprobador.`);
          toastSaveFailed(`«${d.name}» debe tener al menos un aprobador.`);
          return;
        }
      }
      if (AUTH_URL) {
        const tok = appSettingsToken() || (API.token ? String(API.token) : "");
        if (!tok) { setAppSetErr(t("msg.sessionExpired")); toastSaveFailed(t("msg.sessionExpired")); return; }
        try {
          for (const d of activeDepts) {
            const r = await fetch(AUTH_URL + "/departments/" + encodeURIComponent(d.id), {
              method: "PUT",
              headers: { "Content-Type": "application/json", Authorization: "Bearer " + tok },
              body: JSON.stringify({ approverIds: appDeptApproversDraft[d.id] || [] }),
            });
            const payload = await r.json().catch(() => ({}));
            if (!r.ok) {
              const errMsg = payload.error || t("msg.genericShort");
              setAppSetErr(errMsg);
              toastSaveFailed(errMsg);
              return;
            }
          }
        } catch (e) { setAppSetErr(t("signup.serverDown")); toastSaveFailed(t("signup.serverDown")); return; }
      }
      saveDeptApprovers(appDeptApproversDraft);
      setAppSetMsg("Aprobadores por departamento guardados.");
      toastSaved("Aprobadores");
      await refreshDepartments();
    } finally { setAppSaving(null); }
  };
  const approverCandidates = users.filter(u =>
    u.accountStatus === 'active' && u.id !== 'system'
  );
  const saveIvaDefault=v=>{
    const n=Number(v);
    if(Number.isNaN(n))return;
    try{localStorage.setItem(IVA_DEFAULT_KEY,JSON.stringify(n));}catch(e){}
    setIvaDefault(n);
  };
  const saveProfile=async()=>{
    if(profileSaving)return;
    const payload={name:(sf.name||"").trim(),email:(sf.email||"").trim()};
    if(!payload.name){dispatchSolanaToast(t("msg.genericShort"),"error");return;}
    if(AUTH_URL){
      setProfileSaving(true);
      try{
        const token=(()=>{try{return sessionStorage.getItem("sol-session-token")||"";}catch(e){return "";}})()||(API.token?String(API.token):"");
        if(!token){dispatchSolanaToast(t("msg.sessionExpired"),"error");return;}
        const r=await fetch(AUTH_URL+"/auth/update-profile",{
          method:"PUT",
          headers:{"Content-Type":"application/json","Authorization":"Bearer "+token},
          body:JSON.stringify(payload),
        });
        const d=await r.json().catch(()=>({}));
        if(!r.ok){dispatchSolanaToast(d.error||t("msg.genericShort"),"error");return;}
        const merged=normalizeItem({...user,...d.user},"user");
        setUser(merged);
        saveUsers(users.map(u=>u.id===user.id?merged:u));
        setSf({name:merged.name||"",email:merged.email||""});
        dispatchSolanaToast(t("msg.profileUpdated"),"success",5000);
      }catch(e){
        dispatchSolanaToast(t("signup.serverDown"),"error");
      }finally{
        setProfileSaving(false);
      }
      return;
    }
    const merged=normalizeItem({...user,...sf},"user");
    saveUsers(users.map(u=>u.id===user.id?merged:u));
    setUser(merged);
    dispatchSolanaToast(t("msg.profileUpdated"),"success",5000);
  };

  const savePw=async()=>{
    setPwMsg("");setPwOk(false);
    const existing=passwords?.[user.id];
    if(pwForm.nw.length<8){setPwMsg(t("msg.minPassword"));toastSaveFailed(t("msg.minPassword"));return;}
    if(COMMON_PASSWORDS.has(pwForm.nw.toLowerCase())){setPwMsg(t("msg.pwCommon"));toastSaveFailed(t("msg.pwCommon"));return;}
    if(pwForm.nw!==pwForm.cn){setPwMsg(t("msg.passwordMismatch"));toastSaveFailed(t("msg.passwordMismatch"));return;}

    if(AUTH_URL){
      setPwSaving(true);
      try{
        const token=(()=>{try{return sessionStorage.getItem("sol-session-token")||"";}catch(e){return "";}})()||(API.token?String(API.token):"");
        if(!token){setPwMsg(t("msg.sessionExpired"));toastSaveFailed(t("msg.sessionExpired"));return;}
        if(!String(pwForm.cur||"").trim()){setPwMsg(t("msg.currentPasswordRequired"));toastSaveFailed(t("msg.currentPasswordRequired"));return;}
        const r=await fetch(AUTH_URL+"/auth/change-password",{
          method:"POST",
          headers:{"Content-Type":"application/json","Authorization":"Bearer "+token},
          body:JSON.stringify({userId:user.id,newPassword:pwForm.nw,currentPassword:pwForm.cur}),
        });
        const d=await r.json().catch(()=>({}));
        if(!r.ok||!d.ok){const errMsg=d.error||t("msg.genericShort");setPwMsg(errMsg);toastSaveFailed(errMsg);return;}
      }catch{
        setPwMsg(t("signup.serverDown"));
        toastSaveFailed(t("signup.serverDown"));
        return;
      }finally{
        setPwSaving(false);
      }
    }else{
      if(existing&&pwForm.cur!==existing){
        setPwMsg(t("msg.passwordWrong"));
        toastSaveFailed(t("msg.passwordWrong"));
        return;
      }
      if(existing&&pwForm.nw===existing){
        setPwMsg("La nueva contraseña no puede ser igual a la anterior.");
        toastSaveFailed("La nueva contraseña no puede ser igual a la anterior.");
        return;
      }
    }

    savePasswords({...passwords,[user.id]:pwForm.nw});
    appLog("info","password_changed",{userId:user.id});
    setPwForm({cur:"",nw:"",cn:""});setPwMsg(t("msg.passwordChanged"));setPwOk(true);
    dispatchSolanaToast(t("msg.passwordChanged"),"success");
  };

  return(
    <div style={{maxWidth:540}}>
      <h1 style={{fontFamily:"'Playfair Display',serif",fontSize:24,color:G,marginBottom:12}}>{t("nav.settings")}</h1>

      {/* ── Profile (all users) ── */}
      <AccordionSection title={t("settings.accordion.profile")}>
        <div style={{display:"grid",gap:8}}>
          <div><label className="lbl">{t("label.name")}</label><input className="inp" value={sf.name} onChange={e=>setSf(p=>({...p,name:e.target.value}))}/></div>
          <div><label className="lbl">{t("label.email")}</label><input className="inp" type="email" value={sf.email} onChange={e=>setSf(p=>({...p,email:e.target.value}))}/></div>
          <div style={{marginTop:2}}>
            <label className="lbl">Rol</label>
            <div style={{fontSize:14,fontWeight:600,color:G}}>{user?.role==="admin"?t("role.admin"):t("role.user")}</div>
          </div>
        </div>
        <button type="button" className="btn-primary" style={{marginTop:9,fontSize:12,padding:"6px 12px"}} disabled={profileSaving||!profileDirty} onClick={()=>void saveProfile()}>{profileSaving?"…":t("action.saveChanges")}</button>
        <div style={{marginTop:12,paddingTop:10,borderTop:"1px solid #EDE8E0"}}>
          <div style={{fontWeight:600,fontSize:12,color:"#991B1B",marginBottom:4}}>{t("settings.deleteAccount")}</div>
          {!dSelf?<button className="btn-danger" style={{fontSize:11,padding:"4px 10px"}} onClick={()=>setDSelf(true)}>{t("settings.requestDeletion")}</button>:(
            <div style={{background:"#FEE2E2",borderRadius:7,padding:"8px 10px"}}><div style={{fontSize:11,color:"#7F1D1D",marginBottom:6}}>{t("msg.removeAccount")}</div><div style={{display:"flex",gap:6}}><button className="btn-danger" style={{flex:1,fontSize:11,padding:"4px 8px"}} onClick={()=>{saveUsers(users.filter(u=>u.id!==user.id));onSignOut();}}>{t("action.confirm")}</button><button className="btn-secondary" style={{flex:1,fontSize:11,padding:"4px 8px"}} onClick={()=>setDSelf(false)}>{t("action.cancel")}</button></div></div>
          )}
        </div>
      </AccordionSection>

      {/* ── Password ── */}
      <AccordionSection title="Cambiar contraseña">
        <p style={{fontSize:11,color:"#6B7B72",marginBottom:9}}>{t("settings.passwordDesc")}</p>
        {!AUTH_URL&&!passwords?.[user.id]&&<div style={{background:"#FEF3C7",borderRadius:6,padding:"6px 9px",fontSize:10,color:"#92400E",marginBottom:8}}>{t("msg.passwordNoExisting")}</div>}
        <div style={{display:"grid",gap:7}}>
          {(AUTH_URL||passwords?.[user.id])&&(
            <div>
              <label className="lbl">{t("label.currentPassword")}</label>
              <div style={{position:"relative"}}>
                <input className="inp" style={{paddingRight:52}} type={showPwCur?"text":"password"} value={pwForm.cur} onChange={e=>setPwForm(p=>({...p,cur:e.target.value}))} autoComplete="current-password"/>
                <button type="button" className="touch-icon-btn" style={SETTINGS_PW_TOGGLE_STYLE} onClick={()=>setShowPwCur(v=>!v)}>{showPwCur?t("login.hidePw")||"Ocultar":t("login.showPw")||"Ver"}</button>
              </div>
            </div>
          )}
          <div>
            <label className="lbl">{t("label.newPassword")}</label>
            <div style={{position:"relative"}}>
              <input className="inp" style={{paddingRight:52}} type={showPwNw?"text":"password"} value={pwForm.nw} onChange={e=>setPwForm(p=>({...p,nw:e.target.value}))} autoComplete="new-password"/>
              <button type="button" className="touch-icon-btn" style={SETTINGS_PW_TOGGLE_STYLE} onClick={()=>setShowPwNw(v=>!v)}>{showPwNw?t("login.hidePw")||"Ocultar":t("login.showPw")||"Ver"}</button>
            </div>
          </div>
          <div>
            <label className="lbl">{t("label.confirmPassword")}</label>
            <div style={{position:"relative"}}>
              <input className="inp" style={{paddingRight:52}} type={showPwCn?"text":"password"} value={pwForm.cn} onChange={e=>setPwForm(p=>({...p,cn:e.target.value}))} autoComplete="new-password"/>
              <button type="button" className="touch-icon-btn" style={SETTINGS_PW_TOGGLE_STYLE} onClick={()=>setShowPwCn(v=>!v)}>{showPwCn?t("login.hidePw")||"Ocultar":t("login.showPw")||"Ver"}</button>
            </div>
          </div>
        </div>
        {pwMsg&&<div style={{marginTop:7,fontSize:11,padding:"5px 8px",borderRadius:6,background:pwOk?"#D1FAE5":"#FEE2E2",color:pwOk?"#065F46":"#7F1D1D"}}>{pwMsg}</div>}
        <button type="button" className="btn-primary" style={{marginTop:9,fontSize:12,padding:"6px 12px"}} disabled={pwSaving} onClick={()=>void savePw()}>{pwSaving?"…":(passwords?.[user.id]?t("action.changePassword"):t("action.setPassword"))}</button>
      </AccordionSection>

      {isAdmin&&(
      <>
      {/* ── Team members ── */}
      <AccordionSection title={t("settings.accordion.team")}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
            <button className="btn-sm" style={{fontSize:10}} onClick={()=>{setAddU(v=>!v);setEditId(null);}}>{t("action.addUser")}</button>
          </div>
          {addU&&(
            <div style={{background:"#F5F0EA",borderRadius:9,padding:12,marginBottom:10}}>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:7}}>
                <div style={{gridColumn:"1/-1"}}><label className="lbl">{t("label.name")}</label><input className="inp" style={{fontSize:14}} value={nu.name} onChange={e=>setNu(p=>({...p,name:e.target.value}))} placeholder="Name"/></div>
                <div style={{gridColumn:"1/-1"}}><label className="lbl">{t("label.role")}</label><select className="inp" style={{fontSize:14}} value={nu.role} onChange={e=>setNu(p=>({...p,role:e.target.value}))}><option value="user">{t("role.user")}</option><option value="admin">{t("role.admin")}</option></select></div>
                <div style={{gridColumn:"1/-1"}}><label className="lbl">{t("label.email")}</label><input className="inp" style={{fontSize:14}} type="email" value={nu.email} onChange={e=>setNu(p=>({...p,email:e.target.value}))} placeholder="email@example.com"/></div>
                <div style={{gridColumn:"1/-1",marginTop:4}}>
                  <label className="lbl">{t("label.tempPassword")}</label>
                  <div style={{position:"relative"}}>
                    <input className="inp" style={{fontSize:14,paddingRight:52}} type={nu.showTempPw?"text":"password"} value={nu.tempPw||""} onChange={e=>setNu(p=>({...p,tempPw:e.target.value}))} placeholder="mín. 8 caracteres"/>
                    <button type="button" style={{position:"absolute",right:8,top:"50%",transform:"translateY(-50%)",background:"none",border:"none",color:"#9CAA9F",fontSize:11,cursor:"pointer",fontFamily:"inherit",fontWeight:600,padding:"2px 4px"}} onClick={()=>setNu(p=>({...p,showTempPw:!p.showTempPw}))}>
                      {nu.showTempPw?t("login.hidePw")||"Ocultar":t("login.showPw")||"Ver"}
                    </button>
                  </div>
                  <div style={{fontSize:9,color:"#9CAA9F",marginTop:3}}>{t("label.tempPasswordHint")}</div>
                </div>

              </div>
              {nuErr&&<div style={{padding:"6px 9px",borderRadius:6,background:"#FEE2E2",color:"#991B1B",fontSize:11,marginTop:6}}>{nuErr}</div>}
              <div style={{display:"flex",gap:7,marginTop:8}}>
                <button className="btn-primary" style={{flex:1,fontSize:12,padding:"6px 10px"}} onClick={async()=>{
                  if(!nu.name)return;
                  setNuErr("");
                  if(!nu.name){setNuErr("El nombre es obligatorio.");return;}
                  if(!nu.email){setNuErr("El correo es obligatorio.");return;}
                  if(!String(nu.email).includes("@")){setNuErr("Correo no válido.");return;}
                  if(!nu.tempPw||nu.tempPw.length<8){setNuErr(t("msg.tempPwRequired"));return;}
                  const newId=nu.name.toLowerCase().replace(/\s+/g,"-")+"-"+Date.now();
                  if(AUTH_URL){
                    // Use session token (set at login) — no admin key needed in UI
                    const sessionToken=(()=>{try{return sessionStorage.getItem("sol-session-token")||"";}catch(e){return "";}})();
                    if(!sessionToken){setNuErr("Tu sesión ha expirado. Cierra sesión y vuelve a entrar para crear usuarios.");return;}
                    try{
                      const r=await fetch(AUTH_URL+"/admin/users/create",{
                        method:"POST",
                        headers:{"Content-Type":"application/json","Authorization":"Bearer "+sessionToken},
                        body:JSON.stringify({name:nu.name,email:nu.email,tempPassword:nu.tempPw,role:nu.role,color:nu.color})
                      });
                      const d=await r.json();
                      if(!r.ok){setNuErr(d.error||"Error al crear usuario en el servidor.");return;}
                      saveUsers([...users,{...d.user}]);
                    }catch{
                      // Server unreachable — local-only fallback
                      const newUser={id:newId,...nu,mustChangePassword:true};
                      delete newUser.showTempPw;delete newUser.tempPw;delete newUser.adminKey;
                      saveUsers([...users,newUser]);
                      savePasswords({...passwords,[newId]:nu.tempPw});
                    }
                  } else {
                    const newUser={id:newId,...nu,mustChangePassword:true};
                    delete newUser.showTempPw;delete newUser.tempPw;delete newUser.adminKey;
                    saveUsers([...users,newUser]);
                    savePasswords({...passwords,[newId]:nu.tempPw});
                  }
                  setNu({name:"",email:"",role:"user",color:"#6B7280",tempPw:"",showTempPw:false,adminKey:""});
                  setNuErr("");
                  setAddU(false);
                }}>{t("action.add")}</button>
                <button className="btn-secondary" style={{flex:1,fontSize:12,padding:"6px 10px"}} onClick={()=>setAddU(false)}>{t("action.cancel")}</button>
              </div>
            </div>

          {users.filter(u=>u.accountStatus!=="deleted").map(u=>(
            <div key={u.id}>
              <div style={{display:"flex",alignItems:"center",gap:8,padding:"8px 0",borderBottom:"1px solid #F5F0EA"}}>
                <div style={{flex:1,minWidth:0}}><div style={{fontSize:12,fontWeight:600}}>{u.name}</div><div style={{fontSize:10,color:"#9CAA9F",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{u.email||"N/A"} · {u.role==="admin"?t("role.admin"):t("role.user")}</div></div>
                <div style={{display:"flex",gap:3,flexShrink:0,flexWrap:"wrap"}}>
                  <button style={{fontSize:9,padding:"2px 6px",borderRadius:4,border:"1px solid #DDD6CC",background:"transparent",color:"#4B5E52",cursor:"pointer"}} onClick={()=>{setEditId(u.id);setEf({name:u.name,email:u.email||"",role:u.role,color:u.color});}}>{t("action.edit")}</button>
                  {AUTH_URL&&u.id!==user.id&&<button type="button" style={{fontSize:9,padding:"2px 6px",borderRadius:4,border:"1px solid #C4B5FD",background:"transparent",color:F,cursor:"pointer"}} onClick={()=>{setResetFor(resetFor===u.id?null:u.id);setResetPwInput("");}}>{t("team.resetPassword")}</button>}
                  {AUTH_URL&&u.id!==user.id&&(
                    u.accountStatus==="active"
                      ? <button style={{fontSize:9,padding:"2px 6px",borderRadius:4,border:"1px solid #FCA5A5",background:"transparent",color:"#DC2626",cursor:"pointer"}}
                          onClick={async()=>{
                            if(!(await confirmUI(`¿Revocar acceso a ${u.name}? Podras restaurarlo despues.`)))return;
                            const tok=(()=>{try{return sessionStorage.getItem("sol-session-token")||"";}catch(e){return "";}})();
                            const r=await fetch(AUTH_URL+"/admin/users/"+encodeURIComponent(u.id)+"/suspend",{method:"POST",headers:{Authorization:"Bearer "+tok}});
                            if(r.ok){
                              saveUsers(users.map(x=>x.id===u.id?{...x,accountStatus:"denied"}:x));
                            }else{
                              const d=await r.json().catch(()=>({}));
                              dispatchSolanaToast(d.error||"Error.","error");
                            }
                          }}>Revocar</button>
                      : <button style={{fontSize:9,padding:"2px 6px",borderRadius:4,border:"1px solid #86EFAC",background:"transparent",color:"#15803D",cursor:"pointer"}}
                          onClick={async()=>{
                            if(!(await confirmUI(`¿Restaurar acceso a ${u.name}?`)))return;
                            const tok=(()=>{try{return sessionStorage.getItem("sol-session-token")||"";}catch(e){return "";}})();
                            const r=await fetch(AUTH_URL+"/admin/users/"+encodeURIComponent(u.id)+"/restore",{method:"POST",headers:{Authorization:"Bearer "+tok}});
                            if(r.ok){
                              saveUsers(users.map(x=>x.id===u.id?{...x,accountStatus:"active",approvalStatus:"approved"}:x));
                            }else{
                              const d=await r.json().catch(()=>({}));
                              dispatchSolanaToast(d.error||"Error.","error");
                            }
                          }}>Restaurar</button>
                  )}
                  {u.id!==user.id&&<button style={{fontSize:9,padding:"2px 6px",borderRadius:4,border:"1px solid #ECA3A3",background:"transparent",color:"#991B1B",cursor:"pointer"}} onClick={()=>setDelC(u.id)}>{t("action.delete")}</button>}
                </div>
              </div>
              {delC===u.id&&<div style={{background:"#FEE2E2",borderRadius:7,padding:"8px 10px",margin:"4px 0"}}><div style={{fontSize:11,color:"#7F1D1D",marginBottom:6}}>{t("msg.deleteUser")} {u.name}?</div><div style={{display:"flex",gap:6}}><button className="btn-danger" style={{flex:1,fontSize:11,padding:"4px 8px"}} onClick={()=>void (async()=>{
                if(AUTH_URL){
                  const tok=(()=>{try{return sessionStorage.getItem("sol-session-token")||"";}catch(e){return "";}})()||(API.token?String(API.token):"");
                  if(!tok){dispatchSolanaToast(t("msg.sessionExpired"),"error");return;}

                    const r=await fetch(AUTH_URL+"/admin/users/"+encodeURIComponent(u.id),{method:"DELETE",headers:{Authorization:"Bearer "+tok}});
                    const d=await r.json().catch(()=>({}));
                    if(!r.ok){dispatchSolanaToast(d.error||t("msg.genericShort"),"error");return;}
                    if(d.user){
                      saveUsers(users.map(x=>x.id===u.id?normalizeItem(d.user,"user"):{...x,accountStatus:"deleted"}));
                    }else{
                      saveUsers(users.map(x=>x.id===u.id?{...x,accountStatus:"deleted"}:x));
                    }
                    dispatchSolanaToast(d.softDeleted?`${u.name} desactivado. Sus gastos se conservan.`:"Usuario eliminado.","success");
                  }catch(e){dispatchSolanaToast(t("signup.serverDown"),"error");return;}
                }
                saveUsers(users.filter(x=>x.id!==u.id));
                dispatchSolanaToast("Usuario eliminado.","success");
                setDelC(null);
              })()}>{t("action.confirm")}</button><button className="btn-secondary" style={{flex:1,fontSize:11,padding:"4px 8px"}} onClick={()=>setDelC(null)}>{t("action.cancel")}</button></div></div>}
              {resetFor===u.id&&AUTH_URL&&(
                <div style={{background:"#F5F3FF",borderRadius:7,padding:"10px 12px",margin:"4px 0",border:"1px solid #DDD6EE"}}>
                  <div style={{fontSize:10,color:"#6B7B72",marginBottom:8,lineHeight:1.4}}>{t("team.resetPasswordHint")}</div>

                  <div style={{display:"flex",gap:7,marginTop:7}}><button type="button" className="btn-primary" style={{flex:1,fontSize:11,padding:"5px 8px"}} disabled={userEditSaving} onClick={()=>void (async()=>{

                      if(!tok){dispatchSolanaToast(t("msg.sessionExpired"),"error");return;}

        {backupsError&&<div style={{padding:"6px 9px",borderRadius:6,background:"#FEE2E2",color:"#991B1B",fontSize:11,marginBottom:8}}>{backupsError}</div>}
        <div style={{padding:"8px 10px",borderRadius:8,background:"#FFFBEB",border:"1px solid #FDE68A",fontSize:11,color:"#92400E",lineHeight:1.45,marginBottom:10}}>

          <div style={{fontSize:11,color:"#6B7B72"}}>{backupsLoading?"Cargando copias...":"Copias disponibles: "+backups.length}</div>
          <button type="button" className="btn-primary" style={{fontSize:11,padding:"5px 10px"}} onClick={()=>void runBackupNow()}>Crear copia ahora</button>
        </div>
        <div style={{display:"flex",flexDirection:"column",gap:6}}>
          {backups.map((b,i)=>{

      {/* ── Danger zone (superadmin only) ── */}
      <AccordionSection title={t("settings.accordion.danger")} accent={"#991B1B"}>

          <div style={{fontWeight:600,fontSize:12,color:"#991B1B",marginBottom:4}}>{t("settings.deleteAccount")}</div>

          )}
        </div>

      </>
      )}
      <div style={{marginTop:12,padding:"8px 12px",background:"#F5F0EA",borderRadius:8,fontSize:10,color:"#9CAA9F",display:"flex",justifyContent:"flex-end",alignItems:"center",gap:10,flexWrap:"wrap"}}>
        <span>Data schema v{DATA_VERSION} · {new Date().getFullYear()}</span>

    </div>
  );
}

/* ══════════════════════════════════════════════════════════════════════════════
   MAIN APP COMPONENT
══════════════════════════════════════════════════════════════════════════════ */
function SolanaExpenses(){
  /* ── STATE ──────────────────────────────────────────────────────────────── */
  /* With AUTH_URL, roster is replaced from GET /auth/team after login; seed DEF_USERS is only the initial placeholder until that fetch runs. */
  const [users,   setUsers]   =useState(()=>{
    migrateItemCodes();
    migrateDataModel();
    const d=ls("sol-users",DEF_USERS);
    const n=d.map(u=>normalizeItem(u,"user"));
    appLog("info","auth:init",{userIds:n.map(u=>u.id),count:n.length});
    return n;
  });
  const [user,    setUser]    =useState(null);
  const [expenses,setExpenses]=useState(()=>{
    if(AUTH_URL)return[];
    let d=ls("sol-exp",[]);
    return d.map(e=>normalizeItem(e,"expense"));
  });
  const [ledgerLoading,setLedgerLoading]=useState(false);
  const [cats,    setCats]    =useState(()=>{
    const d=ls("sol-cats",DEF_CATS);
    return d.map(c=>normalizeItem(c,"cat"));
  });
  const [deptApprovers,setDeptApproversState]=useState(()=>readDeptApproversFromLs());
  useEffect(()=>{setDeptApproversMap(deptApprovers);},[deptApprovers]);
  const saveDeptApprovers=useCallback((map)=>{
    const normalized=map&&typeof map==="object"&&!Array.isArray(map)?map:{};
    setDeptApproversState(normalized);
    setDeptApproversMap(normalized);
    try{localStorage.setItem(DEPT_APPROVERS_LS_KEY,JSON.stringify(normalized));}catch(e){}
  },[]);
  const [passwords,setPasswords]=useState(()=>ls("sol-pwd",{}));
  const sessionRestoreAttempted = useRef(false);
  // appReady: small deliberate delay so the root div never flashes empty
  const [appReady,setAppReady]=useState(false);
  useEffect(()=>{
    appLog("info","auth:boot",{ts:new Date().toISOString()});
    setAppReady(true);
  },[]);
  // currency is hardcoded EUR
  useEffect(()=>{
    if(!AUTH_URL)return;
    if(sessionRestoreAttempted.current)return;
    const stored=(()=>{try{return sessionStorage.getItem("sol-session-token")||"";}catch{return "";}})();
    if(!stored){sessionRestoreAttempted.current=true;return;}
    sessionRestoreAttempted.current=true;
    API.token=stored;
    void (async()=>{
      try{
        // Verify the token is still valid via /auth/refresh
        const refreshRes=await fetch(AUTH_URL+"/auth/refresh",{
          method:"POST",
          headers:{"Content-Type":"application/json","Authorization":"Bearer "+stored}
        });
        // Only clear token on explicit auth rejection, not server errors
        if(!refreshRes.ok){
          if(refreshRes.status===401||refreshRes.status===403){
            API.token=null;
            try{sessionStorage.removeItem("sol-session-token");}catch(e){}
          }
          return;
        }
        const refreshData=await refreshRes.json();
        if(refreshData.sessionToken){
          API.token=refreshData.sessionToken;
          try{sessionStorage.setItem("sol-session-token",refreshData.sessionToken);}catch(e){}
        }
        const loggedInUserId=refreshData.userId;
        if(!loggedInUserId)return;

        // Load the team roster
        const teamRes=await fetch(AUTH_URL+"/auth/team",{
          headers:{"Authorization":"Bearer "+API.token}
        });
        if(!teamRes.ok)return;
        const teamData=await teamRes.json();
        if(!teamData.users||!Array.isArray(teamData.users))return;
        const meRaw=teamData.users.find(u=>u.id===loggedInUserId);
        if(!meRaw)return;
        const me=normalizeItem(meRaw,"user");
        setUsers(teamData.users.map(u=>normalizeItem(u,"user")));
        try{localStorage.setItem(LAST_ACTIVITY_KEY,String(Date.now()));}catch(e){}
        setIdleTrackingEnabled(true);
        setUser(me);
        appLog("info","auth:session_restored",{userId:me.id});

        // Load data for the restored session
        try{
          const de=await fetch(AUTH_URL+"/expenses",{headers:{"Authorization":"Bearer "+API.token}}).then(r=>r.ok?r.json():{expenses:[]});
          applyExpensesApiPayload(de,{setUsers,setExpenses});
        }catch(e){/* non-fatal */}

      }catch(e){
        // Non-fatal — keep token, user must log in manually
        appLog("warn","auth:restore_failed",{error:e?.message||"unknown"});
      }
    })();
  },[]);
  useEffect(()=>{try{if(localStorage.getItem("sol-lang")==null)localStorage.setItem("sol-lang","es");}catch(e){}},[]);
  const t=React.useMemo(()=>mkT(),[]);
  const [ivaRates,setIvaRates]=useState(()=>readIvaRates());
  const saveIvaRates=useCallback(rates=>{
    const n=normalizeIvaRatesPayload(rates);
    lsSet(IVA_RATES_KEY,n);
    setIvaRates(readIvaRates());
    try{
      const raw=localStorage.getItem(IVA_DEFAULT_KEY);
      if(raw===null||raw===""){localStorage.setItem(IVA_DEFAULT_KEY,JSON.stringify(n[0].value));return;}
      const v=JSON.parse(raw);
      if(v===null)return;
      if(typeof v!=="number"||isNaN(v)||!n.some(r=>r.value===v))localStorage.setItem(IVA_DEFAULT_KEY,JSON.stringify(n[0].value));
    }catch(e){}
  },[]);

  const [view,    setViewState]    =useState("dashboard");
  const parseViewFromPath=useCallback((pathname)=>{
    const raw=String(pathname||"/").split("?")[0].split("#")[0];
    const seg=raw.replace(/^\/+/,"").split("/")[0]||"";
    if(seg==="serverSettings")return"settings";
    return VALID_VIEWS.has(seg)?seg:"dashboard";
  },[]);
  const setView=useCallback((nextView)=>{
    const mapped=nextView==="serverSettings"?"settings":nextView;
    const safeView=VALID_VIEWS.has(mapped)?mapped:"dashboard";
    setViewState(safeView);
    if(typeof window==="undefined"||!user)return;
    window.history.pushState({view:safeView,overlay:null,detailId:null},"","/"+safeView);
  },[user]);
  const [detailId,setDetailId]=useState(null);
  const [panel,   setPanel]   =useState(null);
  /** Last overlay entry we pushed into history — keeps UI ↔ history.back() in sync. */
  const overlayHistRef=useRef(null);
  /** Skip one overlay→history sync (after popstate or intentional replace). */
  const histQuietRef=useRef(false);
  const resetFormRef=useRef(()=>{});
  const panelRef=useRef(panel);
  panelRef.current=panel;
  const [expFlt,  setExpFlt]  =useSessionState("sol-flt-status",[]);
  const [expSrc,  setExpSrc]  =useState("");
  const [catFlt,  setCatFlt]  =useSessionState("sol-flt-cat",[]);
  const [submFlt, setSubmFlt] =useSessionState("sol-flt-subm",[]);
  const [dateFrom,setDateFrom]=useSessionState("sol-flt-from","");   // YYYY-MM-DD or ""

  const capturePhoto=()=>{
    const v=videoRef.current;
    if(!v)return;
    if(capturingRef.current)return;
    capturingRef.current=true;
    if(captureTimeoutRef.current){
      clearTimeout(captureTimeoutRef.current);
      captureTimeoutRef.current=null;
    }

    const doCapture=async(isRetry)=>{
      /* Spec: if (capturingRef.current) return; capturingRef.current = true;
         Implemented synchronously in capturePhoto() before scheduling so double-clicks cannot race the 300ms delay. */
      try{
        const stream=v.srcObject;
        if(stream&&window.ImageCapture){
          const track=stream.getVideoTracks()[0];
          if(track){
            const imageCapture=new ImageCapture(track);
            const blob=await imageCapture.takePhoto();
            const blobUrl=URL.createObjectURL(blob);
            const img=new Image();
            img.onload=()=>{
              URL.revokeObjectURL(blobUrl);
              const c=document.createElement("canvas");
              c.width=img.naturalWidth;
              c.height=img.naturalHeight;
              const ctx=c.getContext("2d");
              if(!ctx){
                capturingRef.current=false;
                void doCapture();
                return;
              }
              ctx.fillStyle="#FFFFFF";
              ctx.fillRect(0,0,c.width,c.height);
              ctx.drawImage(img,0,0);
              const url=c.toDataURL("image/jpeg",0.92);
              const b64=url.split(",")[1];
              if(receiptAltHandlerRef.current){
                receiptAltHandlerRef.current({b64,type:"image/jpeg",preview:url});
                appLog("info","receipt_captured",{source:"camera"});
                capturingRef.current=false;
                stopCam();
                return;
              }
              setRecPrev(url);
              setReceipt({b64,type:"image/jpeg"});
              appLog("info","receipt_captured",{source:"camera"});
              capturingRef.current=false;
              stopCam();
            };
            img.onerror=()=>{
              URL.revokeObjectURL(blobUrl);
              capturingRef.current=false;
              void doCapture();
            };
            img.src=blobUrl;
            return;
          }
        }
      }catch(e){
        capturingRef.current=false;
        capturingRef.current=true;
      }

      const w=v.videoWidth;
      const h=v.videoHeight;
      if(!w||!h){
        captureTimeoutRef.current=setTimeout(()=>{void doCapture(true);},200);
        return;
      }
      const c=document.createElement("canvas");
      c.width=w;
      c.height=h;
      const ctx=c.getContext("2d");
      if(!ctx){
        capturingRef.current=false;
        return;
      }
      ctx.fillStyle="#FFFFFF";
      ctx.fillRect(0,0,w,h);
      ctx.drawImage(v,0,0,w,h);
      const url=c.toDataURL("image/jpeg",0.92);
      if(receiptAltHandlerRef.current){
        receiptAltHandlerRef.current({b64:url.split(",")[1],type:"image/jpeg",preview:url});
        appLog("info","receipt_captured",{source:"camera"});
        capturingRef.current=false;
        stopCam();
        return;
      }
      setRecPrev(url);
      setReceipt({b64:url.split(",")[1],type:"image/jpeg"});
      appLog("info","receipt_captured",{source:"camera"});
      capturingRef.current=false;
      stopCam();
    };

    captureTimeoutRef.current=setTimeout(()=>{void doCapture(false);},300);
  };

  const MAX_BROWSER_TIMEOUT_MS = 2147483647; // browser setTimeout clamp (~24.8 days)

      scheduleIdleExpiry();
    }, Math.min(remaining, MAX_BROWSER_TIMEOUT_MS));

    let newApprovals=oldExp.approvals;
    let nextSeen=oldExp.seenBy||[];
    if((wasApproved||wasRejected||wasSubmitted)&&relevantChanged){
      newApprovals={};
      const approverIdsRc=effectiveExpenseApproverIds({departmentId:updates.departmentId||oldExp.departmentId},cats,users);
      let trailExtra=[...newTrail];
      if(wasApproved&&approverIdsRc.includes(user.id)){
        newApprovals={[user.id]:"approved"};
        trailExtra=[...trailExtra,{action:"auto_approved",by:user.id,at:now,meta:{reason:"submitter_is_approver"}}];
      }
      newTrail=[...trailExtra,{action:"reapproval_required",by:user.id,at:now}];
      nextSeen=seenByAfterActor(user.id);
      appLog("info","expense_reapproval",{itemCode:oldExp.itemCode,userId:user.id});
    }
    const updated={
      ...oldExp,
      ...updates,
      ...((wasApproved||wasRejected||wasSubmitted)&&relevantChanged?{status:'submitted'}:{}),
      approvals:newApprovals,
      auditTrail:newTrail,
      seenBy:nextSeen,
    };
    saveExp(expenses.map(e=>e.id===expId?updated:e));
    appLog("info","expense_edited",{itemCode:oldExp.itemCode,userId:user.id,relevantChanged,wasApproved});
    if(wasApproved&&relevantChanged)dispatchSolanaToast(t("expense.reapprovalDone"),"info");
    return Promise.resolve();
  };

  const fixResubmitExpense=(expId)=>{
    const exp=expenses.find(e=>e.id===expId);
    if(!exp||getItemStatus(exp,cats,users)!=="rejected"||exp.submittedBy!==user.id)return;
    if(AUTH_URL){
      void (async()=>{
        try{
          const expApproverIdsRs=effectiveExpenseApproverIds(exp,cats,users);
          await API.put("/expenses/"+encodeURIComponent(expId),{status:"submitted",approvalRequired:expApproverIdsRs});
          const full=await API.get("/expenses");
          applyExpensesApiPayload(full,{setUsers,setExpenses});
        }catch(e){
          if(isOfflineQueuedError(e)){
            const expApproverIdsRs=effectiveExpenseApproverIds(exp,cats,users);
            const baseTr=[{action:"submitted",by:exp.submittedBy,at:new Date().toISOString()}];
            const{approvals:ra,auditTrail:tr}=autoApprove(exp.submittedBy,expApproverIdsRs,{},baseTr);
            const allR=expApproverIdsRs.length>0&&expApproverIdsRs.every(id=>ra[id]==="approved");
            saveExp(expenses.map(x=>x.id!==expId?x:{...x,status:allR?"approved":"submitted",approvals:ra,approvalRequired:expApproverIdsRs,auditTrail:[...(x.auditTrail||[]),...tr]}));
            return;
          }
          dispatchSolanaToast(e.message||"No se pudo reenviar.","error");
        }
      })();
      return;
    }
    const now=new Date().toISOString();
    saveExp(expenses.map(e=>e.id!==expId?e:{
      ...e,
      approvals:{},
      seenBy:seenByAfterActor(user.id),
      auditTrail:[...(e.auditTrail||[]),{action:"resubmitted",by:user.id,at:now}],
    }));
    appLog("info","expense_fix_resubmit",{itemCode:exp.itemCode,userId:user.id});
  };
  const addExpenseComment=(expId,text)=>{
    const tx=(text||"").trim();
    if(!tx)return;
    const exp=expenses.find(e=>e.id===expId);
    if(!exp)return;
    const at=new Date().toISOString();
    const c={id:genUuid(),by:user.id,at:at,text:tx};
    if(AUTH_URL){
      void (async()=>{
        try{
          await API.post("/expenses/"+encodeURIComponent(expId)+"/comments",{text:tx});
          const full=await API.get("/expenses");
          applyExpensesApiPayload(full,{setUsers,setExpenses});
        }catch(e){
          if(isCommentPostUnavailable(e)){
            dispatchSolanaToast(t("expense.commentRetryHint"),"error");
            saveExp(expenses.map(x=>x.id!==expId?x:{
              ...x,
              comments:[...(x.comments||[]),c],
              seenBy:seenByAfterActor(user.id),
              auditTrail:[...(x.auditTrail||[]),{action:"comment_added",by:user.id,at:at,note:tx}],
            }));
            return;
          }
          dispatchSolanaToast(t("expense.commentFailed"),"error");
        }
      })();
      return;
    }
    saveExp(expenses.map(e=>e.id!==expId?e:{
      ...e,
      comments:[...(e.comments||[]),c],
      seenBy:seenByAfterActor(user.id),
      auditTrail:[...(e.auditTrail||[]),{action:"comment_added",by:user.id,at:at,note:tx}],
    }));
  };
  const markCommentsSeen=(expId)=>{
    const exp=expenses.find(e=>e.id===expId);
    if(!exp)return;
    const now=Date.now();
    const applyLocal=()=>{
      try{
        const key="sol-comments-seen-"+user.id;
        const map=JSON.parse(localStorage.getItem(key)||"{}");
        map[expId]=now;
        localStorage.setItem(key,JSON.stringify(map));
      }catch(e){}
      saveExp(prev=>prev.map(e=>e.id!==expId?e:{...e,commentsSeenAt:now}));
    };
    if(AUTH_URL){
      void (async()=>{
        try{
          await API.post("/expenses/"+encodeURIComponent(expId)+"/mark-comments-seen",{});
          saveExp(prev=>prev.map(e=>e.id!==expId?e:{...e,commentsSeenAt:now}));
        }catch(e){applyLocal();}
      })();
      return;
    }
    applyLocal();

  const stopRecurrence=(expId)=>{
    const exp=expenses.find(e=>e.id===expId);
    if(!exp)return;
    const isOwner=exp.submittedBy===user.id||(exp.ownerId&&exp.ownerId===user.id);
    if(!isOwner&&!isAdmin)return;
    void (async()=>{
      const ok=await confirmUI("¿Detener la recurrencia? Las ocurrencias futuras dejarán de mostrarse en el calendario.");
      if(!ok)return;
      if(AUTH_URL){
        try{
          const result=await API.post("/expenses/"+encodeURIComponent(expId)+"/stop-recurrence",{});
          const updated=result?.expense?expenseFromApi(result.expense):null;
          const seriesId=updated?.recurrenceSeriesId||exp.recurrenceSeriesId||expId;
          const endDate=updated?.recurrenceEndDate||new Date().toISOString().slice(0,10);
          saveExp(prev=>prev.map(e=>{
            const sid=e.recurrenceSeriesId||e.id;
            if(sid!==seriesId&&e.id!==expId)return e;
            if(e.id===expId||e.id===seriesId)return updated?{...e,...updated,recurring:0,recurrenceEndDate:endDate}:e;
            return e;
          }));
          dispatchSolanaToast("Recurrencia detenida.","info");
        }catch(err){
          dispatchSolanaToast(err?.message||"No se pudo detener la recurrencia.","error");
        }
        return;
      }
      const today=new Date().toISOString().slice(0,10);
      const seriesId=exp.recurrenceSeriesId||expId;
      saveExp(prev=>prev.map(e=>{
        const sid=e.recurrenceSeriesId||e.id;
        if(sid!==seriesId&&e.id!==expId)return e;
        if(e.id===expId||e.id===seriesId)return{...e,recurring:0,recurrenceEndDate:today};
        return e;
      }));
      dispatchSolanaToast("Recurrencia detenida.","info");
    })();

  /* ── APPROVE ────────────────────────────────────────────────────────────── */
  const approve=async(itemId,action)=>{
    if (action === "rejected") {
      const item = expenses.find(x => x.id === itemId);
      const isFullyApproved = item && (
        item.status === "approved" ||
        (item._apiType === "expense" && item.status === "approved")
      );
      if (isFullyApproved) {
        const confirmed = await confirmUI(
          "Este gasto ha sido aprobado por todos los revisores. ¿Seguro que quieres rechazarlo? Esta acción revertirá la aprobación completa."
        );
        if (!confirmed) return;
      }
    }
    const note=aNote[itemId]||"";
    const item=expenses.find(x=>x.id===itemId);
    if (action === "rejected") {
      const noteVal = (aNote[itemId] || "").trim();
      if (noteVal.length < 10) {
        dispatchSolanaToast("Escribe un motivo de rechazo (mínimo 10 caracteres).", "error");
        return;
      }
    }
    appLog("info","item_"+action,{itemId,itemCode:item?.itemCode,userId:user.id,note:note||undefined});
    if(AUTH_URL){
      if(item&&item._pendingSync){
        dispatchSolanaToast("Este ítem aún no está en el servidor; sincroniza antes de aprobar.","error");
        return;
      }
      void (async()=>{
        try{
          let postResult;
          if(action==="approved"){
            postResult=await API.post("/expenses/"+encodeURIComponent(itemId)+"/approve",{note:note||undefined});
            if(postResult?.budgetExceeded?.exceeded){
              const be=postResult.budgetExceeded;
              dispatchSolanaToast(
                `Presupuesto excedido: ${be.departmentName||"Departamento"} · ${fmt(Number(be.spent)||0)} de ${fmt(Number(be.budget)||0)}`,
                "warning"
              );
            }
          }else{
            postResult=await API.post("/expenses/"+encodeURIComponent(itemId)+"/reject",{note:note||undefined});
          }
          const full=await API.get("/expenses");
          if(full&&postResult?.expense&&Array.isArray(full.expenses)){
            full.expenses=full.expenses.map(ex=>ex.id===postResult.expense.id?postResult.expense:ex);
          }
          if(full)applyExpensesApiPayload(full,{setUsers,setExpenses});
          if(action==="rejected"){
            saveExp(prev=>prev.map(x=>{
              if(x.id!==itemId)return x;
              const fromApi=postResult?.expense?expenseFromApi(postResult.expense):null;
              return mergeRejectedExpenseClientRow(fromApi?{...fromApi}:{...x},user.id,note);
            }));
          }
        }catch(e){
          if(isOfflineQueuedError(e)){
            saveExp(prev=>prev.map(x=>{
              if(x.id!==itemId)return x;
              if(action==="rejected"){
                return mergeRejectedExpenseClientRow(x,user.id,note);
              }
              if(x._apiType==="expense"&&Array.isArray(x.approvalRequired)&&x.approvalRequired.length>0){
                const newApprovals={...(x.approvals||{}),[user.id]:"approved"};
                const reqCanon=canonicalApproverIdList(x.approvalRequired,users);
                const all=reqCanon.length>0&&reqCanon.every(id=>newApprovals[id]==="approved");
                return{...x,approvals:newApprovals,...(all?{status:"approved"}:{})};
              }
              return{...x,status:"approved"};
            }));
            setANote(p=>({...p,[itemId]:""}));
            return;
          }
          dispatchSolanaToast(e.message||"Error al procesar.","error");
          try{
            const full=await API.get("/expenses");
            if(full)applyExpensesApiPayload(full,{setUsers,setExpenses});
          }catch(refreshErr){}
          return;
        }
        setANote(p=>({...p,[itemId]:""}));
      })();
      return;
    }
    saveExp(prev=>prev.map(e=>{
      if(e.id!==itemId)return e;
      if(action==="rejected"){
        return mergeRejectedExpenseClientRow(e,user.id,note);
      }
      return{...e,approvals:{...e.approvals,[user.id]:action},auditTrail:[...e.auditTrail,{action,by:user.id,at:new Date().toISOString(),note}],seenBy:seenByAfterActor(user.id)};
    }));
    setANote(p=>({...p,[itemId]:""}));
  };

      dispatchSolanaToast(t("expense.reconsiderDone"),"info");

        dispatchSolanaToast(t("signup.serverDown"),"error");

      void (async()=>{
        try{
          const d=await API.post("/expenses/"+encodeURIComponent(itemId)+"/reconsider",{});
          const full=await API.get("/expenses");
          if(full&&d?.expense&&Array.isArray(full.expenses)){
            full.expenses=full.expenses.map(ex=>ex.id===d.expense.id?d.expense:ex);
          }
          if(full)applyExpensesApiPayload(full,{setUsers,setExpenses});
          saveExp(prev=>prev.map(x=>{
            if(x.id!==itemId)return x;
            const fromApi=d?.expense?expenseFromApi(d.expense):null;
            return mergeReconsideredExpenseClientRow(fromApi?{...fromApi}:{...x},user.id);
          }));
          dispatchSolanaToast(t("expense.reconsiderDone"),"info");
        }catch(e){
          if(isOfflineQueuedError(e)||(typeof navigator!=="undefined"&&!navigator.onLine&&isNetworkError(e))){
            applyLocalReconsider();
            return;
          }
          dispatchSolanaToast(e.message||t("msg.genericShort"),"error");
          try{
            const full=await API.get("/expenses");
            if(full)applyExpensesApiPayload(full,{setUsers,setExpenses});
          }catch(refreshErr){}
        }
      })();
      return;

    applyLocalReconsider();
  };

  /* ── EARLY RETURN — after all hooks, before derived values that need user ── */
  if(!user)return<div style={{position:"relative",minHeight:"100vh",background:G}}>
    <div style={{opacity:appReady?1:0,transition:"opacity 400ms cubic-bezier(0.22,1,0.36,1)",transitionDelay:appReady?"600ms":"0ms"}}>
      <LoginScreen users={users} onLogin={u=>{appLog("info","auth:login",{userId:u.id,role:u.role});try{localStorage.setItem(LAST_ACTIVITY_KEY,String(Date.now()));}catch(e){}setIdleTrackingEnabled(true);setUser(u);}} passwords={passwords} sessionRestoreAttempted={sessionRestoreAttempted}/>
    </div>
    <div style={{position:"fixed",inset:0,background:G,display:"flex",alignItems:"center",justifyContent:"center",pointerEvents:"none",opacity:appReady?0:1,transform:appReady?"translateY(-40%)":"translateY(0)",transition:"transform 400ms cubic-bezier(0.22,1,0.36,1), opacity 400ms cubic-bezier(0.22,1,0.36,1)",transitionDelay:appReady?"600ms":"0ms"}}>
      <div style={{opacity:1}}><SolanaLogo theme="light" size="lg"/></div>
    </div>
  </div>;
  // F3: Force password change for users created with a temporary password
  console.log("[AUTH] mustChangePassword:", user?.mustChangePassword, user?.id);
  if(user.mustChangePassword)return<ForcePasswordChange
    user={user} passwords={passwords} savePasswords={savePasswords}
    saveUsers={saveUsers} users={users}
    onSignOut={onSignOut}
    onDone={updated=>{setUser(updated);appLog("info","auth:forced_pw_done",{userId:updated.id});}}
  />;
  // auth:session logged only at login transition — not on every render

  /* ── DERIVED (user is guaranteed set below this line) ────────────────────── */
  // Plain consts — hooks cannot appear after a conditional return (Rules of Hooks).
  // t and adminIds are memoized above the early returns where it is safe.
  const expVisible=expenses.filter(e=>getItemStatus(e,cats,users)!=="deleted");
  const byStatus={
    all:expVisible,
    pending:expVisible.filter(e=>getItemStatus(e,cats,users)==="pending"),
    approved:expVisible.filter(e=>getItemStatus(e,cats,users)==="approved"),
    rejected:expVisible.filter(e=>getItemStatus(e,cats,users)==="rejected"),
  };
  const filteredBase=(()=>{
    const statusSel=asMultiFilter(expFlt);
  const catSel=asMultiFilter(catFlt);
  const submSel=asMultiFilter(submFlt);
  const kindSel=asMultiFilter(expKindFlt);
    let base=expVisible;
    if(statusSel.length>0){
      base=expVisible.filter(e=>statusSel.includes(getItemStatus(e,cats,users)));
    }
    return base.filter(e=>{
    const src=expSrc.toLowerCase().trim();
    if(src){
      const matchDesc=e.description.toLowerCase().includes(src);
      const matchCode=(e.traceCode||e.itemCode||"").toLowerCase().includes(src);
      const matchVendor=e.expenseType==="invoice"&&String(e.vendor||"").toLowerCase().includes(src);
      if(!matchDesc&&!matchCode&&!matchVendor)return false;
    }
    if(catSel.length>0&&!catSel.includes(e.category))return false;
    if(submSel.length>0){
      const matchesSubm=submSel.some(id=>e.submittedBy===id);
      const matchesOwner=submSel.some(id=>e.ownerId===id);
      if(!matchesSubm&&!matchesOwner)return false;
    }
    const refDate=effectiveDate(e);
    if(dateFrom&&refDate<dateFrom)return false;
    if(dateTo&&refDate>dateTo)return false;
    if(kindSel.length>0){
      const kind=e.expenseType==="invoice"?"invoice":"expense";
      if(!kindSel.includes(kind))return false;
    }
    return true;
  });
  })();
  const recurringSel=asMultiFilter(recurringFlt);
  let recurringFiltered = filteredBase;
  if (recurringSel.includes("recurring")) {
    recurringFiltered = filteredBase.filter(e => expenseIsRecurringNonOnce(e));
  }
  const filtered=recurringFiltered;
  const dateFilterActive = dateFrom !== "" || dateTo !== "";
  const catOptionCount=cats.filter(c=>!c.archived).length;
  const submOptionCount=(users||[]).filter(u=>u.accountStatus==="active"&&u.id!=="system").length;
  const activeFilterCount = [
    isMultiFilterActive(expFlt,3) ? "status" : "",
    isMultiFilterActive(catFlt,catOptionCount) ? "cat" : "",
    isMultiFilterActive(submFlt,submOptionCount) ? "subm" : "",
    dateFilterActive ? "range" : "",
    isMultiFilterActive(expKindFlt,2) ? "kind" : "",
    isMultiFilterActive(recurringFlt,1) ? "recurring" : "",
  ].filter(Boolean).length;
  const isApprover = Object.values(deptApprovers || {}).some(
    ids => Array.isArray(ids) && ids.includes(user?.id)
  );
  const myPending=AUTH_URL
    ?expenses.filter(e=>{
      if(e._apiType!=="expense"||e._pendingSync)return false;
      if(getItemStatus(e,cats,users)!=="pending")return false;
      const ids=effectiveExpenseApproverIds(e,cats,users);
      return ids.includes(user.id)&&approvalVoteFor(e.approvals,user.id,users)!=="approved";
    })
    :expenses.filter(e=>{
      const ids=effectiveExpenseApproverIds(e,cats,users);
      return ids.includes(user.id)&&getItemStatus(e,cats,users)==="pending"&&approvalVoteFor(e.approvals,user.id,users)!=="approved";
    });
  /* Approved: totApproved = sum EUR per ítem aprobado (all expenseType); per-person = titular/owner + paidBy share */
  const approvedForTot=expenses.filter(e=>getItemStatus(e,cats,users)==="approved");
  const totApproved=approvedForTot.reduce((s,e)=>s+eurForExpense(e),0);
  const perPerson=(users||[])
    .filter(u=>u.accountStatus==="active"&&u.id!=="system")
    .map(u=>{
      const userExps=expenses.filter(e=>{
        if(getItemStatus(e,cats,users)==="deleted")return false;
        const isOwner=e.userId===u.id||e.ownerId===u.id||e.submittedBy===u.id;
        const inSplit=Array.isArray(e.paidBy)&&e.paidBy.some(p=>p&&p.userId===u.id);
        return isOwner||inSplit;
      });
      if(userExps.length===0)return null;
      const total=userExps.reduce((sum,e)=>{
        const split=Array.isArray(e.paidBy)&&e.paidBy.find(p=>p&&p.userId===u.id);
        const amount=split?(Number(split.amount)||0):(Number(e.amount)||0);
        return sum+amount;
      },0);
      return{...u,total};
    })
    .filter(Boolean)
    .sort((a,b)=>b.total-a.total);
  const totFixed=expenses.reduce((s,e)=>{
    if(!expenseIsRecurringNonOnce(e))return s;

  const go=v=>{

      setPanel(null);

      setPanel(null);
    }
  };
  const rpOpen=(panel==="detail"&&detailId)||(panel==="new"&&view==="expenses");
  const totalBadge=myPending.length;
  const expenseNavBadge=expenses.filter(e=>expenseHasUnreadComments(e,user.id)).length;
  const goToMyRejected=()=>{
    myExpFilterClearedRef.current=true;
    setExpFlt(["rejected"]);
    setSubmFlt([user.id]);
    if(typeof window!=="undefined"&&window.history.state&&window.history.state.overlay){
      histQuietRef.current=true;
      overlayHistRef.current=null;
      window.history.replaceState({view:"expenses",overlay:null,detailId:null},"","/expenses");
      setViewState("expenses");

      setView("expenses");

    setPanel(null);

  /* ── NAV ────────────────────────────────────────────────────────────────── */
  const navItems=[
    {id:"dashboard",label:t("nav.dashboard")},
    {id:"expenses", label:t("nav.expenses"),badge:expenseNavBadge},
    {id:"approvals",label:t("nav.approvals"),badge:(isApprover||isAdmin)?totalBadge:0},
    {id:"reports",label:t("nav.reports")},
  ];
  const mobNav=[
    {id:"dashboard",label:t("nav.dashboard"),badge:0},
    {id:"expenses", label:t("nav.expenses"),badge:expenseNavBadge},
    {id:"approvals",label:t("nav.approvals"),badge:(isApprover||isAdmin)?totalBadge:0},
    {id:"reports",label:t("nav.reports"),badge:0},
  ];
  const sessionUser=resolveSessionUser(user,users);
  const mobDetailExp=detailId?expenses.find(e=>e.id===detailId):null;
  const mobDetailTitle=(()=>{
    const desc=String(mobDetailExp?.description||mobDetailExp?.vendor||"").trim();
    if(!desc)return "Detalle de gasto";
    return desc.length>40?desc.slice(0,40)+"…":desc;
  })();

  /* ── CONTEXT VALUE ──────────────────────────────────────────────────────── */
  const ctxVal={
    t,user,users,expenses,cats,passwords,ivaRates,saveIvaRates,
    saveUsers,saveExp,saveCats,savePasswords,
    departments,departmentsWithStats,refreshDepartments,defaultDeptId,
    deptApprovers,saveDeptApprovers,
    isAdmin,isApprover,getUser,ledgerLoading,
    view,setView,go,panel,setPanel,openNew,openNewInvoice,
    detailId,setDetailId,dismissOverlay,
    form,setForm,splitOn,setSplitOn,splits,setSplits,spMode,setSpMode,
    receipt,setReceipt,recPrev,setRecPrev,formError,setFormError,submitting,
    handleReceiptFile,calcEqual,fileRef,startCam,capturePhoto,stopCam,receiptAltHandlerRef,
    submitExp,resetForm,
    aNote,setANote,approve,reconsiderExpense,
    myPending,byStatus,filtered,
    totApproved,totFixed,perPerson,
    expFlt,setExpFlt,expSrc,setExpSrc,activeFilterCount,
    expKindFlt,setExpKindFlt,
    recurringFlt,setRecurringFlt,
    catFlt,setCatFlt,submFlt,setSubmFlt,dateFrom,setDateFrom,dateTo,setDateTo,
    clearMyExpenseFilter,
    importRef,
    removeAttachment,editExp,deleteExp,adminIds,
    fixResubmitExpense,addExpenseComment,markCommentsSeen,stopRecurrence,
    goToMyRejected,
    onSignOut,
    setUser,
  };

  /* ── RENDER ─────────────────────────────────────────────────────────────── */
  return(
    <Ctx.Provider value={ctxVal}>
      <div style={{display:"flex",height:"100vh",width:"100vw",fontFamily:"'DM Sans',system-ui,sans-serif",background:"#F5F0EA",color:"#1a1008",overflow:"hidden",WebkitOverflowScrolling:"touch"}}>
        {AUTH_URL&&!online&&(
          <div style={{position:"fixed",top:0,left:0,right:0,zIndex:7500,background:"rgba(245,240,234,0.95)",color:"#6b4a38",fontSize:11,padding:"7px 14px",textAlign:"center",borderBottom:"1px solid rgba(204,78,0,0.1)",fontWeight:500,pointerEvents:"none"}}>
            Sin conexión, los cambios se guardarán localmente
          </div>
        )}
        <ToastContainer/>
        {confirmModal&&(
          <div className={`modal-overlay${confirmModalClosing?" modal-overlay--closing":" modal-overlay--open"}`}>
            <div className="modal-panel">
              <div style={{fontWeight:700,fontSize:14,color:G,marginBottom:8}}>Confirmación</div>
              <div style={{fontSize:13,color:"#1a1008",lineHeight:1.35,marginBottom:14,whiteSpace:"pre-wrap"}}>{confirmModal.message}</div>
              <div style={{display:"flex",gap:8}}>
                <button type="button" className="btn-secondary" style={{flex:1,fontSize:12,padding:"7px 10px"}} onClick={()=>closeConfirmModal(false)}>Cancelar</button>
                <button type="button" className={confirmModal.destructive?"btn-danger":"btn-primary"} style={{flex:1,fontSize:12,padding:"7px 10px"}} onClick={()=>closeConfirmModal(true)}>{confirmModal.confirmLabel||"Confirmar"}</button>
              </div>
            </div>
          </div>
        )}
        {AUTH_URL&&ledgerLoading&&(
          <div className="overlay-loading overlay-loading--open" style={{background:"rgba(245,240,234,0.88)",fontSize:14,fontWeight:600,color:G}}>
            Cargando datos…
          </div>
        )}
        <style>{`
          *{box-sizing:border-box;}
          h1{font-family:'Playfair Display',serif;font-size:24px;font-weight:600;}
          h2{font-family:'DM Sans',system-ui,sans-serif;font-size:16px;font-weight:600;}
          ::-webkit-scrollbar{width:4px;}::-webkit-scrollbar-thumb{background:rgba(204,78,0,0.2);border-radius:2px;}
          .card{background:#fff;border-radius:11px;padding:14px;box-shadow:0 1px 4px rgba(0,0,0,0.06);}
          .inp{width:100%;background:#FAF7F8;border:1.5px solid #DDD6CC;border-radius:7px;padding:8px 11px;font-size:14px;color:#1a1008;font-family:inherit;transition:border-color var(--motion-duration-micro);outline:none;display:block;}
          .inp:focus{border-color:${G};}
          .expense-form-fields-wrap .inp:focus{border-color:var(--expense-action, ${G})!important;}
          .lbl{font-size:12px;font-weight:600;color:#6B7B72;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:4px;display:block;}
          .btn-primary{background:${G};color:#fff;border:none;padding:9px 18px;border-radius:7px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;}
          .btn-primary:hover{background:${GH};}.btn-primary:disabled{opacity:0.5;cursor:default;}
          .btn-secondary{background:transparent;color:${G};border:1.5px solid ${G};padding:8px 18px;border-radius:7px;font-size:12px;font-weight:500;cursor:pointer;font-family:inherit;}
          .btn-secondary:hover{background:${GL};}
          .btn-sm{background:${G};color:#fff;border:none;padding:6px 12px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap;}
          .btn-danger{background:transparent;color:#991B1B;border:1.5px solid #ECA3A3;padding:8px 18px;border-radius:7px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;}
          .btn-danger:hover{background:#FEE2E2;}
          .row-hover:hover{background:rgba(204,78,0,0.04)!important;}
          /* Smooth transitions on interactive elements */
          .card{transition:box-shadow var(--motion-duration-micro);}
          .card:hover{box-shadow:0 3px 10px rgba(0,0,0,0.09);}
          .row-hover{transition:background var(--motion-duration-micro);}
          .btn-primary,.btn-secondary,.btn-danger,.btn-sm{transition:opacity var(--motion-duration-micro),transform var(--motion-duration-micro) var(--motion-ease-standard),background var(--motion-duration-micro);}
          .btn-primary:active,.btn-secondary:active,.btn-danger:active,.btn-sm:active{transform:scale(0.97);}
          /* Respect reduced motion */
          @media(prefers-reduced-motion:reduce){
            *{animation-duration:0.01ms!important;transition-duration:0.01ms!important;}
          }
          @media(max-width:767px){.dt-only{display:none!important;}}
          @media(min-width:768px){.mob-only{display:none!important;}}
        `}</style>

        {/* Session expired overlay */}
        {sessionExpired&&(
          <div className="modal-overlay modal-overlay--open" style={{zIndex:9999,background:"rgba(245,240,234,0.97)",fontFamily:"'DM Sans',system-ui,sans-serif",backdropFilter:"blur(4px)"}}>
            <div className="modal-panel" style={{borderRadius:16,padding:"36px 32px",maxWidth:380,
              width:"90%",textAlign:"center",
              boxShadow:"0 4px 32px rgba(204,78,0,0.14),0 1px 4px rgba(0,0,0,0.06)",
              border:"1px solid #EDE8E0"}}>
              <div style={{marginBottom:20}}><SolanaLogo theme="dark" size="md" variant="auth"/></div>
              <div style={{fontSize:18,fontWeight:700,color:G,marginBottom:8,
                fontFamily:"'Playfair Display',serif"}}>{t("session.expiredTitle")}</div>
              <p style={{fontSize:13,color:"#9a7860",marginBottom:24,lineHeight:1.6}}>{t("session.expiredMsg")}</p>
              <button style={{width:"100%",background:G,color:"#FAF7F2",border:"none",
                borderRadius:9,padding:"12px",fontSize:15,fontWeight:700,cursor:"pointer",
                fontFamily:"inherit"}}
                onClick={()=>{setSessionExpired(false);}}>
                {t("login.signIn")}
              </button>
            </div>
          </div>
        )}
        {/* Desktop sidebar */}
        <div className="dt-only" style={{width:198,background:G,display:"flex",flexDirection:"column",padding:"15px 8px",flexShrink:0,overflowY:"auto"}}>
          <div style={{padding:"3px 6px 14px",borderBottom:"1px solid rgba(255,255,255,0.09)",marginBottom:9,cursor:"pointer"}} onClick={()=>go("dashboard")}>
            <SolanaLogo theme="light" size="md"/>
            <div className="sidebar-tagline">Gestión de gastos</div>
          </div>
          {navItems.map(n=>(
            <SidebarNavItem key={n.id} active={view===n.id} label={n.label} badge={n.badge} onClick={()=>go(n.id)}/>
          ))}
          <div style={{marginTop:"auto",paddingTop:10,borderTop:"1px solid rgba(255,255,255,0.07)",position:"relative"}}>
            <div style={{marginBottom:8}}>
              <SidebarUserRow
                name={user.name}
                active={view==="settings"}
                open={userMenuOpen}
                onToggle={()=>setUserMenuOpen(v=>!v)}
              />
            </div>
            {userMenuOpen&&(
              <SidebarUserMenu items={[
                {key:"settings",label:t("nav.settings"),fn:()=>{setUserMenuOpen(false);go("settings");}},
                {key:"signout",label:t("nav.signOut"),destructive:true,fn:()=>{
                  setUserMenuOpen(false);
                  setConfirmModal({
                    message:"¿Cerrar sesión?",
                    confirmLabel:t("nav.signOut"),
                    destructive:true,
                    resolve:(ok)=>{if(ok)onSignOut();},
                  });
                }},
              ]}/>
            )}
          </div>
        </div>

        {/* Content area */}
        <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden",minWidth:0,minHeight:0}}>
          {/* Mobile header */}
          <div className="mob-only mob-header-bar" style={{background:G,padding:"8px 12px",display:"flex",alignItems:"center",justifyContent:"space-between",flexShrink:0}}>
            <div style={{cursor:"pointer"}} onClick={()=>go("dashboard")}><SolanaLogo theme="light" size="sm"/></div>
            <div style={{display:"flex",alignItems:"center",gap:10}}>
              <button type="button" onClick={()=>go("settings")} style={{flexShrink:0,maxWidth:140,padding:"4px 8px",display:"flex",alignItems:"center",justifyContent:"center",borderRadius:6,border:"none",background:"transparent",cursor:"pointer",fontFamily:"inherit"}} aria-label={t("nav.settings")}>
                <span style={{fontSize:11,fontWeight:600,color:"#FAF7F2",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{user.name}</span>
              </button>
            </div>
          </div>

          <div style={{flex:1,overflow:"hidden",display:"flex",minWidth:0,minHeight:0}}>
            <div ref={mainScrollRef} className="mob-main-scroll" style={{flex:1,overflowY:"auto",padding:"14px 12px 80px",minWidth:0,WebkitOverflowScrolling:"touch"}}>
              {view==="dashboard"&&<DashboardView/>}
              {view==="expenses" &&<ExpensesView/>}
              {view==="approvals"&&<ApprovalsView/>}
              {view==="reports"  &&<ReportsView/>}
              {view==="settings" &&<SettingsView/>}
            </div>
            {rpOpen&&(
              <div data-testid="detail-panel" className="dt-only panel-slide" style={{width:350,borderLeft:"1px solid #E5DDD2",overflowY:"auto",padding:16,flexShrink:0,minHeight:0,background:"#fff"}}>
                {panel==="new"?<NewPanel/>:<DetailPanel/>}
              </div>
            )}
          </div>

          {/* Mobile bottom nav — badge inline, no absolute positioning */}
          <div className="mob-only" style={{background:"#fff",borderTop:"1px solid #E5DDD2",display:"flex",flexShrink:0,position:"fixed",bottom:0,left:0,right:0,zIndex:50}}>
            {mobNav.map(n=>(
              <div key={n.id} className="mob-nav-item" style={{flex:1,padding:"8px 2px 6px",textAlign:"center",cursor:"pointer",borderTop:`2px solid ${view===n.id?G:"transparent"}`}} onClick={()=>go(n.id)}>
                <span style={{display:"inline-flex",alignItems:"center",justifyContent:"center",gap:4,fontSize:11,fontWeight:view===n.id?700:500,color:view===n.id?G:"#6B7B72",maxWidth:"100%"}}>
                  <span style={{overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{n.label}</span>
                  {n.badge>0&&<span style={{background:NOTIF_BADGE,color:"#fff",borderRadius:10,minWidth:14,height:14,padding:"0 3px",display:"inline-flex",alignItems:"center",justifyContent:"center",fontSize:7,fontWeight:700,flexShrink:0,lineHeight:1}}>{n.badge}</span>}
                </span>
              </div>
            ))}
          </div>
        </div>

        {/* Mobile new expense overlay */}
        {panel==="new"&&view==="expenses"&&(
          <div className="mob-only" style={{position:"fixed",inset:0,background:"#F5F0EA",zIndex:100,display:"flex",flexDirection:"column"}}>
            <div className="mob-overlay-header" style={{background:G,padding:"8px 12px",display:"flex",alignItems:"center",gap:9,flexShrink:0}}>
              <button type="button" className="touch-icon-btn" aria-label="Volver" style={{border:"none",background:"none",color:"#FAF7F2",fontSize:19,cursor:"pointer",lineHeight:1}} onClick={()=>dismissOverlay()}>&#8592;</button>
              <div style={{fontFamily:"'Playfair Display',serif",fontSize:15,color:"#FAF7F2"}}>{form.expenseType==="invoice"?t("dash.newInvoice"):t("form.newExpense")}</div>
            </div>
            <div className="mob-overlay-body" style={{flex:1,overflowY:"auto",padding:12,paddingBottom:18}}><NewPanel/></div>
          </div>
        )}

        {/* Mobile expense detail overlay */}
        {panel==="detail"&&detailId&&(
          <div className="mob-only panel-slide" style={{position:"fixed",inset:0,background:"#F5F0EA",zIndex:100,display:"flex",flexDirection:"column"}}>
            <div className="mob-overlay-header" style={{background:G,padding:"8px 12px",display:"flex",alignItems:"center",gap:9,flexShrink:0}}>
              <button type="button" className="touch-icon-btn" aria-label="Volver" style={{border:"none",background:"none",color:"#FAF7F2",fontSize:19,cursor:"pointer",lineHeight:1}} onClick={()=>dismissOverlay()}>&#8592;</button>
              <div style={{fontFamily:"'Playfair Display',serif",fontSize:15,color:"#FAF7F2",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",minWidth:0,flex:1}}>{mobDetailTitle}</div>
            </div>
            <div className="mob-overlay-body" style={{flex:1,overflowY:"auto",WebkitOverflowScrolling:"touch",padding:12,paddingBottom:72}}><DetailPanel/></div>
          </div>
        )}

        {/* Import file input */}
        <input ref={importRef} type="file" accept="application/json" style={{display:"none"}} onChange={e=>{
          const f=e.target.files?.[0];if(!f)return;
          if(f.size>20*1024*1024){dispatchSolanaToast("Archivo demasiado grande (máx 20 MB para importación JSON).","error");e.target.value="";return;}
          const r=new FileReader();
          r.onload=ev=>{
            try{
              if(AUTH_URL){dispatchSolanaToast("La importación JSON no escribe en el servidor. Desactiva AUTH_URL o usa la API.","error");return;}
              const d=JSON.parse(ev.target.result);
              const errs=[];
              if(d.expenses!==undefined&&!Array.isArray(d.expenses))errs.push("expenses must be array");
              if(!d.expenses&&!d.users&&!d.cats)errs.push("no valid keys found");
              if(Array.isArray(d.expenses)&&d.expenses.length>0&&(typeof d.expenses[0].amount!=="number"))errs.push("expenses malformed");
              if(errs.length>0){dispatchSolanaToast("Import rejected: "+errs.join(", "),"error");return;}
              const counts={};
              if(d.expenses){saveExp(d.expenses);counts.expenses=d.expenses.length;}
              if(d.users){saveUsers(d.users);counts.users=d.users.length;}
              if(d.cats){saveCats(d.cats);counts.cats=d.cats.length;}
              appLog("info","json_imported",{file:f.name,userId:user?.id,...counts});
              dispatchSolanaToast(t("msg.importSuccess"),"info");
            }catch(err){
              appLog("error","json_import_failed",{file:f.name,error:err?.message});
              dispatchSolanaToast(t("msg.invalidFile"),"error");
            }
          };
          r.readAsText(f);e.target.value="";
        }}/>
        {/* Hidden file ref for receipt upload */}
        <input ref={fileRef} type="file" accept="image/*,.heic,.heif,application/pdf" style={{display:"none"}} onChange={handleReceiptFile}/>
        <input ref={camFileRef} type="file" accept="image/*,.heic,.heif" capture="environment" style={{display:"none"}} onChange={handleReceiptFile}/>

        {camOn&&(
          <div style={{position:"fixed",top:0,left:0,right:0,bottom:0,background:"#000",zIndex:9999,display:"flex",flexDirection:"column"}}>
            <video ref={videoRef} autoPlay playsInline muted style={{flex:1,width:"100%",minHeight:0,objectFit:"cover"}}/>
            <canvas ref={canvasRef} style={{display:"none"}}/>
            <div style={{background:"rgba(0,0,0,0.92)",padding:"14px 18px 22px",display:"flex",gap:11,justifyContent:"center",alignItems:"center",flexShrink:0}}>
              <button type="button" style={{background:T,color:"#fff",border:"none",borderRadius:9,padding:"13px 36px",fontSize:16,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}} onClick={capturePhoto}>{t("action.capturePhoto")}</button>
              <button type="button" style={{background:"transparent",color:"rgba(255,255,255,0.6)",border:"1.5px solid rgba(255,255,255,0.22)",borderRadius:9,padding:"13px 20px",fontSize:13,cursor:"pointer",fontFamily:"inherit"}} onClick={stopCam}>{t("action.cancel")}</button>
            </div>
          </div>
        )}
      </div>
    </Ctx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<AppErrorBoundary><SolanaExpenses/></AppErrorBoundary>);
</script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js');
}
</script>
</body>
</html>
